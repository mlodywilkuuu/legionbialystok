<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aktualności | Legion Białystok</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      font-family: Arial, sans-serif;
      color: #fff;

      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(229, 9, 20, 0.14),
          transparent 25%
        ),
        linear-gradient(
          135deg,
          #050506 0%,
          #0b0b0e 55%,
          #14080a 100%
        );

      overflow-x: hidden;
    }

    body.modal-open,
    body.menu-open {
      overflow: hidden;
    }

    button,
    a {
      font-family: inherit;
    }

    /* =========================
       LOADER
    ========================= */

    .loader {
      position: fixed;
      inset: 0;

      z-index: 99999;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at center,
          rgba(229, 9, 20, 0.10),
          transparent 28%
        ),
        linear-gradient(
          135deg,
          #050506 0%,
          #09090c 55%,
          #14080a 100%
        );

      opacity: 1;
      visibility: visible;

      transition:
        opacity 0.6s ease,
        visibility 0.6s ease;
    }

    .loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-inner {
      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 28px;
    }

    .loader-logo {
      width: 125px;
      height: auto;

      display: block;

      animation:
        loaderPulse 1.4s ease-in-out infinite;

      filter:
        drop-shadow(
          0 18px 35px rgba(0, 0, 0, 0.65)
        );
    }

    .loader-line {
      position: relative;

      width: 120px;
      height: 2px;

      overflow: hidden;

      background:
        rgba(255, 255, 255, 0.08);

      border-radius: 20px;
    }

    .loader-line::after {
      content: "";

      position: absolute;

      top: 0;
      left: -50%;

      width: 50%;
      height: 100%;

      background: #e50914;

      animation:
        loaderLine 1.1s ease-in-out infinite;
    }

    @keyframes loaderPulse {
      0%,
      100% {
        transform: scale(1);
        opacity: 0.78;
      }

      50% {
        transform: scale(1.05);
        opacity: 1;
      }
    }

    @keyframes loaderLine {
      from {
        left: -50%;
      }

      to {
        left: 100%;
      }
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 82px;

      padding: 0 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      z-index: 1000;

      background:
        linear-gradient(
          180deg,
          rgba(5, 5, 7, 0.96),
          rgba(5, 5, 7, 0.72),
          rgba(5, 5, 7, 0)
        );
    }

    .header-left {
      display: flex;
      align-items: center;

      gap: 16px;
    }

    .header-right {
      position: relative;
    }

    /* =========================
       HAMBURGER
    ========================= */

    .menu-toggle {
      position: relative;

      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 0;
      background: transparent;

      cursor: pointer;

      z-index: 1200;
    }

    .hamburger {
      position: relative;

      width: 25px;
      height: 18px;
    }

    .hamburger span {
      position: absolute;

      left: 0;

      width: 25px;
      height: 2px;

      border-radius: 10px;

      background: #fff;

      transition:
        top 0.3s ease,
        transform 0.3s ease,
        opacity 0.2s ease,
        width 0.3s ease;
    }

    .hamburger span:nth-child(1) {
      top: 0;
    }

    .hamburger span:nth-child(2) {
      top: 8px;
      width: 18px;
    }

    .hamburger span:nth-child(3) {
      top: 16px;
    }

    .menu-toggle:hover .hamburger span:nth-child(2) {
      width: 25px;
    }

    .menu-toggle.active .hamburger span:nth-child(1) {
      top: 8px;
      transform: rotate(45deg);
    }

    .menu-toggle.active .hamburger span:nth-child(2) {
      opacity: 0;
      transform: translateX(-8px);
    }

    .menu-toggle.active .hamburger span:nth-child(3) {
      top: 8px;
      transform: rotate(-45deg);
    }

    /* =========================
       LOGO
    ========================= */

    .logo {
      width: 64px;
      height: auto;

      display: block;

      filter:
        drop-shadow(
          0 8px 20px rgba(0, 0, 0, 0.55)
        );
    }

    /* =========================
       LANGUAGE
    ========================= */

    .language-wrapper {
      position: relative;
    }

    .language-toggle {
      min-width: 120px;
      height: 42px;

      padding: 0 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 9px;

      border: 0;
      background: transparent;

      color:
        rgba(255, 255, 255, 0.82);

      font-size: 12px;
      font-weight: 700;

      cursor: pointer;
    }

    .flag {
      width: 24px;
      height: 16px;

      flex: 0 0 24px;

      display: block;

      overflow: hidden;

      border-radius: 2px;

      background: transparent;

      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.16);
    }

    .flag svg {
      width: 100%;
      height: 100%;

      display: block;
    }

    .language-arrow {
      font-size: 9px;

      transition:
        transform 0.25s ease;
    }

    .language-toggle.active .language-arrow {
      transform: rotate(180deg);
    }

    .language-menu {
      position: absolute;

      top: 50px;
      right: 0;

      width: 190px;

      padding: 8px;

      background:
        rgba(10, 10, 14, 0.78);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border:
        1px solid rgba(255, 255, 255, 0.08);

      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.28);

      opacity: 0;
      visibility: hidden;

      transform:
        translateY(-8px);

      transition:
        opacity 0.2s ease,
        visibility 0.2s ease,
        transform 0.2s ease;
    }

    .language-menu.active {
      opacity: 1;
      visibility: visible;

      transform:
        translateY(0);
    }

    .language-option {
      width: 100%;
      min-height: 44px;

      padding: 0 12px;

      display: flex;
      align-items: center;

      gap: 11px;

      border: 0;
      background: transparent;

      color:
        rgba(255, 255, 255, 0.66);

      text-align: left;

      font-size: 12px;
      font-weight: 600;

      cursor: pointer;

      transition:
        background 0.2s ease,
        color 0.2s ease;
    }

    .language-option:hover,
    .language-option.active {
      background:
        rgba(255, 255, 255, 0.06);

      color: #fff;
    }

    /* =========================
       SIDE MENU
    ========================= */

    .menu-panel {
      position: fixed;

      top: 0;
      left: 0;

      width:
        min(360px, 88vw);

      height: 100vh;

      padding:
        102px
        28px
        30px;

      background:
        rgba(10, 10, 14, 0.42);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      border-right:
        1px solid rgba(255, 255, 255, 0.08);

      box-shadow:
        20px 0 60px rgba(0, 0, 0, 0.28);

      transform:
        translateX(-105%);

      transition:
        transform
        0.38s
        cubic-bezier(
          0.77,
          0,
          0.18,
          1
        );

      z-index: 900;

      overflow-y: auto;

      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .menu-panel::-webkit-scrollbar {
      display: none;
    }

    .menu-panel.active {
      transform:
        translateX(0);
    }

    .menu-list {
      list-style: none;
    }

    .menu-item {
      border-bottom:
        1px solid rgba(255, 255, 255, 0.06);
    }

    .menu-link,
    .submenu-toggle {
      width: 100%;
      min-height: 48px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border: 0;
      background: transparent;

      color:
        rgba(255, 255, 255, 0.86);

      font-size: 14px;
      font-weight: 700;

      letter-spacing: 1px;
      text-transform: uppercase;

      text-align: left;

      cursor: pointer;

      transition:
        color 0.2s ease,
        padding-left 0.2s ease;
    }

    .menu-link {
      text-decoration: none;
    }

    .menu-link:hover,
    .submenu-toggle:hover {
      color: #fff;
      padding-left: 8px;
    }

    .plus {
      position: relative;

      width: 18px;
      height: 18px;

      flex-shrink: 0;
    }

    .plus::before,
    .plus::after {
      content: "";

      position: absolute;

      top: 50%;
      left: 50%;

      width: 14px;
      height: 2px;

      background: #fff;

      border-radius: 5px;

      transform:
        translate(-50%, -50%);

      transition:
        transform 0.25s ease,
        opacity 0.25s ease;
    }

    .plus::after {
      transform:
        translate(-50%, -50%)
        rotate(90deg);
    }

    .submenu-toggle.active .plus::after {
      opacity: 0;
    }

    .submenu {
      max-height: 0;

      overflow: hidden;

      opacity: 0;

      transition:
        max-height 0.32s ease,
        opacity 0.25s ease;
    }

    .submenu.active {
      max-height: 420px;

      opacity: 1;
    }

    .submenu a {
      min-height: 40px;

      padding-left: 16px;

      display: flex;
      align-items: center;

      color:
        rgba(255, 255, 255, 0.46);

      font-size: 12px;
      font-weight: 600;

      letter-spacing: 0.7px;
      text-transform: uppercase;

      text-decoration: none;

      transition:
        color 0.2s ease,
        padding-left 0.2s ease;
    }

    .submenu a:hover {
      color: #fff;
      padding-left: 22px;
    }

    /* =========================
       MENU OVERLAY
    ========================= */

    .menu-overlay {
      position: fixed;

      inset: 0;

      background:
        rgba(0, 0, 0, 0.35);

      backdrop-filter: blur(3px);

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 0.3s ease,
        visibility 0.3s ease;

      z-index: 800;
    }

    .menu-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    /* =========================
       NEWS PAGE
    ========================= */

    .page-content {
      width: 100%;
      max-width: 1380px;

      min-height: 100vh;

      margin: 0 auto;

      padding:
        145px
        32px
        90px;
    }

    .page-heading {
      margin-bottom: 42px;
    }

    .page-heading h1 {
      font-size:
        clamp(30px, 4vw, 54px);

      font-weight: 800;

      letter-spacing: -1.5px;

      line-height: 1;
    }

    .page-heading-line {
      width: 42px;
      height: 3px;

      margin-top: 18px;

      background: #e50914;

      border-radius: 20px;
    }

    .news-grid {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 18px;
    }

    .news-card {
      min-width: 0;

      border:
        1px solid rgba(255, 255, 255, 0.07);

      border-radius: 16px;

      overflow: hidden;

      background:
        rgba(255, 255, 255, 0.025);

      cursor: pointer;

      transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        background 0.25s ease;
    }

    .news-card:hover {
      transform:
        translateY(-4px);

      border-color:
        rgba(255, 255, 255, 0.14);

      background:
        rgba(255, 255, 255, 0.04);
    }

    .news-image {
      position: relative;

      width: 100%;
      aspect-ratio: 16 / 10;

      overflow: hidden;

      background:
        linear-gradient(
          145deg,
          #17171c,
          #09090c
        );
    }

    .news-image img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      transition:
        transform 0.4s ease;
    }

    .news-card:hover
    .news-image img {
      transform:
        scale(1.035);
    }

    .news-image-placeholder {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at center,
          rgba(229, 9, 20, 0.16),
          transparent 45%
        ),
        #0c0c10;
    }

    .news-image-placeholder img {
      width: 90px;
      height: auto;

      object-fit: contain;

      opacity: 0.30;
    }

    .news-card-content {
      padding: 21px 21px 24px;
    }

    .news-date {
      margin-bottom: 11px;

      color:
        rgba(255, 255, 255, 0.36);

      font-size: 11px;
      font-weight: 700;

      letter-spacing: 0.8px;

      text-transform: uppercase;
    }

    .news-title {
      color: #fff;

      font-size: 20px;
      font-weight: 750;

      line-height: 1.25;

      letter-spacing: -0.3px;
    }

    .news-excerpt {
      margin-top: 11px;

      color:
        rgba(255, 255, 255, 0.48);

      font-size: 13px;

      line-height: 1.6;
    }

    .news-read {
      margin-top: 18px;

      display: inline-flex;
      align-items: center;

      gap: 7px;

      color:
        rgba(255, 255, 255, 0.65);

      font-size: 11px;
      font-weight: 700;

      letter-spacing: 0.4px;

      text-transform: uppercase;
    }

    .news-read-arrow {
      transition:
        transform 0.2s ease;
    }

    .news-card:hover
    .news-read-arrow {
      transform:
        translateX(4px);
    }

    /* =========================
       ARTICLE MODAL
    ========================= */

    .article-modal {
      position: fixed;

      inset: 0;

      z-index: 5000;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px;

      background:
        rgba(0, 0, 0, 0.72);

      backdrop-filter:
        blur(10px);

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 0.3s ease,
        visibility 0.3s ease;
    }

    .article-modal.active {
      opacity: 1;
      visibility: visible;
    }

    .article-window {
      position: relative;

      width:
        min(900px, 100%);

      max-height:
        calc(100vh - 60px);

      overflow-y: auto;

      border:
        1px solid rgba(255, 255, 255, 0.09);

      border-radius: 20px;

      background:
        rgba(9, 9, 12, 0.97);

      box-shadow:
        0 30px 90px rgba(0, 0, 0, 0.55);

      transform:
        translateY(25px)
        scale(0.985);

      transition:
        transform 0.3s ease;

      scrollbar-width: thin;
      scrollbar-color:
        rgba(255, 255, 255, 0.15)
        transparent;
    }

    .article-modal.active
    .article-window {
      transform:
        translateY(0)
        scale(1);
    }

    .article-window::-webkit-scrollbar {
      width: 6px;
    }

    .article-window::-webkit-scrollbar-track {
      background: transparent;
    }

    .article-window::-webkit-scrollbar-thumb {
      background:
        rgba(255, 255, 255, 0.15);

      border-radius: 20px;
    }

    .article-close {
      position: absolute;

      top: 18px;
      right: 18px;

      z-index: 10;

      width: 44px;
      height: 44px;

      display: flex;
      align-items: center;
      justify-content: center;

      border:
        1px solid rgba(255, 255, 255, 0.10);

      border-radius: 50%;

      background:
        rgba(5, 5, 7, 0.70);

      backdrop-filter:
        blur(10px);

      color: #fff;

      font-size: 24px;
      font-weight: 300;

      cursor: pointer;

      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .article-close:hover {
      background:
        rgba(229, 9, 20, 0.75);

      transform:
        rotate(90deg);
    }

    .article-image {
      width: 100%;

      aspect-ratio: 16 / 8;

      overflow: hidden;

      background: #0c0c10;
    }

    .article-image img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
    }

    .article-placeholder {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at center,
          rgba(229, 9, 20, 0.18),
          transparent 45%
        ),
        #0c0c10;
    }

    .article-placeholder img {
      width: 120px;
      height: auto;

      opacity: 0.3;
    }

    .article-content {
      padding:
        42px
        48px
        52px;
    }

    .article-date {
      margin-bottom: 14px;

      color:
        rgba(255, 255, 255, 0.38);

      font-size: 11px;
      font-weight: 700;

      letter-spacing: 1px;

      text-transform: uppercase;
    }

    .article-title {
      max-width: 760px;

      color: #fff;

      font-size:
        clamp(29px, 5vw, 48px);

      font-weight: 800;

      line-height: 1.05;

      letter-spacing: -1.2px;
    }

    .article-text {
      margin-top: 30px;

      color:
        rgba(255, 255, 255, 0.72);

      font-size: 15px;

      line-height: 1.8;
    }

    .article-text p + p {
      margin-top: 20px;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 980px) {
      .news-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 650px) {

      .loader-logo {
        width: 105px;
      }

      .loader-line {
        width: 105px;
      }

      .header {
        height: 72px;
        padding: 0 15px;
      }

      .header-left {
        gap: 10px;
      }

      .logo {
        width: 54px;
      }

      .menu-panel {
        width:
          min(330px, 90vw);

        padding:
          92px
          22px
          30px;
      }

      .menu-link,
      .submenu-toggle {
        min-height: 46px;
      }

      .submenu a {
        min-height: 38px;
      }

      .language-toggle {
        min-width: 105px;
        padding: 0 8px;
      }

      .language-menu {
        width: 175px;
      }

      .flag {
        width: 22px;
        height: 15px;

        flex-basis: 22px;
      }

      .page-content {
        padding:
          115px
          15px
          60px;
      }

      .page-heading {
        margin-bottom: 28px;
      }

      .news-grid {
        grid-template-columns: 1fr;
      }

      .news-card-content {
        padding:
          18px
          18px
          22px;
      }

      .news-title {
        font-size: 19px;
      }

      .article-modal {
        padding: 10px;
      }

      .article-window {
        max-height:
          calc(100vh - 20px);

        border-radius: 16px;
      }

      .article-close {
        top: 12px;
        right: 12px;

        width: 40px;
        height: 40px;
      }

      .article-image {
        aspect-ratio: 16 / 10;
      }

      .article-content {
        padding:
          28px
          22px
          36px;
      }

      .article-title {
        font-size: 30px;
      }

      .article-text {
        font-size: 14px;
        line-height: 1.75;
      }
    }

    @media (
      prefers-reduced-motion:
      reduce
    ) {

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
      }

      .loader-logo,
      .loader-line::after {
        animation: none;
      }
    }
  </style>
</head>

<body>

<!-- =========================
     LOADER
========================= -->

<div
  class="loader"
  id="loader"
>

  <div class="loader-inner">

    <img
      src="/8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png"
      alt="Legion Białystok"
      class="loader-logo"
    >

    <div class="loader-line"></div>

  </div>

</div>


<!-- =========================
     HEADER
========================= -->

<header class="header">

  <div class="header-left">

    <button
      class="menu-toggle"
      id="menuToggle"
      type="button"
      aria-label="Otwórz menu"
    >

      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>

    </button>


    <a href="/" aria-label="Strona główna">

      <img
        src="/8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png"
        alt="Legion Białystok"
        class="logo"
      >

    </a>

  </div>


  <div class="header-right">

    <div class="language-wrapper">

      <button
        class="language-toggle"
        id="languageToggle"
        type="button"
      >

        <span
          class="flag"
          id="currentFlag"
        ></span>

        <span id="currentLanguage">
          Polski
        </span>

        <span class="language-arrow">
          ▼
        </span>

      </button>


      <div
        class="language-menu"
        id="languageMenu"
      >

        <button
          class="language-option active"
          data-lang="pl"
          type="button"
        >
          <span class="flag flag-pl"></span>
          <span>Polski</span>
        </button>

        <button
          class="language-option"
          data-lang="en"
          type="button"
        >
          <span class="flag flag-en"></span>
          <span>English</span>
        </button>

        <button
          class="language-option"
          data-lang="de"
          type="button"
        >
          <span class="flag flag-de"></span>
          <span>Deutsch</span>
        </button>

        <button
          class="language-option"
          data-lang="ru"
          type="button"
        >
          <span class="flag flag-ru"></span>
          <span>Русский</span>

        loaderStartTime;

      const remaining =
        Math.max(
          0,
          minimumLoaderTime - elapsed
        );


      setTimeout(
        function() {

          loader.classList.add(
            "hidden"
          );

        },
        remaining
      );

    }
  );

                role="button"

              </article>
            `;

          }

            "click",
            function() {

              openArticle(
                Number(

              );

            }
          );

            "keydown",
            function(event) {

                event.key === "Enter" ||
                event.key === " "

                event.preventDefault();

                openArticle(
                  Number(

              }

      return;

      news[currentLang] ||
      news.pl;

      createImage(
        news.image,
        "article-placeholder"
      );

      news.date;


    articleTitle.textContent =
      article.title;


    articleText.innerHTML =
      article.content

          function(paragraph) {
            return `
              <p>
                ${paragraph}
              </p>
            `;
          }
        )
        .join("");


    articleClose.setAttribute(
      "aria-label",
      translations[currentLang]
        .close
    );

  }

    currentArticleId = id;

    renderOpenArticle();

      "active"

    articleModal.setAttribute(
      "aria-hidden",
      "false"
    );

    document.body.classList.add(
      "modal-open"
    );


    setTimeout(
      function() {

      100

      "aria-hidden",
      "true"

    document.body.classList.remove(
      "modal-open"

    currentArticleId = null;

  }

    "click",

            );

          }
        );

      }
    );


  /* =========================
     LANGUAGE MENU
  ========================= */

  const languageToggle =
    document.getElementById(
      "languageToggle"
    );

  const languageMenu =
    document.getElementById(
      "languageMenu"
    );

  const currentLanguage =
    document.getElementById(
      "currentLanguage"
    );

  const currentFlag =
    document.getElementById(
      "currentFlag"
    );

  const languageOptions =
    document.querySelectorAll(
      ".language-option"
    );


  function closeLanguageMenu() {

    languageToggle.classList.remove(
      "active"
    );

    languageMenu.classList.remove(
      "active"
    );

  }


  languageToggle.addEventListener(
    "click",
    function(event) {

      event.stopPropagation();

      languageToggle.classList.toggle(
        "active"
      );

      languageMenu.classList.toggle(
        "active"
      );

    }
  );


  document.addEventListener(
    "click",
    function(event) {

      if (
        !languageMenu.contains(
          event.target
        ) &&
        !languageToggle.contains(
          event.target
        )
      ) {

        closeLanguageMenu();

      }

    }
  );


  /* =========================
     LANGUAGE
  ========================= */

  function setLanguage(lang) {

    const selected =
      translations[lang];

    if (!selected) {
      return;
    }


    currentLang = lang;


    document.documentElement.lang =
      lang;


    currentLanguage.textContent =
      selected.language;


    currentFlag.innerHTML =
      flags[lang];


    document
      .querySelectorAll(
        "[data-i18n]"
      )
      .forEach(
        function(element) {

          const key =
            element.dataset.i18n;

          if (
            selected[key]
          ) {

            element.textContent =
              selected[key];

          }

        }
      );


    languageOptions.forEach(
      function(option) {

        option.classList.toggle(
          "active",
          option.dataset.lang ===
          lang
        );

      }
    );


    localStorage.setItem(
      "legion-language",
      lang
    );


    renderNews();


    if (
      currentArticleId !== null
    ) {

      renderOpenArticle();

    }


    closeLanguageMenu();

  }


  languageOptions.forEach(
    function(option) {

      option.addEventListener(
        "click",
        function() {

          setLanguage(
            option.dataset.lang
          );

        }
      );

    }
  );


  /* =========================
     ESC
  ========================= */

  document.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key !==
        "Escape"
      ) {
        return;
      }


      if (
        articleModal.classList.contains(
          "active"
        )
      ) {

        closeArticle();
        return;

      }


      closeMenu();
      closeLanguageMenu();

    }
  );


  /* =========================
     START
  ========================= */

  setLanguage(
    currentLang
  );

</script>

</body>
</html>
