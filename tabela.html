<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tabela | Legion Białystok</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      font-family: Arial, sans-serif;
      color: #fff;

      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(229, 9, 20, 0.14),
          transparent 25%
        ),
        linear-gradient(
          135deg,
          #050506 0%,
          #0b0b0e 55%,
          #14080a 100%
        );

      overflow-x: hidden;
    }

    body.menu-open {
      overflow: hidden;
    }

    button,
    a {
      font-family: inherit;
    }

    /* =========================
       LOADER
    ========================= */

    .loader {
      position: fixed;
      inset: 0;

      z-index: 99999;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at center,
          rgba(229, 9, 20, 0.10),
          transparent 28%
        ),
        linear-gradient(
          135deg,
          #050506 0%,
          #09090c 55%,
          #14080a 100%
        );

      opacity: 1;
      visibility: visible;

      transition:
        opacity 0.6s ease,
        visibility 0.6s ease;
    }

    .loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .loader-logo {
      width: 125px;
      height: auto;

      display: block;

      animation:
        loaderPulse 1.4s ease-in-out infinite;

      filter:
        drop-shadow(
          0 18px 35px rgba(0, 0, 0, 0.65)
        );
    }

    .loader-line {
      position: relative;

      width: 120px;
      height: 2px;

      overflow: hidden;

      background:
        rgba(255, 255, 255, 0.08);

      border-radius: 20px;
    }

    .loader-line::after {
      content: "";

      position: absolute;

      top: 0;
      left: -50%;

      width: 50%;
      height: 100%;

      background: #e50914;

      animation:
        loaderLine 1.1s ease-in-out infinite;
    }

    @keyframes loaderPulse {
      0%,
      100% {
        transform: scale(1);
        opacity: 0.78;
      }

      50% {
        transform: scale(1.05);
        opacity: 1;
      }
    }

    @keyframes loaderLine {
      from {
        left: -50%;
      }

      to {
        left: 100%;
      }
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 82px;

      padding: 0 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      z-index: 1000;

      background:
        linear-gradient(
          180deg,
          rgba(5, 5, 7, 0.96),
          rgba(5, 5, 7, 0.72),
          rgba(5, 5, 7, 0)
        );
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-right {
      position: relative;
    }

    /* =========================
       HAMBURGER
    ========================= */

    .menu-toggle {
      position: relative;

      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 0;
      background: transparent;

      cursor: pointer;

      z-index: 1200;
    }

    .hamburger {
      position: relative;

      width: 25px;
      height: 18px;
    }

    .hamburger span {
      position: absolute;

      left: 0;

      width: 25px;
      height: 2px;

      border-radius: 10px;

      background: #fff;

      transition:
        top 0.3s ease,
        transform 0.3s ease,
        opacity 0.2s ease,
        width 0.3s ease;
    }

    .hamburger span:nth-child(1) {
      top: 0;
    }

    .hamburger span:nth-child(2) {
      top: 8px;
      width: 18px;
    }

    .hamburger span:nth-child(3) {
      top: 16px;
    }

    .menu-toggle:hover .hamburger span:nth-child(2) {
      width: 25px;
    }

    .menu-toggle.active .hamburger span:nth-child(1) {
      top: 8px;
      transform: rotate(45deg);
    }

    .menu-toggle.active .hamburger span:nth-child(2) {
      opacity: 0;
      transform: translateX(-8px);
    }

    .menu-toggle.active .hamburger span:nth-child(3) {
      top: 8px;
      transform: rotate(-45deg);
    }

    /* =========================
       LOGO
    ========================= */

    .logo {
      width: 64px;
      height: auto;

      display: block;

      filter:
        drop-shadow(
          0 8px 20px rgba(0, 0, 0, 0.55)
        );
    }

    /* =========================
       LANGUAGE
    ========================= */

    .language-wrapper {
      position: relative;
    }

    .language-toggle {
      min-width: 120px;
      height: 42px;

      padding: 0 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 9px;

      border: 0;
      background: transparent;

      color:
        rgba(255, 255, 255, 0.82);

      font-size: 12px;
      font-weight: 700;

      cursor: pointer;
    }

    .flag {
      width: 24px;
      height: 16px;

      flex: 0 0 24px;

      display: block;

      overflow: hidden;

      border-radius: 2px;

      background: transparent;

      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.16);
    }

    .flag svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .language-arrow {
      font-size: 9px;

      transition:
        transform 0.25s ease;
    }

    .language-toggle.active .language-arrow {
      transform: rotate(180deg);
    }

    .language-menu {
      position: absolute;

      top: 50px;
      right: 0;

      width: 190px;

      padding: 8px;

      background:
        rgba(10, 10, 14, 0.78);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border:
        1px solid rgba(255, 255, 255, 0.08);

      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.28);

      opacity: 0;
      visibility: hidden;

      transform:
        translateY(-8px);

      transition:
        opacity 0.2s ease,
        visibility 0.2s ease,
        transform 0.2s ease;
    }

    .language-menu.active {
      opacity: 1;
      visibility: visible;

      transform:
        translateY(0);
    }

    .language-option {
      width: 100%;
      min-height: 44px;

      padding: 0 12px;

      display: flex;
      align-items: center;

      gap: 11px;

      border: 0;
      background: transparent;

      color:
        rgba(255, 255, 255, 0.66);

      text-align: left;

      font-size: 12px;
      font-weight: 600;

      cursor: pointer;

      transition:
        background 0.2s ease,
        color 0.2s ease;
    }

    .language-option:hover,
    .language-option.active {
      background:
        rgba(255, 255, 255, 0.06);

      color: #fff;
    }

    /* =========================
       SIDE MENU
    ========================= */

    .menu-panel {
      position: fixed;

      top: 0;
      left: 0;

      width:
        min(360px, 88vw);

      height: 100vh;

      padding:
        102px
        28px
        30px;

      background:
        rgba(10, 10, 14, 0.42);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      border-right:
        1px solid rgba(255, 255, 255, 0.08);

      box-shadow:
        20px 0 60px rgba(0, 0, 0, 0.28);

      transform:
        translateX(-105%);

      transition:
        transform
        0.38s
        cubic-bezier(
          0.77,
          0,
          0.18,
          1
        );

      z-index: 900;

      overflow-y: auto;

      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .menu-panel::-webkit-scrollbar {
      display: none;
    }

    .menu-panel.active {
      transform:
        translateX(0);
    }

    .menu-list {
      list-style: none;
    }

    .menu-item {
      border-bottom:
        1px solid rgba(255, 255, 255, 0.06);
    }

    .menu-link,
    .submenu-toggle {
      width: 100%;
      min-height: 48px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border: 0;
      background: transparent;

      color:
        rgba(255, 255, 255, 0.86);

      font-size: 14px;
      font-weight: 700;

      letter-spacing: 1px;
      text-transform: uppercase;

      text-align: left;

      cursor: pointer;

      transition:
        color 0.2s ease,
        padding-left 0.2s ease;
    }

    .menu-link {
      text-decoration: none;
    }

    .menu-link:hover,
    .submenu-toggle:hover {
      color: #fff;
      padding-left: 8px;
    }

    .plus {
      position: relative;

      width: 18px;
      height: 18px;

      flex-shrink: 0;
    }

    .plus::before,
    .plus::after {
      content: "";

      position: absolute;

      top: 50%;
      left: 50%;

      width: 14px;
      height: 2px;

      background: #fff;

      border-radius: 5px;

      transform:
        translate(-50%, -50%);

      transition:
        transform 0.25s ease,
        opacity 0.25s ease;
    }

    .plus::after {
      transform:
        translate(-50%, -50%)
        rotate(90deg);
    }

    .submenu-toggle.active .plus::after {
      opacity: 0;
    }

    .submenu {
      max-height: 0;
      overflow: hidden;
      opacity: 0;

      transition:
        max-height 0.32s ease,
        opacity 0.25s ease;
    }

    .submenu.active {
      max-height: 420px;
      opacity: 1;
    }

    .submenu a {
      min-height: 40px;

      padding-left: 16px;

      display: flex;
      align-items: center;

      color:
        rgba(255, 255, 255, 0.46);

      font-size: 12px;
      font-weight: 600;

      letter-spacing: 0.7px;
      text-transform: uppercase;

      text-decoration: none;

      transition:
        color 0.2s ease,
        padding-left 0.2s ease;
    }

    .submenu a:hover {
      color: #fff;
      padding-left: 22px;
    }

    /* =========================
       OVERLAY
    ========================= */

    .menu-overlay {
      position: fixed;

      inset: 0;

      background:
        rgba(0, 0, 0, 0.35);

      backdrop-filter:
        blur(3px);

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 0.3s ease,
        visibility 0.3s ease;

      z-index: 800;
    }

    .menu-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    /* =========================
       PAGE
    ========================= */

    .page-content {
      width: 100%;
      max-width: 1380px;

      min-height: 100vh;

      margin: 0 auto;

      padding:
        145px
        32px
        90px;
    }

    .page-heading {
      margin-bottom: 36px;
    }

    .page-heading h1 {
      font-size:
        clamp(30px, 4vw, 54px);

      font-weight: 800;

      letter-spacing: -1.5px;

      line-height: 1;
    }

    .page-heading-line {
      width: 42px;
      height: 3px;

      margin-top: 18px;

      background: #e50914;

      border-radius: 20px;
    }

    /* =========================
       TABLE CARD
    ========================= */

    .table-card {
      width: 100%;

      overflow: hidden;

      border:
        1px solid rgba(255, 255, 255, 0.07);

      border-radius: 18px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.04),
          rgba(255, 255, 255, 0.018)
        );

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .table-info {
      padding:
        20px
        24px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;

      border-bottom:
        1px solid rgba(255, 255, 255, 0.06);
    }

    .league-name {
      font-size: 13px;
      font-weight: 700;

      color:
        rgba(255, 255, 255, 0.72);
    }

    .season {
      font-size: 11px;
      font-weight: 700;

      color:
        rgba(255, 255, 255, 0.34);

      text-transform: uppercase;

      letter-spacing: 0.8px;
    }

    .table-scroll {
      width: 100%;

      overflow-x: auto;

      scrollbar-width: thin;

      scrollbar-color:
        rgba(255, 255, 255, 0.16)
        transparent;
    }

    .table-scroll::-webkit-scrollbar {
      height: 6px;
    }

    .table-scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    .table-scroll::-webkit-scrollbar-thumb {
      background:
        rgba(255, 255, 255, 0.16);

      border-radius: 20px;
    }

    .league-table {
      width: 100%;
      min-width: 820px;

      border-collapse: collapse;

      table-layout: fixed;
    }

    .league-table thead {
      background:
        rgba(255, 255, 255, 0.025);
    }

    .league-table th {
      height: 52px;

      padding: 0 12px;

      color:
        rgba(255, 255, 255, 0.32);

      font-size: 10px;
      font-weight: 700;

      text-transform: uppercase;

      text-align: center;

      letter-spacing: 0.6px;
    }

    .league-table th.team-column {
      text-align: left;
    }

    .league-table td {
      height: 62px;

      padding: 0 12px;

      border-top:
        1px solid rgba(255, 255, 255, 0.05);

      color:
        rgba(255, 255, 255, 0.67);

      font-size: 13px;

      text-align: center;
    }

    .league-table tbody tr {
      transition:
        background 0.2s ease;
    }

    .league-table tbody tr:hover {
      background:
        rgba(255, 255, 255, 0.025);
    }

    .league-table .position {
      width: 54px;

      color:
        rgba(255, 255, 255, 0.36);

      font-weight: 700;
    }

    .league-table .team-cell {
      text-align: left;

      font-weight: 700;

      color:
        rgba(255, 255, 255, 0.85);
    }

    .team-content {
      display: flex;
      align-items: center;

      gap: 12px;

      min-width: 0;
    }

    .club-badge {
      width: 32px;
      height: 32px;

      flex: 0 0 32px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      border-radius: 50%;

      background:
        rgba(255, 255, 255, 0.05);

      border:
        1px solid rgba(255, 255, 255, 0.07);
    }

    .club-badge img {
      width: 26px;
      height: 26px;

      display: block;

      object-fit: contain;
    }

    .club-badge-placeholder {
      color:
        rgba(255, 255, 255, 0.55);

      font-size: 9px;
      font-weight: 800;
    }

    .club-name {
      min-width: 0;

      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .points {
      color: #fff !important;

      font-size: 14px !important;
      font-weight: 800;
    }

    .goal-difference-positive {
      color:
        rgba(119, 214, 133, 0.88) !important;
    }

    .goal-difference-negative {
      color:
        rgba(244, 102, 102, 0.86) !important;
    }

    .legion-row {
      background:
        linear-gradient(
          90deg,
          rgba(229, 9, 20, 0.15),
          rgba(229, 9, 20, 0.05)
        ) !important;
    }

    .legion-row td {
      color: #fff;
    }

    .legion-row .position {
      position: relative;

      color: #fff;
    }

    .legion-row .position::before {
      content: "";

      position: absolute;

      left: 0;
      top: 12px;
      bottom: 12px;

      width: 3px;

      border-radius: 0 10px 10px 0;

      background: #e50914;
    }

    .legion-row .team-cell {
      font-weight: 800;
    }

    /* =========================
       LEGEND
    ========================= */

    .table-legend {
      padding:
        18px
        24px
        22px;

      display: flex;
      flex-wrap: wrap;

      gap:
        10px
        22px;

      border-top:
        1px solid rgba(255, 255, 255, 0.05);
    }

    .legend-item {
      display: flex;
      align-items: center;

      gap: 8px;

      color:
        rgba(255, 255, 255, 0.38);

      font-size: 11px;
    }

    .legend-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background:
        rgba(255, 255, 255, 0.3);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 650px) {

      .loader-logo {
        width: 105px;
      }

      .loader-line {
        width: 105px;
      }

      .header {
        height: 72px;
        padding: 0 15px;
      }

      .header-left {
        gap: 10px;
      }

      .logo {
        width: 54px;
      }

      .menu-panel {
        width:
          min(330px, 90vw);

        padding:
          92px
          22px
          30px;
      }

      .menu-link,
      .submenu-toggle {
        min-height: 46px;
      }

      .submenu a {
        min-height: 38px;
      }

      .language-toggle {
        min-width: 105px;
        padding: 0 8px;
      }

      .language-menu {
        width: 175px;
      }

      .flag {
        width: 22px;
        height: 15px;

        flex-basis: 22px;
      }

      .page-content {
        padding:
          115px
          15px
          55px;
      }

      .page-heading {
        margin-bottom: 28px;
      }

      .table-card {
        border-radius: 14px;
      }

      .table-info {
        padding:
          17px
          18px;
      }

      .league-table th {
        height: 48px;
      }

      .league-table td {
        height: 58px;
      }

      .table-legend {
        padding:
          16px
          18px
          19px;
      }

    }

    @media (
      prefers-reduced-motion:
      reduce
    ) {

      .loader-logo,
      .loader-line::after {
        animation: none;
      }

    }
  </style>
</head>

<body>

<!-- =========================
     LOADER
========================= -->

<div
  class="loader"
  id="loader"
>

  <div class="loader-inner">

    <img
      src="8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png"
      alt="Legion Białystok"
      class="loader-logo"
    >

    <div class="loader-line"></div>

  </div>

</div>


<!-- =========================
     HEADER
========================= -->

<header class="header">

  <div class="header-left">

    <button
      class="menu-toggle"
      id="menuToggle"
      type="button"
      aria-label="Otwórz menu"
    >

      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>

    </button>


    <a
      href="index.html"
      aria-label="Strona główna"
    >

      <img
        src="8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png"
        alt="Legion Białystok"
        class="logo"
      >

    </a>

  </div>


  <div class="header-right">

    <div class="language-wrapper">

      <button
        class="language-toggle"
        id="languageToggle"
        type="button"
      >

        <span
          class="flag"
          id="currentFlag"
        ></span>

        <span id="currentLanguage">
          Polski
        </span>

        <span class="language-arrow">
          ▼
        </span>

      </button>


      <div
        class="language-menu"
        id="languageMenu"
      >

        <button
          class="language-option active"
          data-lang="pl"
          type="button"
        >
          <span class="flag flag-pl"></span>
          <span>Polski</span>
        </button>

        <button
          class="language-option"
          data-lang="en"
          type="button"
        >
          <span class="flag flag-en"></span>
          <span>English</span>
        </button>

        <button
          class="language-option"
          data-lang="de"
          type="button"
        >
          <span class="flag flag-de"></span>
          <span>Deutsch</span>
        </button>

        <button
          class="language-option"
          data-lang="ru"
          type="button"
        >
          <span class="flag flag-ru"></span>
          <span>Русский</span>
        </button>

        <button
          class="language-option"
          data-lang="es"
          type="button"
        >
          <span class="flag flag-es"></span>
          <span>Español</span>
        </button>

      </div>

    </div>

  </div>

</header>


<!-- =========================
     MENU
========================= -->

<aside
  class="menu-panel"
  id="menuPanel"
>

  <ul class="menu-list">

    <li class="menu-item">

      <a
        href="aktualnosci.html"
        class="menu-link"
        data-i18n="news"
      >
        Aktualności
      </a>

    </li>


    <li class="menu-item">

      <a
        href="tabela.html"
        class="menu-link"
        data-i18n="table"
      >
        Tabela
      </a>

    </li>


    <li class="menu-item">

      <button
        class="submenu-toggle"
        type="button"
      >

        <span data-i18n="team">
          Drużyna
        </span>

        <span class="plus"></span>

      </button>


      <div class="submenu">

        <a
          href="pierwszyzespol.html"
          data-i18n="firstTeam"
        >
          I Drużyna
        </a>

        <a
          href="drugadruzyna.html"
          data-i18n="secondTeam"
        >
          II Drużyna
        </a>

        <a
          href="akademia.html"
          data-i18n="academy"
        >
          Akademia
        </a>

      </div>

    </li>


    <li class="menu-item">

      <button
        class="submenu-toggle"
        type="button"
      >

        <span data-i18n="club">
          Klub
        </span>

        <span class="plus"></span>

      </button>


      <div class="submenu">

        <a
          href="o-klubie.html"
          data-i18n="aboutClub"
        >
          O klubie
        </a>

        <a
          href="ludzielegionu.html"

  /* =========================

  ========================= */

  const loader =
    document.getElementById(
      "loader"
    );

  const loaderStartTime =
    Date.now();

  const minimumLoaderTime =
    900;


  window.addEventListener(
    "load",
    function() {

      const elapsed =
        Date.now() -
        loaderStartTime;

      const remaining =
        Math.max(
          0,
          minimumLoaderTime - elapsed
        );


      setTimeout(
        function() {

          loader.classList.add(
            "hidden"
          );

        },
        remaining
      );

    }
  );


  /* =========================
     CLUB BADGE
  ========================= */

  function createClubBadge(
    logo,
    name
  ) {

    if (logo) {

      return `
        <div class="club-badge">

          <img
            src="${logo}"
            alt="${name}"
          >

        </div>
      `;

    }


    const initials =
      name
        .split(" ")
        .map(
          function(word) {
            return word[0];
          }
        )
        .join("")
        .slice(0, 2)
        .toUpperCase();


    return `
      <div class="club-badge">

        <span
          class="club-badge-placeholder"
        >
          ${initials}
        </span>

      </div>
    `;

  }


  /* =========================
     RENDER TABLE
  ========================= */

  function renderTable() {

    const tableBody =
      document.getElementById(
        "tableBody"
      );


    tableBody.innerHTML =
      leagueData.teams
        .map(
          function(team) {

            const goalDifference =
              team.goalsFor -
              team.goalsAgainst;


            let goalDifferenceClass = "";

            if (
              goalDifference > 0
            ) {

              goalDifferenceClass =
                "goal-difference-positive";

            } else if (
              goalDifference < 0
            ) {

              goalDifferenceClass =
                "goal-difference-negative";

            }


            const formattedDifference =
              goalDifference > 0
                ? `+${goalDifference}`
                : goalDifference;


            const legionClass =
              team.name ===
              "Legion Białystok"
                ? "legion-row"
                : "";


            return `

              <tr class="${legionClass}">

                <td class="position">
                  ${team.position}
                </td>


                <td class="team-cell">

                  <div class="team-content">

                    ${createClubBadge(
                      team.logo,
                      team.name
                    )}

                    <span class="club-name">
                      ${team.name}
                    </span>

                  </div>

                </td>


                <td>
                  ${team.played}
                </td>


                <td>
                  ${team.wins}
                </td>


                <td>
                  ${team.draws}
                </td>


                <td>
                  ${team.losses}
                </td>


                <td>
                  ${team.goalsFor}:${team.goalsAgainst}
                </td>


                <td class="${goalDifferenceClass}">
                  ${formattedDifference}
                </td>


                <td class="points">
                  ${team.points}
                </td>

              </tr>

            `;

          }
        )
        .join("");

  }


  /* =========================

  ========================= */

  const menuToggle =
    document.getElementById(
      "menuToggle"

  const menuPanel =
    document.getElementById(
      "menuPanel"

  const menuOverlay =
    document.getElementById(
      "menuOverlay"
    );


  function openMenu() {

    menuToggle.classList.add(
      "active"
    );

    menuPanel.classList.add(
      "active"
    );

    menuOverlay.classList.add(
      "active"
    );

    document.body.classList.add(
      "menu-open"
    );

  }


  function closeMenu() {

    menuToggle.classList.remove(
      "active"
    );

    menuPanel.classList.remove(
      "active"
    );

    menuOverlay.classList.remove(
      "active"
    );

    document.body.classList.remove(
      "menu-open"
    );

  }


  menuToggle.addEventListener(
    "click",
    function() {

      if (
        menuPanel.classList.contains(
          "active"
        )
      ) {

        closeMenu();

      } else {

        openMenu();

      }

    }
  );


  menuOverlay.addEventListener(
    "click",
    closeMenu

  ========================= */

          "click",
          function() {

            const submenu =
              button.nextElementSibling;

            button.classList.toggle(
              "active"
            );

            submenu.classList.toggle(
              "active"
            );

          }
        );

      }
    );

  ========================= */

      "languageToggle"

      "languageMenu"

    document.getElementById(
      "currentLanguage"
    );

  const currentFlag =
    document.getElementById(
      "currentFlag"
    );

  const languageOptions =
    document.querySelectorAll(
      ".language-option"
    );


  function closeLanguageMenu() {

    languageToggle.classList.remove(
      "active"
    );

    languageMenu.classList.remove(
      "active"
    );

  }


  languageToggle.addEventListener(
    "click",
    function(event) {

      event.stopPropagation();

      languageToggle.classList.toggle(
        "active"
      );

      languageMenu.classList.toggle(
        "active"
      );

    }
  );


  document.addEventListener(
    "click",
    function(event) {

      if (
        !languageMenu.contains(
          event.target
        ) &&
        !languageToggle.contains(
          event.target
        )
      ) {

        closeLanguageMenu();

      }

    }
  );


  /* =========================
     SET LANGUAGE
  ========================= */

  function setLanguage(lang) {

    const selected =
      translations[lang];

    if (!selected) {
      return;
    }


    currentLang = lang;


    document.documentElement.lang =
      lang;


    currentLanguage.textContent =
      selected.language;


    currentFlag.innerHTML =
      flags[lang];


    document
      .querySelectorAll(
        "[data-i18n]"
      )
      .forEach(
        function(element) {

          const key =
            element.dataset.i18n;

          if (
            selected[key]
          ) {

            element.textContent =
              selected[key];

          }

        }
      );


    document.getElementById(
      "leagueName"
    ).textContent =
      leagueData.league;


    document.getElementById(
      "season"
    ).textContent =
      selected.seasonPrefix +
      " " +
      leagueData.season;


    languageOptions.forEach(
      function(option) {

        option.classList.toggle(
          "active",
          option.dataset.lang === lang
        );

      }
    );


    localStorage.setItem(
      "legion-language",
      lang
    );


    closeLanguageMenu();

  }


  languageOptions.forEach(
    function(option) {

      option.addEventListener(
        "click",
        function() {

          setLanguage(
            option.dataset.lang
          );

        }
      );

    }
  );


  /* =========================
     ESC
  ========================= */

  document.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key ===
        "Escape"
      ) {

        closeMenu();
        closeLanguageMenu();

      }

    }
  );


  /* =========================

  ========================= */

  renderTable();

  setLanguage(
    currentLang
