<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galeria | Legion Białystok</title><meta name="description" content="Zdjęcia z meczów, treningów i życia Legionu Białystok.">
<link rel="icon" type="image/png" href="/8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:Outfit,Arial,sans-serif;background:#08090d;color:#fff;min-height:100vh;background-image:radial-gradient(circle at 80% 0%,rgba(220,14,36,.18),transparent 35%),radial-gradient(circle at 0% 80%,rgba(60,44,130,.15),transparent 35%)}a{color:inherit}header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:14px max(20px,calc((100vw - 1200px)/2));background:rgba(9,9,13,.9);border-bottom:1px solid #ffffff16;backdrop-filter:blur(16px)}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-size:14px;font-weight:900;letter-spacing:.08em}.brand img{height:46px;width:46px;object-fit:contain}.back{border:1px solid #ffffff30;border-radius:100px;padding:12px 17px;text-decoration:none;font-size:12px;font-weight:800}.back:hover{border-color:#e50914}main{max-width:1240px;margin:auto;padding:70px 20px 110px}.eyebrow{font-size:12px;font-weight:900;color:#ff4a59;letter-spacing:.22em;text-transform:uppercase}.hero h1{font-size:clamp(48px,9vw,106px);line-height:.95;letter-spacing:-.065em;margin:15px 0 20px;font-weight:900}.hero h1 span{background:linear-gradient(110deg,#ff3448,#ad55e9);background-clip:text;-webkit-background-clip:text;color:transparent}.hero p{max-width:650px;color:#a9aab6;line-height:1.6}.meta{margin:32px 0 20px;color:#a9aab6;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.photo{position:relative;display:block;width:100%;aspect-ratio:1;border:1px solid #ffffff16;border-radius:16px;padding:0;overflow:hidden;background:#16161c;cursor:pointer;text-align:left}.photo img{width:100%;height:100%;object-fit:cover;transition:transform .45s;display:block}.photo:hover img{transform:scale(1.055)}.photo .overlay{position:absolute;inset:auto 0 0;padding:40px 16px 15px;background:linear-gradient(transparent,rgba(0,0,0,.78));font-weight:700;font-size:13px;opacity:0;transition:opacity .2s}.photo:hover .overlay,.photo:focus-visible .overlay{opacity:1}.status{padding:38px;border:1px dashed #ffffff28;border-radius:16px;color:#b3b3bf;text-align:center}.hidden{display:none!important}.viewer{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;padding:70px 50px 90px}.viewer img{max-width:100%;max-height:100%;object-fit:contain}.viewer button{position:absolute;background:#24242e;border:1px solid #ffffff30;border-radius:100px;color:#fff;cursor:pointer;font-size:25px;width:46px;height:46px}.viewer .close{top:20px;right:20px}.viewer .prev{left:12px;top:50%}.viewer .next{right:12px;top:50%}.viewer .caption{position:absolute;bottom:22px;left:20px;right:20px;text-align:center;color:#ddd;font-size:14px}.viewer .count{position:absolute;top:30px;left:24px;font-size:12px;color:#bbb}footer{padding:30px 20px;text-align:center;color:#777;border-top:1px solid #ffffff12;font-size:12px}@media(max-width:720px){main{padding-top:45px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.photo{border-radius:10px}.back{font-size:11px;padding:10px 12px}.brand{font-size:11px}.brand img{height:36px;width:36px}.viewer{padding:75px 10px 90px}.viewer .prev{left:7px}.viewer .next{right:7px}}
@media(prefers-reduced-motion:reduce){.photo img{transition:none}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script><script src="/supabase-api.js"></script>
</head><body>
<header><a class="brand" href="/"><img src="/8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png" alt="Logo Legionu"> LEGION BIAŁYSTOK</a><a class="back" href="/">← STRONA GŁÓWNA</a></header>
<main><section class="hero"><div class="eyebrow">Z życia klubu</div><h1>LEGION <span>W KADRZE</span></h1><p></p></section>
<div class="meta" id="meta" aria-live="polite">Wczytywanie zdjęć…</div><div class="grid" id="grid"></div><div class="status hidden" id="status" role="status"></div>
</main><div class="viewer hidden" id="viewer" role="dialog" aria-modal="true" aria-label="Podgląd zdjęcia"><span class="count" id="count"></span><button class="close" id="close" aria-label="Zamknij">×</button><button class="prev" id="prev" aria-label="Poprzednie zdjęcie">‹</button><img id="large" alt=""><button class="next" id="next" aria-label="Następne zdjęcie">›</button><div class="caption" id="caption"></div></div><footer>© Legion Białystok · Galeria klubowa</footer>
<script>
'use strict';
const grid=document.getElementById('grid'), meta=document.getElementById('meta'),statusEl=document.getElementById('status');
const viewer=document.getElementById('viewer'),large=document.getElementById('large'),caption=document.getElementById('caption'),count=document.getElementById('count');
let photos=[],current=0;
function normalize(item,i){const translations=item?.translations||{};const pl=translations.pl||{};return {id:item.id??i,image:item.image||item.url||item.src||'',caption:pl.caption||item.caption||item.title||'Legion Białystok',alt:item.alt||pl.caption||item.caption||'Zdjęcie Legionu',sort_order:Number(item.sort_order??item.order??i+1)||i+1,status:String(item.status||'active').toLowerCase()}}
function extract(data){return Array.isArray(data)?data:Array.isArray(data?.gallery)?data.gallery:Array.isArray(data?.images)?data.images:Array.isArray(data?.photos)?data.photos:[]}
function show(i){if(!photos.length)return;current=(i+photos.length)%photos.length;const p=photos[current];large.src=p.image;large.alt=p.alt;caption.textContent=p.caption;count.textContent=(current+1)+' / '+photos.length;viewer.classList.remove('hidden');document.body.style.overflow='hidden'}
function close(){viewer.classList.add('hidden');large.removeAttribute('src');document.body.style.overflow=''}
document.getElementById('close').onclick=close;document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);
viewer.addEventListener('click',e=>{if(e.target===viewer)close()});document.addEventListener('keydown',e=>{if(viewer.classList.contains('hidden'))return;if(e.key==='Escape')close();if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1)});
function render(){grid.replaceChildren();photos.forEach((p,i)=>{const b=document.createElement('button');b.className='photo';b.type='button';b.setAttribute('aria-label','Otwórz zdjęcie '+(i+1));const img=document.createElement('img');img.src=p.image;img.alt=p.alt;img.loading=i<6?'eager':'lazy';img.decoding='async';const text=document.createElement('span');text.className='overlay';text.textContent=p.caption;b.append(img,text);b.onclick=()=>show(i);grid.appendChild(b)});meta.textContent=photos.length+' zdjęć';if(!photos.length){statusEl.textContent='Na razie nie ma opublikowanych zdjęć.';statusEl.classList.remove('hidden')}}
async function load(){let list=null;let apiError=null;try{const response=await fetch('/api/gallery.php?status=active&limit=1000',{cache:'no-store',credentials:'same-origin'});if(!response.ok)throw Error('HTTP '+response.status);const payload=await response.json();if(payload?.success===false||payload?.error)throw Error(payload.message||payload.error||'Błąd API');list=extract(payload)}catch(e){apiError=e;console.warn('Galeria API:',e)}
if(list===null&&window.LegionSupabase?.client){try{const {data,error}=await window.LegionSupabase.client.from('gallery').select('*').order('sort_order',{ascending:true}).limit(1000);if(error)throw error;list=data||[]}catch(e){console.warn('Galeria Supabase:',e)}}
if(list===null){meta.textContent='Nie udało się pobrać zdjęć';statusEl.textContent='Nie można połączyć się z galerią. Spróbuj odświeżyć stronę.';statusEl.classList.remove('hidden');return}
photos=list.map(normalize).filter(p=>p.image&&!['inactive','hidden','draft','deleted'].includes(p.status)).sort((a,b)=>a.sort_order-b.sort_order);render()}
load();
</script></body></html>
