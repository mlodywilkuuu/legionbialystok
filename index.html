<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sadus zjadł stronę :(</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Outfit", sans-serif;
      background:
        radial-gradient(circle at top, rgba(255, 60, 60, 0.25), transparent 35%),
        radial-gradient(circle at bottom right, rgba(255, 120, 0, 0.22), transparent 35%),
        linear-gradient(135deg, #050505 0%, #111111 45%, #1b0f0f 100%);
      color: #ffffff;
      overflow: hidden;
    }

    .panel {
      width: min(92%, 700px);
      padding: 50px 30px;
      border-radius: 28px;
      text-align: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .logo-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 28px;
    }

    .logo {
      max-width: 260px;
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.45));
    }

    .title {
      font-size: clamp(34px, 5vw, 64px);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -1.5px;
      margin-bottom: 14px;
      background: linear-gradient(90deg, #ffffff 0%, #ffb3b3 45%, #ff6a6a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: clamp(16px, 2vw, 22px);
      font-weight: 400;
      color: rgba(255, 255, 255, 0.82);
      line-height: 1.6;
    }

    .line {
      width: 110px;
      height: 4px;
      margin: 0 auto 24px;
      border-radius: 999px;
      background: linear-gradient(90deg, #ff3c3c, #ff8a00);
    }

    @media (max-width: 600px) {
      .panel {
        padding: 38px 22px;
        border-radius: 22px;
      }

      .logo {
        max-width: 200px;
      }
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="logo-wrap">
      <img
        src="8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png"
        alt="Logo"
        class="logo"
      />
    </div>

    <div class="line"></div>

    <h1 class="title">Sadus zjadł stronę :(</h1>
    <p class="subtitle">
      Trwają prace naprawcze. Wrócimy za chwilę.
    </p>
  </div>
</body>
</html>
