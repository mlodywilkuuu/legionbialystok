<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Legion Białystok</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(229, 9, 20, 0.16),
          transparent 28%
        ),
        linear-gradient(
          135deg,
          #050506 0%,
          #0b0b0e 55%,
          #14080a 100%
        );

      overflow: hidden;
    }

    .logo {
      position: fixed;

      left: 32px;
      top: 50%;

      transform: translateY(-50%);

      width: 140px;
      height: auto;

      display: block;

      filter:
        drop-shadow(0 10px 30px rgba(0, 0, 0, 0.55))
        drop-shadow(0 0 20px rgba(229, 9, 20, 0.12));
    }

    @media (max-width: 600px) {
      .logo {
        left: 20px;
        width: 105px;
      }
    }
  </style>
</head>

<body>

  <img
    src="8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png"
    alt="Legion Białystok"
    class="logo"
  >

</body>
</html>
