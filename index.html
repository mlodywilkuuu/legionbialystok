<!DOCTYPE html>
<html lang="pl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legion Białystok – Oficjalna Strona Klubu</title>
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        gold: {
                            DEFAULT: '#d4af37',
                            light: '#f3e5ab',
                            dark: '#aa8c2c',
                            accent: '#ffd700'
                        },
                        juve: {
                            black: '#0b0b0b',
                            dark: '#121212',
                            card: '#181818',
                            border: '#2a2a2a'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .hero-juve {
            background: linear-gradient(to bottom, rgba(11,11,11,0.85), rgba(11,11,11,0.98)), url('https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=1600&auto=format&fit=crop') center/cover no-repeat;
        }

        /* Płynne, stabilne menu z opóźnieniem chowania */
        .dropdown-container {
            position: relative;
        }
        .dropdown-menu {
            position: absolute;
            top: 100%;
            margin-top: 8px;
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            padding: 0.75rem 0;
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: all 0.2s ease-in-out;
            z-index: 100;
        }
        .dropdown-container:hover .dropdown-menu,
        .dropdown-menu:hover {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        /* Jednolite tło dla rozwijanej sekcji Klub */
        .sub-dropdown-container {
            position: relative;
        }
        .sub-dropdown-menu {
            display: none;
            padding-left: 0.5rem;
            background: #141414;
            margin-top: 0.1rem;
            margin-bottom: 0.1rem;
        }
        .sub-dropdown-container:hover .sub-dropdown-menu {
            display: block;
        }
    </style>
</head>
<body class="bg-[#0b0b0b] text-white font-sans antialiased selection:bg-gold selection:text-black min-h-screen flex flex-col justify-between">

    <!-- GÓRNY PASEK / NAWIGACJA -->
    <header class="w-full bg-[#0b0b0b]/95 backdrop-blur-md border-b border-juve-border px-6 py-4 flex items-center justify-between sticky top-0 z-50">
        
        <!-- LEWA STRONA: ROZWIJANE MENU GŁÓWNE + LOGO -->
        <div class="flex items-center space-x-5">
            <!-- ROZWIJANE MENU GŁÓWNE -->
            <div class="dropdown-container">
                <button class="bg-[#181818] border border-juve-border text-white hover:bg-gold hover:text-black w-12 h-12 rounded-xl flex items-center justify-center transition-all shadow-md focus:outline-none cursor-pointer">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <div class="dropdown-menu left-0 w-64 space-y-1">
                    <a href="index.html" class="block px-5 py-2.5 text-xs font-bold uppercase tracking-wider text-slate-300 hover:bg-gold/10 hover:text-gold transition-colors">Strona główna</a>
                    <a href="druzyna/index.html" class="block px-5 py-2.5 text-xs font-bold uppercase tracking-wider text-slate-300 hover:bg-gold/10 hover:text-gold transition-colors">Pierwsza drużyna</a>
                    <a href="akademia/index.html" class="block px-5 py-2.5 text-xs font-bold uppercase tracking-wider text-slate-300 hover:bg-gold/10 hover:text-gold transition-colors">Akademia</a>
                    <a href="tabela/index.html" class="block px-5 py-2.5 text-xs font-bold uppercase tracking-wider text-slate-300 hover:bg-gold/10 hover:text-gold transition-colors">Tabela</a>
                    <a href="historia/index.html" class="block px-5 py-2.5 text-xs font-bold uppercase tracking-wider text-slate-300 hover:bg-gold/10 hover:text-gold transition-colors">Historia</a>
                    
                    <!-- ROZWIJANA SEKCJA KLUB Z JEDNOLITYM TŁEM -->
                    <div class="sub-dropdown-container border-t border-juve-border my-1 pt-1">
                        <div class="px-5 py-2.5 text-xs font-bold uppercase tracking-wider text-slate-300 hover:bg-gold/10 hover:text-gold flex justify-between items-center cursor-pointer">
                            <span>Klub</span>
                            <span class="text-[10px]">▼</span>
                        </div>
                        <div class="sub-dropdown-menu space-y-1 py-1">
                            <a href="o-klubie/index.html" class="block px-6 py-2 text-xs font-bold uppercase tracking-wider text-slate-400 hover:bg-gold/10 hover:text-gold transition-colors">O klubie</a>
                            <a href="ludzie-legionu/index.html" class="block px-6 py-2 text-xs font-bold uppercase tracking-wider text-slate-400 hover:bg-gold/10 hover:text-gold transition-colors">Ludzie Legionu</a>
                            <a href="kontakt/index.html" class="block px-6 py-2 text-xs font-bold uppercase tracking-wider text-slate-400 hover:bg-gold/10 hover:text-gold transition-colors">Kontakt</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- LOGO -->
            <a href="index.html" class="flex items-center">
                <img src="8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png" alt="Logo Legion" class="h-14 w-auto object-contain cursor-pointer filter drop-shadow">
            </a>
        </div>

        <!-- PRAWA STRONA: ODDZIELNE MENU TŁUMACZENIA -->
        <div class="dropdown-container">
            <button class="bg-[#181818] border border-juve-border text-gold hover:bg-gold hover:text-black px-4 h-12 rounded-xl flex items-center space-x-2 transition-all shadow-md focus:outline-none cursor-pointer text-xs font-black uppercase tracking-wider">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"></path></svg>
                <span id="current-lang-label">PL</span>
                <span class="text-[10px]">▼</span>
            </button>
            <div class="dropdown-menu right-0 w-44 space-y-1">
                <button type="button" onclick="changeLanguage('pl')" class="w-full text-left px-4 py-2.5 text-xs font-bold uppercase tracking-wider text-slate-300 hover:bg-gold/10 hover:text-gold block transition-colors cursor-pointer">🇵🇱 Polski (PL)</button>
                <button type="button" onclick="changeLanguage('en')" class="w-full text-left px-4 py-2.5 text-xs font-bold uppercase tracking-wider text-slate-300 hover:bg-gold/10 hover:text-gold block transition-colors cursor-pointer">🇬🇧 English (EN)</button>
                <button type="button" onclick="changeLanguage('es')" class="w-full text-left px-4 py-2.5 text-xs font-bold uppercase tracking-wider text-slate-300 hover:bg-gold/10 hover:text-gold block transition-colors cursor-pointer">🇪🇸 Español (ES)</button>
                <button type="button" onclick="changeLanguage('ru')" class="w-full text-left px-4 py-2.5 text-xs font-bold uppercase tracking-wider text-slate-300 hover:bg-gold/10 hover:text-gold block transition-colors cursor-pointer">🇷🇺 Русский (RU)</button>
            </div>
        </div>

    </header>

    <!-- GŁÓWNA SEKCJA -->
    <main class="hero-juve flex-1 flex flex-col items-center justify-center text-center px-6 py-32">
        <div class="max-w-3xl space-y-6">
            <!-- Czysta przestrzeń -->
        </div>
    </main>

    <!-- STOPKA -->
    <footer class="w-full bg-[#0b0b0b] border-t border-juve-border py-12 px-6">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6 text-center md:text-left">
            <div class="flex items-center space-x-3">
                <img src="8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png" alt="Logo" class="h-10 w-auto object-contain">
                <span class="text-xs font-black uppercase tracking-widest text-slate-400">Legion Białystok &copy; 2026</span>
            </div>
            <div id="footer-rights" class="text-xs text-slate-500">
                Wszystkie prawa zastrzeżone. Oficjalny serwis klubowy.
            </div>
        </div>
    </footer>

    <!-- SKRYPTY -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.location.protocol !== 'file:') {
                window.history.replaceState({}, '', '/');
            }

            const savedLang = localStorage.getItem('legion_lang') || 'pl';
            changeLanguage(savedLang);
        });

        const translations = {
            pl: {
                rights: "Wszystkie prawa zastrzeżone. Oficjalny serwis klubowy.",
                label: "PL"
            },
            en: {
                rights: "All rights reserved. Official club service.",
                label: "EN"
            },
            es: {
                rights: "Todos los derechos reservados. Servicio oficial del club.",
                label: "ES"
            },
            ru: {
                rights: "Все права защищены. Официальный клубный сервис.",
                label: "RU"
            }
        };

        function changeLanguage(lang) {
            localStorage.setItem('legion_lang', lang);
            const t = translations[lang] || translations['pl'];

            const rightsEl = document.getElementById('footer-rights');
            const labelEl = document.getElementById('current-lang-label');

            if(rightsEl) rightsEl.innerText = t.rights;
            if(labelEl) labelEl.innerText = t.label;
        }
    </script>
</body>
</html>
