<!DOCTYPE html>
<html lang="pl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legion Białystok – Oficjalna Strona Klubu</title>
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        gold: {
                            DEFAULT: '#c5a059',
                            light: '#e6ca87',
                            dark: '#997a38',
                            accent: '#d4af37'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes bwGoldShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animated-bw-gold-text {
            /* Płynny miks czerni, bieli i szlachetnego złota */
            background: linear-gradient(270deg, #000000, #c5a059, #ffffff, #d4af37, #000000);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
            animation: bwGoldShift 5s ease infinite;
            display: inline-block;
        }
        .hero-bg {
            background: linear-gradient(to bottom, rgba(10,10,10,0.95), rgba(0,0,0,0.99)), url('https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=1600&auto=format&fit=crop') center/cover no-repeat;
        }
    </style>
</head>
<body class="bg-[#0a0a0a] text-white font-sans antialiased selection:bg-gold selection:text-black min-h-screen flex flex-col justify-between">

    <!-- GÓRNY PASEK / NAWIGACJA -->
    <header class="w-full bg-[#0a0a0a]/90 backdrop-blur-md border-b border-white/10 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-sm">
        <div class="flex items-center space-x-5">
            <!-- MENU ROZWIJANE (HAMBURGER) -->
            <div class="relative group">
                <button class="bg-[#141414] border border-white/10 text-white hover:bg-white/10 w-12 h-12 rounded-xl flex items-center justify-center transition-all shadow-sm focus:outline-none cursor-pointer">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <div class="absolute left-0 top-full mt-2 w-64 bg-[#141414] border border-white/10 rounded-2xl shadow-2xl py-3 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50 space-y-1">
                    <a href="index.html" class="block px-5 py-2.5 text-xs font-bold uppercase tracking-wider text-slate-300 hover:bg-white/5 hover:text-gold">Strona główna</a>
                    <a href="druzyna/index.html" class="block px-5 py-2.5 text-xs font-bold uppercase tracking-wider text-slate-300 hover:bg-white/5 hover:text-gold">Pierwsza drużyna</a>
                    <a href="akademia/index.html" class="block px-5 py-2.5 text-xs font-bold uppercase tracking-wider text-slate-300 hover:bg-white/5 hover:text-gold">Akademia</a>
                    <a href="tabela/index.html" class="block px-5 py-2.5 text-xs font-bold uppercase tracking-wider text-slate-300 hover:bg-white/5 hover:text-gold">Tabela</a>
                    <a href="historia/index.html" class="block px-5 py-2.5 text-xs font-bold uppercase tracking-wider text-slate-300 hover:bg-white/5 hover:text-gold">Historia</a>
                    
                    <!-- ROZWIJANA SEKCJA KLUB -->
                    <div class="relative group/sub border-t border-white/10 my-1 pt-1">
                        <div class="px-5 py-2 text-xs font-bold uppercase tracking-wider text-slate-300 hover:bg-white/5 flex justify-between items-center cursor-pointer">
                            <span>Klub</span>
                            <span class="text-[10px]">▼</span>
                        </div>
                        <div class="hidden group-hover/sub:block pl-4 space-y-1 bg-black/40 py-1">
                            <a href="o-klubie/index.html" class="block px-4 py-2 text-xs font-bold uppercase tracking-wider text-slate-400 hover:text-gold">O klubie</a>
                            <a href="ludzie-legionu/index.html" class="block px-4 py-2 text-xs font-bold uppercase tracking-wider text-slate-400 hover:text-gold">Ludzie Legionu</a>
                            <a href="kontakt/index.html" class="block px-4 py-2 text-xs font-bold uppercase tracking-wider text-slate-400 hover:text-gold">Kontakt</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- LOGO -->
            <a href="index.html" class="flex items-center">
                <img src="8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png" alt="Logo Legion" class="h-14 w-auto object-contain cursor-pointer">
            </a>
        </div>
    </header>

    <!-- HERO SECTION Z CZARNO-BIAŁO-ZŁOTĄ ANIMACJĄ -->
    <main class="hero-bg flex-1 flex flex-col items-center justify-center text-center px-6 py-28 border-b border-white/10">
        <div class="max-w-4xl space-y-4">
            <h1 class="text-4xl md:text-6xl font-black uppercase tracking-wider leading-tight">
                <span class="animated-bw-gold-text">Razem Tworzymy Historię</span>
            </h1>
        </div>
    </main>

    <!-- STOPKA -->
    <footer class="w-full bg-[#0a0a0a] border-t border-white/10 py-12 px-6">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6 text-center md:text-left">
            <div class="flex items-center space-x-3">
                <img src="8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png" alt="Logo" class="h-10 w-auto object-contain">
                <span class="text-xs font-black uppercase tracking-widest text-slate-400">Legion Białystok &copy; 2026</span>
            </div>
            <div class="text-xs text-slate-500">
                Wszystkie prawa zastrzeżone. Oficjalny serwis klubowy.
            </div>
        </div>
    </footer>

</body>
</html>
