<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legion Białystok</title>

<link rel="icon" type="image/png" href="/8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#070709;
    --line:rgba(255,255,255,.12);
    --muted:rgba(255,255,255,.62);
    --muted2:rgba(255,255,255,.38);
    --red:#e50914;
    --red2:#ff3942;
    --max:1360px;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    min-height:100%;
}

body{
    background:var(--bg);
    color:#fff;
    font-family:"Outfit",sans-serif;
    overflow-x:hidden;
}

body.lock{
    overflow:hidden;
}

a{
    color:inherit;
    text-decoration:none;
}

button{
    color:inherit;
    font:inherit;
}

img{
    display:block;
    max-width:100%;
}

.shell{
    width:min(var(--max),calc(100% - 44px));
    margin:0 auto;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    position:fixed;
    inset:0 0 auto 0;
    z-index:10000;

    height:82px;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.54),
            transparent
        );
}

.header.scrolled{
    background:rgba(7,7,9,.78);
    backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(255,255,255,.06);
}

.header-inner{
    height:100%;

    display:flex;
    align-items:center;

    gap:11px;
}

.menu-btn{
    width:44px;
    height:44px;

    border:1px solid rgba(255,255,255,.14);
    border-radius:50%;

    background:rgba(0,0,0,.28);

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:5px;

    cursor:pointer;

    backdrop-filter:blur(8px);
}

.menu-btn span{
    width:18px;
    height:2px;

    background:#fff;

    border-radius:10px;

    transition:.2s ease;
}

.menu-btn.active span:first-child{
    transform:translateY(3.5px) rotate(45deg);
}

.menu-btn.active span:last-child{
    transform:translateY(-3.5px) rotate(-45deg);
}

.logo{
    display:flex;
    align-items:center;
}

.logo img{
    height:54px;
    width:auto;

    filter:
        drop-shadow(
            0 7px 20px rgba(0,0,0,.50)
        );
}


/* =====================================================
   FULLSCREEN MENU
===================================================== */

.menu{
    position:fixed;
    inset:0;

    z-index:9990;

    padding:
        115px
        22px
        36px;

    background:
        radial-gradient(
            circle at 80% 18%,
            rgba(229,9,20,.24),
            transparent 27%
        ),
        #070709;

    opacity:0;
    visibility:hidden;

    transition:.26s ease;
}

.menu.active{
    opacity:1;
    visibility:visible;
}

.menu-grid{
    width:min(980px,100%);
    margin:auto;

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:
        8px
        28px;
}

.menu-main-link,
.menu-group-btn{
    width:100%;
    min-height:86px;

    padding:0;

    border:0;
    border-bottom:
        1px solid rgba(255,255,255,.10);

    background:transparent;

    display:flex;
    align-items:center;
    justify-content:space-between;

    color:#fff;

    text-align:left;

    font-size:
        clamp(25px,4vw,48px);

    font-weight:900;

    letter-spacing:-1.5px;

    cursor:pointer;

    transition:.2s ease;
}

.menu-main-link:hover,
.menu-group-btn:hover,
.menu-group-btn.active{
    color:#ff3a43;

    padding-left:10px;
}

.menu-plus{
    margin-left:20px;

    color:
        rgba(255,255,255,.44);

    font-size:34px;
    font-weight:400;

    line-height:1;

    transition:.22s ease;
}

.menu-group-btn.active
.menu-plus{
    color:#ff3a43;

    transform:
        rotate(45deg);
}

.menu-sub{
    display:grid;

    grid-template-rows:0fr;

    opacity:0;

    transition:
        grid-template-rows .28s ease,
        opacity .22s ease;
}

.menu-sub.active{
    grid-template-rows:1fr;
    opacity:1;
}

.menu-sub-inner{
    overflow:hidden;
}

.menu-sub a{
    min-height:56px;

    padding:
        0
        0
        0
        22px;

    border-bottom:
        1px solid rgba(255,255,255,.06);

    display:flex;
    align-items:center;

    color:
        rgba(255,255,255,.58);

    font-size:15px;
    font-weight:800;

    letter-spacing:.3px;

    text-transform:uppercase;

    transition:.2s ease;
}

.menu-sub a:hover{
    color:#fff;

    padding-left:32px;
}


/* =====================================================
   ARTICLES HERO
===================================================== */

.articles-hero{
    position:relative;

    min-height:100svh;

    overflow:hidden;

    background:#111;

    isolation:isolate;
}

.hero-bg{
    position:absolute;
    inset:0;

    z-index:-3;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:scale(1.01);

    transition:
        opacity .30s ease,
        transform .75s ease;
}

.articles-hero.changing
.hero-bg{
    opacity:.42;

    transform:scale(1.04);
}

.hero-fallback{
    position:absolute;
    inset:0;

    z-index:-4;

    background:
        radial-gradient(
            circle at 75% 20%,
            rgba(255,92,49,.75),
            transparent 25%
        ),
        radial-gradient(
            circle at 55% 58%,
            #1d3d63,
            transparent 35%
        ),
        linear-gradient(
            145deg,
            #101826,
            #70243a 55%,
            #f36531
        );
}

.hero-overlay{
    position:absolute;
    inset:0;

    z-index:-2;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.16) 0%,
            rgba(0,0,0,.08) 22%,
            rgba(0,0,0,.26) 58%,
            rgba(7,7,9,.96) 100%
        ),
        linear-gradient(
            90deg,
            rgba(0,0,0,.68),
            rgba(0,0,0,.24) 48%,
            transparent 75%
        );
}

.hero-content{
    min-height:100svh;

    padding:
        122px
        0
        175px;

    display:flex;
    flex-direction:column;
    justify-content:flex-end;
}

.hero-category{
    color:#ff6971;

    font-size:11px;
    font-weight:900;

    letter-spacing:2.3px;

    text-transform:uppercase;
}

.hero-title{
    max-width:1050px;

    margin-top:12px;

    font-size:
        clamp(55px,8.5vw,132px);

    font-weight:900;

    line-height:.84;

    letter-spacing:-5px;

    text-wrap:balance;
}

.hero-meta{
    margin-top:19px;

    color:
        rgba(255,255,255,.58);

    font-size:11px;
    font-weight:700;
}

.hero-actions{
    margin-top:27px;

    display:flex;
    align-items:center;

    gap:9px;

    flex-wrap:wrap;
}

.primary-btn,
.secondary-btn{
    min-height:48px;

    padding:
        0
        20px;

    border-radius:100px;

    display:inline-flex;
    align-items:center;
    justify-content:center;

    font-size:10px;
    font-weight:900;

    letter-spacing:.8px;

    text-transform:uppercase;

    cursor:pointer;

    transition:.2s ease;
}

.primary-btn{
    border:0;

    background:#fff;

    color:#09090b;
}

.primary-btn:hover{
    transform:translateY(-2px);
}

.secondary-btn{
    border:1px solid rgba(255,255,255,.24);

    background:
        rgba(0,0,0,.20);

    color:#fff;

    backdrop-filter:blur(8px);
}

.secondary-btn:hover{
    background:
        rgba(255,255,255,.12);
}

.article-previews{
    position:absolute;

    left:50%;
    bottom:28px;

    z-index:5;

    transform:
        translateX(-50%);

    width:
        min(
            var(--max),
            calc(100% - 44px)
        );

    display:grid;

    grid-template-columns:
        repeat(5,minmax(0,1fr));

    gap:8px;
}

.article-preview{
    min-width:0;
    min-height:94px;

    padding:8px;

    border:
        1px solid rgba(255,255,255,.12);

    border-radius:16px;

    background:
        rgba(9,9,12,.60);

    backdrop-filter:
        blur(14px);

    display:grid;

    grid-template-columns:
        68px minmax(0,1fr);

    align-items:center;

    gap:10px;

    color:#fff;

    text-align:left;

    cursor:pointer;

    transition:.22s ease;
}

.article-preview:hover{
    transform:
        translateY(-4px);

    border-color:
        rgba(255,255,255,.28);

    background:
        rgba(15,15,19,.84);
}

.article-preview img{
    width:68px;
    height:68px;

    border-radius:11px;

    object-fit:cover;

    background:#15151a;
}

.preview-category{
    display:block;

    color:#ff646c;

    font-size:8px;
    font-weight:900;

    letter-spacing:.8px;

    text-transform:uppercase;
}

.preview-title{
    display:-webkit-box;

    margin-top:5px;

    overflow:hidden;

    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;

    font-size:11px;
    font-weight:800;

    line-height:1.27;
}

.hero-loading{
    position:absolute;
    inset:0;

    z-index:30;

    background:#070709;

    display:flex;
    align-items:center;
    justify-content:center;

    color:
        rgba(255,255,255,.52);

    font-size:10px;
    font-weight:900;

    letter-spacing:2px;

    text-transform:uppercase;

    transition:.25s ease;
}

.hero-loading.hidden{
    opacity:0;
    pointer-events:none;
}


/* =====================================================
   ARTICLE MODAL
===================================================== */

.article-modal{
    position:fixed;
    inset:0;

    z-index:20000;

    padding:18px;

    background:
        rgba(0,0,0,.90);

    backdrop-filter:
        blur(16px);

    display:flex;
    align-items:center;
    justify-content:center;

    opacity:0;
    visibility:hidden;

    transition:.24s ease;
}

.article-modal.active{
    opacity:1;
    visibility:visible;
}

.article-window{
    position:relative;

    width:min(980px,100%);

    max-height:92vh;

    overflow:auto;

    border:
        1px solid rgba(255,255,255,.10);

    border-radius:24px;

    background:#0d0d10;

    box-shadow:
        0 40px 100px rgba(0,0,0,.60);
}

.article-close{
    position:absolute;

    top:15px;
    right:15px;

    z-index:5;

    width:44px;
    height:44px;

    border:
        1px solid rgba(255,255,255,.13);

    border-radius:50%;

    background:
        rgba(0,0,0,.68);

    color:#fff;

    font-size:25px;

    cursor:pointer;
}

.article-image-wrap{
    height:390px;

    overflow:hidden;

    background:#151515;
}

.article-image{
    width:100%;
    height:100%;

    object-fit:cover;
}

.article-body-wrap{
    padding:
        36px
        42px
        48px;
}

.article-category{
    color:#ff4b55;

    font-size:10px;
    font-weight:900;

    letter-spacing:1.5px;

    text-transform:uppercase;
}

.article-title{
    margin-top:10px;

    padding-right:48px;

    font-size:
        clamp(34px,5vw,62px);

    line-height:.95;

    letter-spacing:-2.4px;

    font-weight:900;
}

.article-date{
    margin-top:14px;

    color:
        rgba(255,255,255,.38);

    font-size:11px;
}

.article-excerpt{
    margin-top:26px;

    color:#fff;

    font-size:18px;

    line-height:1.55;
}

.article-content{
    margin-top:25px;

    color:
        rgba(255,255,255,.72);

    font-size:15px;

    line-height:1.8;
}

.article-content p{
    margin-bottom:17px;
}

.article-content h2,
.article-content h3{
    margin:
        28px
        0
        12px;

    color:#fff;

    line-height:1.1;
}

.article-content ul,
.article-content ol{
    margin:
        16px
        0
        20px
        23px;
}

.article-content a{
    color:#fff;

    text-decoration:underline;

    text-decoration-color:
        var(--red);

    text-underline-offset:3px;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:1050px){

    .article-previews{
        grid-template-columns:
            repeat(3,minmax(0,1fr));
    }

    .article-preview:nth-child(n+4){
        display:none;
    }

}

@media(max-width:720px){

    .shell{
        width:
            min(
                var(--max),
                calc(100% - 28px)
            );
    }

    .header{
        height:74px;
    }

    .logo img{
        height:46px;
    }

    .menu{
        padding:
            104px
            14px
            24px;
    }

    .menu-grid{
        grid-template-columns:1fr;
    }

    .menu-main-link,
    .menu-group-btn{
        min-height:70px;
    }

    .menu-sub a{
        min-height:47px;
    }

    .hero-content{
        padding:
            112px
            0
            285px;
    }

    .hero-title{
        font-size:52px;

        line-height:.88;

        letter-spacing:-2.2px;
    }

    .article-previews{
        bottom:15px;

        width:
            calc(100% - 28px);

        grid-template-columns:
            1fr 1fr;

        gap:7px;
    }

    .article-preview{
        min-height:70px;

        padding:7px;

        grid-template-columns:
            48px minmax(0,1fr);

        border-radius:12px;
    }

    .article-preview:nth-child(n+5){
        display:none;
    }

    .article-preview img{
        width:48px;
        height:48px;

        border-radius:8px;
    }

    .preview-category{
        display:none;
    }

    .preview-title{
        font-size:10px;
    }

    .article-modal{
        padding:8px;
    }

    .article-image-wrap{
        height:245px;
    }

    .article-body-wrap{
        padding:
            27px
            20px
            38px;
    }

    .article-title{
        font-size:36px;
        letter-spacing:-1.5px;
    }

}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script src="/supabase-api.js"></script>
<script src="/clean-url.js" defer></script>
</head>

<body>


<header class="header" id="header">

<div class="shell header-inner">

    <button

        <span></span>

        <img

</header>


<nav

>

<div class="menu-grid">

<script>
"use strict";


const ARTICLES_API =
    "/api/articles.php";


const CLUB_LOGO =
    "/8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png";


let articles =
    [];


let activeArticle =
    0;


/* =====================================================
   MENU
===================================================== */

const menuBtn =
    document.getElementById(
        "menuBtn"
    );

const menu =
    document.getElementById(
        "menu"
    );

const header =
    document.getElementById(
        "header"
    );

const teamMenuBtn =
    document.getElementById(
        "teamMenuBtn"
    );

const teamMenuSub =
    document.getElementById(
        "teamMenuSub"
    );

const clubMenuBtn =
    document.getElementById(
        "clubMenuBtn"
    );

const clubMenuSub =
    document.getElementById(
        "clubMenuSub"
    );


function closeSubmenus() {

    teamMenuBtn
        .classList
        .remove(
            "active"
        );


    teamMenuSub
        .classList
        .remove(
            "active"
        );


    clubMenuBtn
        .classList
        .remove(
            "active"
        );


    clubMenuSub
        .classList
        .remove(
            "active"
        );

}


menuBtn.addEventListener(
    "click",
    function() {

        const open =
            menu
                .classList
                .toggle(
                    "active"
                );


        menuBtn
            .classList
            .toggle(
                "active",
                open
            );


        document.body
            .classList
            .toggle(
                "lock",
                open
            );


        if (!open) {

            closeSubmenus();

        }

    }
);


teamMenuBtn.addEventListener(
    "click",
    function() {

        const open =
            teamMenuSub
                .classList
                .toggle(
                    "active"
                );


        teamMenuBtn
            .classList
            .toggle(
                "active",
                open
            );


        clubMenuBtn
            .classList
            .remove(
                "active"
            );


        clubMenuSub
            .classList
            .remove(
                "active"
            );

    }
);


clubMenuBtn.addEventListener(
    "click",
    function() {

        const open =
            clubMenuSub
                .classList
                .toggle(
                    "active"
                );


        clubMenuBtn
            .classList
            .toggle(
                "active",
                open
            );


        teamMenuBtn
            .classList
            .remove(
                "active"
            );


        teamMenuSub
            .classList
            .remove(
                "active"
            );

    }
);


menu
    .querySelectorAll(
        "a"
    )
    .forEach(
        function(link) {

            link.addEventListener(
                "click",
                function() {

                    menu
                        .classList
                        .remove(
                            "active"
                        );


                    menuBtn
                        .classList
                        .remove(
                            "active"
                        );


                    document.body
                        .classList
                        .remove(
                            "lock"
                        );


                    closeSubmenus();

                }
            );

        }
    );


window.addEventListener(
    "scroll",
    function() {

        header
            .classList
            .toggle(
                "scrolled",
                window.scrollY > 30
            );

    }
);


/* =====================================================
   HELPERS
===================================================== */

function localized(
    item,
    field
) {

    if (!item) {

        return "";

    }


    const language =
        localStorage.getItem(
            "legion_language"
        )
        ||
        "pl";


    return (
        item.translations
            ?.[language]
            ?.[field]
        ||
        item.translations
            ?.pl
            ?.[field]
        ||
        item[
            field + "_pl"
        ]
        ||
        item[field]
        ||
        ""
    );

}


function formatDate(
    value
) {

    if (!value) {

        return "";

    }


    const date =
        new Date(
            value
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    return new Intl.DateTimeFormat(
        "pl-PL",
        {
            day:
                "2-digit",

            month:
                "2-digit",

            year:
                "numeric"
        }
    ).format(
        date
    );

}


function escapeHtml(
    value
) {

    return String(
        value
        ||
        ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}


/* =====================================================
   ARTICLES
===================================================== */

const articlesHero =
    document.getElementById(
        "articlesHero"
    );

const heroImage =
    document.getElementById(
        "heroImage"
    );

const heroCategory =
    document.getElementById(
        "heroCategory"
    );

const heroTitle =
    document.getElementById(
        "heroTitle"
    );

const heroDate =
    document.getElementById(
        "heroDate"
    );

const previews =
    document.getElementById(
        "articlePreviews"
    );


async function loadArticles(
    preserve = false
) {

    const oldId =
        preserve
        &&
        articles[
            activeArticle
        ]
        ? articles[
            activeArticle
        ].id
        : null;


    try {

        const response =
            await fetch(
                ARTICLES_API
                +
                "?status=published&limit=12",
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error();

        }


        const data =
            await response.json();


        const list =
            Array.isArray(
                data
            )
            ? data
            : data.articles;


        if (
            Array.isArray(
                list
            )
            &&
            list.length
        ) {

            articles =
                list
                .sort(
                    function(a,b) {

                        return (
                            new Date(
                                b.published_at
                                ||
                                b.date
                                ||
                                0
                            )
                            -
                            new Date(
                                a.published_at
                                ||
                                a.date
                                ||
                                0
                            )
                        );

                    }
                )
                .slice(
                    0,
                    6
                );

        }

    }
    catch(error) {

        console.log(
            "Articles:",
            error
        );

    }


    if (
        !articles.length
    ) {

        articles = [
            {
                id:
                    "fallback",

                image:
                    CLUB_LOGO,

                published_at:
                    new Date()
                    .toISOString(),

                translations:{
                    pl:{
                        category:
                            "Legion Białystok",

                        title:
                            "Legion Białystok",

                        excerpt:
                            "Aktualności z życia klubu.",

                        content:
                            "<p>Aktualności pojawią się tutaj po dodaniu ich w panelu.</p>"
                    }
                }
            }
        ];

    }


    let nextIndex =
        0;


    if (
        oldId !== null
    ) {

        const found =
            articles
                .findIndex(
                    function(article) {

                        return (
                            String(
                                article.id
                            )
                            ===
                            String(
                                oldId
                            )
                        );

                    }
                );


        if (
            found >= 0
        ) {

            nextIndex =
                found;

        }

    }


    renderArticle(
        nextIndex,
        false
    );


    document
        .getElementById(
            "heroLoading"
        )
        .classList
        .add(
            "hidden"
        );

}


function renderArticle(
    index,
    animate = true
) {

    if (
        !articles.length
    ) {

        return;

    }


    if (
        index < 0
    ) {

        index =
            articles.length - 1;

    }


    if (
        index >=
        articles.length
    ) {

        index = 0;

    }


    activeArticle =
        index;


    const article =
        articles[index];


    const update =
        function() {

            heroImage.src =
                article.image
                ||
                article.thumbnail
                ||
                CLUB_LOGO;


            heroImage.alt =
                localized(
                    article,
                    "title"
                );


            heroCategory.textContent =
                localized(
                    article,
                    "category"
                )
                ||
                "Legion Białystok";


            heroTitle.textContent =
                localized(
                    article,
                    "title"
                )
                ||
                "Legion Białystok";


            heroDate.textContent =
                formatDate(
                    article.published_at
                    ||
                    article.date
                );


            renderPreviews();


            articlesHero
                .classList
                .remove(
                    "changing"
                );

        };


    if (
        animate
    ) {

        articlesHero
            .classList
            .add(
                "changing"
            );


        setTimeout(
            update,
            130
        );

    }
    else {

        update();

    }

}


function renderPreviews() {

    previews.innerHTML =
        "";


    articles
        .map(
            function(
                article,
                index
            ) {

                return {
                    article,
                    index
                };

            }
        )
        .filter(
            function(item) {

                return (
                    item.index
                    !==
                    activeArticle
                );

            }
        )
        .slice(
            0,
            5
        )
        .forEach(
            function(item) {

                const button =
                    document.createElement(
                        "button"
                    );


                button.type =
                    "button";


                button.className =
                    "article-preview";


                button.innerHTML =
                    `
                        <img
                            src="${
                                escapeHtml(
                                    item.article.image
                                    ||
                                    item.article.thumbnail
                                    ||
                                    CLUB_LOGO
                                )
                            }"
                            alt=""
                        >

                        <span>

                            <span class="preview-category">
                                ${
                                    escapeHtml(
                                        localized(
                                            item.article,
                                            "category"
                                        )
                                        ||
                                        "Legion"
                                    )
                                }
                            </span>

                            <span class="preview-title">
                                ${
                                    escapeHtml(
                                        localized(
                                            item.article,
                                            "title"
                                        )
                                    )
                                }
                            </span>

                        </span>
                    `;


                button.addEventListener(
                    "click",
                    function() {

                        renderArticle(
                            item.index
                        );

                    }
                );


                previews.appendChild(
                    button
                );

            }
        );

}


/* =====================================================
   ARTICLE MODAL
===================================================== */

const articleModal =
    document.getElementById(
        "articleModal"
    );


function openArticle(
    article
) {

    if (
        !article
    ) {

        return;

    }


    document
        .getElementById(
            "modalImage"
        )
        .src =
            article.image
            ||
            article.thumbnail
            ||
            CLUB_LOGO;


    document
        .getElementById(
            "modalCategory"
        )
        .textContent =
            localized(
                article,
                "category"
            )
            ||
            "Legion Białystok";


    document
        .getElementById(
            "modalTitle"
        )
        .textContent =
            localized(
                article,
                "title"
            )
            ||
            "Aktualność";


    document
        .getElementById(
            "modalDate"
        )
        .textContent =
            formatDate(
                article.published_at
                ||
                article.date
            );


    document
        .getElementById(
            "modalExcerpt"
        )
        .textContent =
            localized(
                article,
                "excerpt"
            )
            ||
            "";


    const content =
        localized(
            article,
            "content"
        )
        ||
        "";


    document
        .getElementById(
            "modalContent"
        )
        .innerHTML =
            window.LegionSupabase
                ?.sanitizeRichHtml
            ? window.LegionSupabase
                .sanitizeRichHtml(
                    content
                )
            : content;


    articleModal
        .classList
        .add(
            "active"
        );


    document.body
        .classList
        .add(
            "lock"
        );

}


function closeArticle() {

    articleModal
        .classList
        .remove(
            "active"
        );


    document.body
        .classList
        .remove(
            "lock"
        );

}


document
    .getElementById(
        "heroRead"
    )
    .addEventListener(
        "click",
        function() {

            openArticle(
                articles[
                    activeArticle
                ]
            );

        }
    );


document
    .getElementById(
        "articleClose"
    )
    .addEventListener(
        "click",
        closeArticle
    );


articleModal.addEventListener(
    "click",
    function(event) {

        if (
            event.target ===
            articleModal
        ) {

            closeArticle();

        }

    }
);


document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Escape"
        ) {

            if (
                articleModal
                    .classList
                    .contains(
                        "active"
                    )
            ) {

                closeArticle();

            }
            else if (
                menu
                    .classList
                    .contains(
                        "active"
                    )
            ) {

                menu
                    .classList
                    .remove(
                        "active"
                    );


                menuBtn
                    .classList
                    .remove(
                        "active"
                    );


                document.body
                    .classList
                    .remove(
                        "lock"
                    );


                closeSubmenus();

            }

        }

    }
);


/* =====================================================
   START
===================================================== */

loadArticles();


setInterval(
    function() {

        loadArticles(
            true
        );

    },
    60000
);


document.addEventListener(
    "visibilitychange",
    function() {

        if (
            document.visibilityState
            ===
            "visible"
        ) {

            loadArticles(
                true
            );

        }

    }
);

</script>
