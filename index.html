<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legion Białystok</title>

<link rel="icon" type="image/png" href="/8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#070709;
    --line:rgba(255,255,255,.12);
    --muted:rgba(255,255,255,.62);
    --muted2:rgba(255,255,255,.38);
    --red:#e50914;
    --red2:#ff3942;
    --max:1360px;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    min-height:100%;
}

body{
    background:var(--bg);
    color:#fff;
    font-family:"Outfit",sans-serif;
    overflow-x:hidden;
}

body.lock{
    overflow:hidden;
}

a{
    color:inherit;
    text-decoration:none;
}

button{
    color:inherit;
    font:inherit;
}

img{
    display:block;
    max-width:100%;
}

.shell{
    width:min(var(--max),calc(100% - 44px));
    margin:0 auto;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    position:fixed;
    inset:0 0 auto 0;
    z-index:10000;

    height:82px;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.54),
            transparent
        );
}

.header.scrolled{
    background:rgba(7,7,9,.78);
    backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(255,255,255,.06);
}

.header-inner{
    height:100%;

    display:flex;
    align-items:center;

    gap:11px;
}

.menu-btn{
    width:44px;
    height:44px;

    border:1px solid rgba(255,255,255,.14);
    border-radius:50%;

    background:rgba(0,0,0,.28);

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:5px;

    cursor:pointer;

    backdrop-filter:blur(8px);
}

.menu-btn span{
    width:18px;
    height:2px;

    background:#fff;

    border-radius:10px;

    transition:.2s ease;
}

.menu-btn.active span:first-child{
    transform:translateY(3.5px) rotate(45deg);
}

.menu-btn.active span:last-child{
    transform:translateY(-3.5px) rotate(-45deg);
}

.logo{
    display:flex;
    align-items:center;
}

.logo img{
    height:54px;
    width:auto;

    filter:
        drop-shadow(
            0 7px 20px rgba(0,0,0,.50)
        );
}


/* =====================================================
   FULLSCREEN MENU
===================================================== */

.menu{
    position:fixed;
    inset:0;

    z-index:9990;

    padding:
        115px
        22px
        36px;

    background:
        radial-gradient(
            circle at 80% 18%,
            rgba(229,9,20,.24),
            transparent 27%
        ),
        #070709;

    opacity:0;
    visibility:hidden;

    transition:.26s ease;
}

.menu.active{
    opacity:1;
    visibility:visible;
}

.menu-grid{
    width:min(980px,100%);
    margin:auto;

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:
        8px
        28px;
}

.menu-main-link,
.menu-group-btn{
    width:100%;
    min-height:86px;

    padding:0;

    border:0;
    border-bottom:
        1px solid rgba(255,255,255,.10);

    background:transparent;

    display:flex;
    align-items:center;
    justify-content:space-between;

    color:#fff;

    text-align:left;

    font-size:
        clamp(25px,4vw,48px);

    font-weight:900;

    letter-spacing:-1.5px;

    cursor:pointer;

    transition:.2s ease;
}

.menu-main-link:hover,
.menu-group-btn:hover,
.menu-group-btn.active{
    color:#ff3a43;

    padding-left:10px;
}

.menu-plus{
    margin-left:20px;

    color:
        rgba(255,255,255,.44);

    font-size:34px;
    font-weight:400;

    line-height:1;

    transition:.22s ease;
}

.menu-group-btn.active
.menu-plus{
    color:#ff3a43;

    transform:
        rotate(45deg);
}

.menu-sub{
    display:grid;

    grid-template-rows:0fr;

    opacity:0;

    transition:
        grid-template-rows .28s ease,
        opacity .22s ease;
}

.menu-sub.active{
    grid-template-rows:1fr;
    opacity:1;
}

.menu-sub-inner{
    overflow:hidden;
}

.menu-sub a{
    min-height:56px;

    padding:
        0
        0
        0
        22px;

    border-bottom:
        1px solid rgba(255,255,255,.06);

    display:flex;
    align-items:center;

    color:
        rgba(255,255,255,.58);

    font-size:15px;
    font-weight:800;

    letter-spacing:.3px;

    text-transform:uppercase;

    transition:.2s ease;
}

.menu-sub a:hover{
    color:#fff;

    padding-left:32px;
}


/* =====================================================
   ARTICLES HERO
===================================================== */

.articles-hero{
    position:relative;

    min-height:100svh;

    overflow:hidden;

    background:#111;

    isolation:isolate;
}

.hero-bg{
    position:absolute;
    inset:0;

    z-index:-3;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:scale(1.01);

    transition:
        opacity .30s ease,
        transform .75s ease;
}

.articles-hero.changing
.hero-bg{
    opacity:.42;

    transform:scale(1.04);
}

.hero-fallback{
    position:absolute;
    inset:0;

    z-index:-4;

    background:
        radial-gradient(
            circle at 75% 20%,
            rgba(255,92,49,.75),
            transparent 25%
        ),
        radial-gradient(
            circle at 55% 58%,
            #1d3d63,
            transparent 35%
        ),
        linear-gradient(
            145deg,
            #101826,
            #70243a 55%,
            #f36531
        );
}

.hero-overlay{
    position:absolute;
    inset:0;

    z-index:-2;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.16) 0%,
            rgba(0,0,0,.08) 22%,
            rgba(0,0,0,.26) 58%,
            rgba(7,7,9,.96) 100%
        ),
        linear-gradient(
            90deg,
            rgba(0,0,0,.68),
            rgba(0,0,0,.24) 48%,
            transparent 75%
        );
}

.hero-content{
    min-height:100svh;

    padding:
        122px
        0
        175px;

    display:flex;
    flex-direction:column;
    justify-content:flex-end;
}

.hero-category{
    color:#ff6971;

    font-size:11px;
    font-weight:900;

    letter-spacing:2.3px;

    text-transform:uppercase;
}

.hero-title{
    max-width:1050px;

    cursor:pointer;

    margin-top:12px;

    font-size:
        clamp(55px,8.5vw,132px);

    font-weight:900;

    line-height:.84;

    letter-spacing:-5px;

    text-wrap:balance;
}

.hero-meta{
    margin-top:19px;

    color:
        rgba(255,255,255,.58);

    font-size:11px;
    font-weight:700;
}

.hero-actions{
    margin-top:27px;

    display:flex;
    align-items:center;

    gap:9px;

    flex-wrap:wrap;
}

.primary-btn,
.secondary-btn{
    min-height:48px;

    padding:
        0
        20px;

    border-radius:100px;

    display:inline-flex;
    align-items:center;
    justify-content:center;

    font-size:10px;
    font-weight:900;

    letter-spacing:.8px;

    text-transform:uppercase;

    cursor:pointer;

    transition:.2s ease;
}

.primary-btn{
    border:0;

    background:#fff;

    color:#09090b;
}

.primary-btn:hover{
    transform:translateY(-2px);
}

.secondary-btn{
    border:1px solid rgba(255,255,255,.24);

    background:
        rgba(0,0,0,.20);

    color:#fff;

    backdrop-filter:blur(8px);
}

.secondary-btn:hover{
    background:
        rgba(255,255,255,.12);
}


.article-previews{
    position:absolute;

    left:50%;
    bottom:24px;

    z-index:5;

    transform:
        translateX(-50%);

    width:
        min(
            var(--max),
            calc(100% - 44px)
        );

    display:grid;

    grid-template-columns:
        repeat(5,minmax(0,1fr));

    gap:10px;
}

.article-preview{
    position:relative;

    min-width:0;
    height:156px;

    padding:0;

    border:
        1px solid rgba(255,255,255,.13);

    border-radius:18px;

    overflow:hidden;

    background:#111;

    color:#fff;

    text-align:left;

    cursor:pointer;

    box-shadow:
        0 18px 45px rgba(0,0,0,.22);

    transition:
        transform .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;
}

.article-preview:hover{
    transform:
        translateY(-7px);

    border-color:
        rgba(255,255,255,.30);

    box-shadow:
        0 26px 60px rgba(0,0,0,.34);
}

.article-preview-image{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    transition:
        transform .45s ease,
        filter .45s ease;
}

.article-preview:hover
.article-preview-image{
    transform:
        scale(1.055);

    filter:
        saturate(1.08)
        contrast(1.04);
}

.article-preview-overlay{
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.04) 10%,
            rgba(0,0,0,.18) 42%,
            rgba(0,0,0,.88) 100%
        );
}

.article-preview-content{
    position:absolute;

    inset:
        auto
        13px
        12px
        13px;

    z-index:2;
}

.preview-topline{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:8px;
}

.preview-category{
    color:#ff7178;

    font-size:8px;
    font-weight:900;

    letter-spacing:.9px;

    text-transform:uppercase;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;
}

.preview-date{
    flex:0 0 auto;

    color:
        rgba(255,255,255,.52);

    font-size:8px;
    font-weight:700;
}

.preview-title{
    display:-webkit-box;

    margin-top:7px;

    overflow:hidden;

    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;

    font-size:14px;
    font-weight:900;

    line-height:1.05;

    letter-spacing:-.25px;
}

.preview-open{
    position:absolute;

    top:10px;
    right:10px;

    z-index:3;

    width:31px;
    height:31px;

    border:
        1px solid rgba(255,255,255,.16);

    border-radius:50%;

    background:
        rgba(0,0,0,.34);

    backdrop-filter:
        blur(8px);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:14px;

    transition:
        background .2s ease,
        transform .2s ease;
}

.article-preview:hover
.preview-open{
    background:
        rgba(255,255,255,.15);

    transform:
        translate(2px,-2px);
}

.hero-loading{
    position:absolute;
    inset:0;

    z-index:30;

    background:#070709;

    display:flex;
    align-items:center;
    justify-content:center;

    color:
        rgba(255,255,255,.52);

    font-size:10px;
    font-weight:900;

    letter-spacing:2px;

    text-transform:uppercase;

    transition:.25s ease;
}

.hero-loading.hidden{
    opacity:0;
    pointer-events:none;
}


/* =====================================================
   ARTICLE MODAL
===================================================== */

.article-modal{
    position:fixed;
    inset:0;

    z-index:20000;

    padding:18px;

    background:
        rgba(0,0,0,.90);

    backdrop-filter:
        blur(16px);

    display:flex;
    align-items:center;
    justify-content:center;

    opacity:0;
    visibility:hidden;

    transition:.24s ease;
}

.article-modal.active{
    opacity:1;
    visibility:visible;
}

.article-window{
    position:relative;

    width:min(1040px,100%);

    max-height:92vh;

    overflow:auto;

    border:
        1px solid rgba(255,255,255,.11);

    border-radius:28px;

    background:
        linear-gradient(
            180deg,
            #101014,
            #09090c
        );

    box-shadow:
        0 44px 120px rgba(0,0,0,.68);
}

.article-close{
    position:absolute;

    top:15px;
    right:15px;

    z-index:5;

    width:44px;
    height:44px;

    border:
        1px solid rgba(255,255,255,.13);

    border-radius:50%;

    background:
        rgba(0,0,0,.68);

    color:#fff;

    font-size:25px;

    cursor:pointer;
}

.article-image-wrap{
    position:relative;

    height:430px;

    overflow:hidden;

    background:#151515;
}

.article-image-wrap::after{
    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            180deg,
            transparent 54%,
            rgba(9,9,12,.88) 100%
        );
}

.article-image{
    width:100%;
    height:100%;

    object-fit:cover;
}

.article-body-wrap{
    position:relative;

    margin-top:-34px;

    z-index:2;

    padding:
        0
        44px
        50px;
}

.article-category{
    color:#ff4b55;

    font-size:10px;
    font-weight:900;

    letter-spacing:1.5px;

    text-transform:uppercase;
}

.article-title{
    max-width:840px;

    margin-top:10px;

    padding-right:48px;

    font-size:
        clamp(36px,5.2vw,68px);

    line-height:.93;

    letter-spacing:-2.7px;

    font-weight:900;
}

.article-date{
    margin-top:14px;

    color:
        rgba(255,255,255,.38);

    font-size:11px;
}

.article-excerpt{
    max-width:780px;

    margin-top:27px;

    color:
        rgba(255,255,255,.90);

    font-size:19px;

    font-weight:500;

    line-height:1.55;
}

.article-content{
    margin-top:25px;

    color:
        rgba(255,255,255,.72);

    font-size:15px;

    line-height:1.8;
}

.article-content p{
    margin-bottom:17px;
}

.article-content h2,
.article-content h3{
    margin:
        28px
        0
        12px;

    color:#fff;

    line-height:1.1;
}

.article-content ul,
.article-content ol{
    margin:
        16px
        0
        20px
        23px;
}

.article-content a{
    color:#fff;

    text-decoration:underline;

    text-decoration-color:
        var(--red);

    text-underline-offset:3px;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:1050px){

    .article-previews{
        grid-template-columns:
            repeat(3,minmax(0,1fr));
    }

    .article-preview:nth-child(n+4){
        display:none;
    }

}

@media(max-width:720px){

    .shell{
        width:
            min(
                var(--max),
                calc(100% - 28px)
            );
    }

    .header{
        height:74px;
    }

    .logo img{
        height:46px;
    }

    .menu{
        padding:
            104px
            14px
            24px;
    }

    .menu-grid{
        grid-template-columns:1fr;
    }

    .menu-main-link,
    .menu-group-btn{
        min-height:70px;
    }

    .menu-sub a{
        min-height:47px;
    }

    .hero-content{
        padding:
            112px
            0
            285px;
    }

    .hero-title{
        font-size:52px;

        line-height:.88;

        letter-spacing:-2.2px;
    }

    .article-previews{
        bottom:14px;

        width:
            calc(100% - 28px);

        grid-template-columns:
            1fr 1fr;

        gap:7px;
    }

    .article-preview{
        height:112px;

        border-radius:14px;
    }

    .article-preview:nth-child(n+5){
        display:none;
    }

    .article-preview-content{
        left:10px;
        right:10px;
        bottom:9px;
    }

    .preview-date{
        display:none;
    }

    .preview-title{
        font-size:11px;
    }

    .preview-open{
        width:27px;
        height:27px;

        top:8px;
        right:8px;

        font-size:12px;
    }

    .article-modal{
        padding:8px;
    }

    .article-image-wrap{
        height:260px;
    }

    .article-body-wrap{
        margin-top:-24px;

        padding:
            0
            20px
            38px;
    }

    .article-title{
        font-size:36px;
        letter-spacing:-1.5px;
    }

}

/* =====================================================
   FLOATING LANGUAGE + SOCIAL DOCK
===================================================== */

.floating-dock{
    position:fixed;
    right:18px;
    bottom:18px;
    z-index:12000;

    display:flex;
    align-items:center;
    gap:8px;
}

.social-dock{
    display:flex;
    align-items:center;
    gap:7px;
}

.social-button,
.language-floating-btn{
    width:46px;
    height:46px;

    border:1px solid rgba(255,255,255,.15);
    border-radius:50%;

    background:rgba(7,7,9,.72);

    backdrop-filter:blur(15px);

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;

    box-shadow:
        0 12px 32px rgba(0,0,0,.28);

    transition:
        transform .2s ease,
        background .2s ease,
        border-color .2s ease;

    cursor:pointer;
}

.social-button:hover,
.language-floating-btn:hover{
    transform:translateY(-3px);

    background:rgba(255,255,255,.12);

    border-color:rgba(255,255,255,.28);
}

.social-button svg{
    width:19px;
    height:19px;
    fill:currentColor;
}

.social-button[aria-disabled="true"]{
    cursor:default;
}

.language-floating{
    position:relative;
}

.language-floating-btn{
    width:auto;
    min-width:58px;

    padding:0 14px;

    border-radius:100px;

    gap:7px;

    font-size:11px;
    font-weight:900;

    letter-spacing:.5px;
}

.language-chevron{
    color:rgba(255,255,255,.45);

    font-size:9px;

    transition:transform .2s ease;
}

.language-floating.active
.language-chevron{
    transform:rotate(180deg);
}

.language-dropdown{
    position:absolute;
    right:0;
    bottom:58px;

    width:min(390px,calc(100vw - 24px));
    max-height:min(620px,72vh);

    padding:10px;

    border:1px solid rgba(255,255,255,.10);
    border-radius:18px;

    background:
        linear-gradient(
            180deg,
            rgba(26,26,58,.98),
            rgba(8,8,20,.98)
        );

    backdrop-filter:blur(20px);

    box-shadow:
        0 28px 80px rgba(0,0,0,.52);

    overflow:auto;

    opacity:0;
    visibility:hidden;

    transform:translateY(10px) scale(.985);
    transform-origin:right bottom;

    transition:.22s ease;
}

.language-floating.active
.language-dropdown{
    opacity:1;
    visibility:visible;
    transform:none;
}

.language-dropdown-title{
    padding:7px 6px 11px;

    color:rgba(255,255,255,.50);

    font-size:9px;
    font-weight:900;

    letter-spacing:1.4px;

    text-transform:uppercase;
}

.language-option{
    width:100%;
    min-height:54px;

    margin-bottom:6px;

    padding:0 15px;

    border:1px solid transparent;
    border-radius:10px;

    background:rgba(255,255,255,.045);

    color:rgba(255,255,255,.80);

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:18px;

    text-align:left;

    font-size:12px;
    font-weight:800;

    cursor:pointer;

    transition:.18s ease;
}

.language-option:last-child{
    margin-bottom:0;
}

.language-option:hover{
    background:rgba(255,255,255,.075);
    color:#fff;
}

.language-option.active{
    background:rgba(109,105,181,.34);

    border-color:rgba(151,145,238,.18);

    color:#fff;
}

.language-option-name{
    min-width:0;
}

.language-option-radio{
    position:relative;

    flex:0 0 auto;

    width:14px;
    height:14px;

    border:1px solid rgba(158,151,244,.46);

    border-radius:50%;
}

.language-option.active
.language-option-radio{
    border-color:#c9c5ff;
}

.language-option.active
.language-option-radio::after{
    content:"";

    position:absolute;
    inset:3px;

    border-radius:50%;

    background:#d6d3ff;
}

@media(max-width:720px){
    .floating-dock{
        right:12px;
        bottom:12px;

        gap:6px;
    }

    .social-dock{
        gap:5px;
    }

    .social-button,
    .language-floating-btn{
        height:42px;
    }

    .social-button{
        width:42px;
    }

    .language-floating-btn{
        min-width:54px;
        padding:0 12px;
    }

    .language-dropdown{
        right:0;
        bottom:50px;
        width:min(360px,calc(100vw - 24px));
        max-height:68vh;
    }
}

</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script src="/supabase-api.js"></script>
<script src="/clean-url.js" defer></script>
</head>

function localized(
    item,
    field
) {

    if (!item) {
        return "";
    }

    return (
        item.translations
            ?.[selectedLanguage]
            ?.[field]
        ||
        item.translations
            ?.pl
            ?.[field]
        ||
        item[
            field + "_pl"
        ]
        ||
        item[field]
        ||
        ""
    );

}


function formatDate(
    value
) {

    if (!value) {

        return "";

    }


    const date =
        new Date(
            value
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    return new Intl.DateTimeFormat(
        ({
            pl:"pl-PL",
            en:"en-GB",
            de:"de-DE",
            es:"es-ES",
            ru:"ru-RU",
            it:"it-IT",
            zh:"zh-CN"
        }[selectedLanguage] || "pl-PL"),
        {
            day:
                "2-digit",

            month:
                "2-digit",

            year:
                "numeric"
        }
    ).format(
        date
    );

}


function escapeHtml(
    value
) {

    return String(
        value
        ||
        ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}

async function loadArticles(
    preserve = false
) {

    const oldId =
        preserve
        &&
        articles[
            activeArticle
        ]
        ? articles[
            activeArticle
        ].id
        : null;


    try {

        const response =
            await fetch(
                ARTICLES_API
                +
                "?status=published&limit=12",
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error();

        }


        const data =
            await response.json();


        const list =
            Array.isArray(
                data
            )
            ? data
            : data.articles;


        if (
            Array.isArray(
                list
            )
            &&
            list.length
        ) {

            articles =
                list
                .sort(
                    function(a,b) {

                        return (
                            new Date(
                                b.published_at
                                ||
                                b.date
                                ||
                                0
                            )
                            -
                            new Date(
                                a.published_at
                                ||
                                a.date
                                ||
                                0
                            )
                        );

                    }
                )
                .slice(
                    0,
                    6
                );

        }

    }
    catch(error) {

        console.log(
            "Articles:",
            error
        );

    }


    if (
        !articles.length
    ) {

        articles = [
            {
                id:
                    "fallback",

                image:
                    CLUB_LOGO,

                published_at:
                    new Date()
                    .toISOString(),

                translations:{
                    pl:{
                        category:"Legion Białystok",
                        title:"Legion Białystok",
                        excerpt:"Aktualności z życia klubu.",
                        content:"<p>Aktualności pojawią się tutaj po dodaniu ich w panelu.</p>"
                    },
                    en:{
                        category:"Legion Białystok",
                        title:"Legion Białystok",
                        excerpt:"Latest news from the club.",
                        content:"<p>News will appear here after it is added in the admin panel.</p>"
                    },
                    de:{
                        category:"Legion Białystok",
                        title:"Legion Białystok",
                        excerpt:"Aktuelles aus dem Vereinsleben.",
                        content:"<p>Aktuelles erscheint hier, sobald es im Admin-Panel hinzugefügt wurde.</p>"
                    },
                    es:{
                        category:"Legion Białystok",
                        title:"Legion Białystok",
                        excerpt:"Noticias de la vida del club.",
                        content:"<p>Las noticias aparecerán aquí después de añadirlas en el panel de administración.</p>"
                    },
                    ru:{
                        category:"Legion Białystok",
                        title:"Legion Białystok",
                        excerpt:"Новости из жизни клуба.",
                        content:"<p>Новости появятся здесь после добавления в панели администратора.</p>"
                    },
                    it:{
                        category:"Legion Białystok",
                        title:"Legion Białystok",
                        excerpt:"Notizie dalla vita del club.",
                        content:"<p>Le notizie appariranno qui dopo essere state aggiunte nel pannello di amministrazione.</p>"
                    },
                    zh:{
                        category:"Legion Białystok",
                        title:"Legion Białystok",
                        excerpt:"俱乐部最新动态。",
                        content:"<p>在管理面板中添加新闻后，内容将显示在这里。</p>"
                    }
                }
            }
        ];

    }


    let nextIndex =
        0;


    if (
        oldId !== null
    ) {

        const found =
            articles
                .findIndex(
                    function(article) {

                        return (
                            String(
                                article.id
                            )
                            ===
                            String(
                                oldId
                            )
                        );

                    }
                );


        if (
            found >= 0
        ) {

            nextIndex =
                found;

        }

    }


    renderArticle(
        nextIndex,
        false
    );


    document
        .getElementById(
            "heroLoading"
        )
        .classList
        .add(
            "hidden"
        );

}


function renderArticle(
    index,
    animate = true
) {

    if (
        !articles.length
    ) {

        return;

    }


    if (
        index < 0
    ) {

        index =
            articles.length - 1;

    }


    if (
        index >=
        articles.length
    ) {

        index = 0;

    }


    activeArticle =
        index;


    const article =
        articles[index];


    const update =
        function() {

            heroImage.src =
                article.image
                ||
                article.thumbnail
                ||
                CLUB_LOGO;


            heroImage.alt =
                localized(
                    article,
                    "title"
                );


            heroCategory.textContent =
                localized(
                    article,
                    "category"
                )
                ||
                uiText("fallbackCategory");


            heroTitle.textContent =
                localized(
                    article,
                    "title"
                )
                ||
                uiText("fallbackTitle");


            heroDate.textContent =
                formatDate(
                    article.published_at
                    ||
                    article.date
                );


            renderPreviews();


            articlesHero
                .classList
                .remove(
                    "changing"
                );

        };


    if (
        animate
    ) {

        articlesHero
            .classList
            .add(
                "changing"
            );


        setTimeout(
            update,
            130
        );

    }
    else {

        update();

    }

}


function renderPreviews() {

    previews.innerHTML =
        "";


    articles
        .map(
            function(
                article,
                index
            ) {

                return {
                    article,
                    index
                };

            }
        )
        .filter(
            function(item) {

                return (
                    item.index
                    !==
                    activeArticle
                );

            }
        )
        .slice(
            0,
            5
        )
        .forEach(
            function(item) {

                const button =
                    document.createElement(
                        "button"
                    );


                button.type =
                    "button";


                button.className =
                    "article-preview";


                const image =
                    item.article.image
                    ||
                    item.article.thumbnail
                    ||
                    CLUB_LOGO;


                const category =
                    localized(
                        item.article,
                        "category"
                    )
                    ||
                    uiText(
                        "fallbackCategory"
                    );


                const title =
                    localized(
                        item.article,
                        "title"
                    )
                    ||
                    uiText(
                        "fallbackTitle"
                    );


                const date =
                    formatDate(
                        item.article.published_at
                        ||
                        item.article.date
                    );


                button.innerHTML =
                    `
                        <img
                            class="article-preview-image"
                            src="${escapeHtml(image)}"
                            alt=""
                        >

                        <span class="article-preview-overlay"></span>

                        <span class="preview-open">
                            ↗
                        </span>

                        <span class="article-preview-content">

                            <span class="preview-topline">

                                <span class="preview-category">
                                    ${escapeHtml(category)}
                                </span>

                                <span class="preview-date">
                                    ${escapeHtml(date)}
                                </span>

                            </span>

                            <span class="preview-title">
                                ${escapeHtml(title)}
                            </span>

                        </span>
                    `;


                button.addEventListener(
                    "click",
                    function() {

                        openArticle(
                            item.article
                        );

                    }
                );


                previews.appendChild(
                    button
                );

            }
        );

}


/* =====================================================
   ARTICLE MODAL
===================================================== */

const articleModal =
    document.getElementById(
        "articleModal"
    );

let currentModalArticle = null;


function fillArticleModal(
    article
) {

    if (!article) {
        return;
    }

    document
        .getElementById(
            "modalImage"
        )
        .src =
            article.image
            ||
            article.thumbnail
            ||
            CLUB_LOGO;

    document
        .getElementById(
            "modalCategory"
        )
        .textContent =
            localized(
                article,
                "category"
            )
            ||
            uiText("fallbackCategory");

    document
        .getElementById(
            "modalTitle"
        )
        .textContent =
            localized(
                article,
                "title"
            )
            ||
            uiText("fallbackTitle");

    document
        .getElementById(
            "modalDate"
        )
        .textContent =
            formatDate(
                article.published_at
                ||
                article.date
            );

    document
        .getElementById(
            "modalExcerpt"
        )
        .textContent =
            localized(
                article,
                "excerpt"
            )
            ||
            "";

    const content =
        localized(
            article,
            "content"
        )
        ||
        "";

    document
        .getElementById(
            "modalContent"
        )
        .innerHTML =
            window.LegionSupabase
                ?.sanitizeRichHtml
            ? window.LegionSupabase
                .sanitizeRichHtml(
                    content
                )
            : content;

}


function openArticle(
    article
) {

    if (!article) {
        return;
    }

    currentModalArticle =
        article;

    fillArticleModal(
        article
    );

    articleModal
        .classList
        .add(
            "active"
        );

    document.body
        .classList
        .add(
            "lock"
        );

}


function closeArticle() {

    currentModalArticle = null;

    articleModal
        .classList
        .remove(
            "active"
        );


    document.body
        .classList
        .remove(
            "lock"
        );

}


document
    .getElementById(
        "heroRead"
    )
    .addEventListener(
        "click",
        function() {

            openArticle(
                articles[
                    activeArticle
                ]
            );

        }
    );

heroTitle.addEventListener(
    "click",
    function() {

        openArticle(
            articles[
                activeArticle
            ]
        );

    }
);


document
    .getElementById(
        "articleClose"
    )
    .addEventListener(
        "click",
        closeArticle
    );


articleModal.addEventListener(
    "click",
    function(event) {

        if (
            event.target ===
            articleModal
        ) {

            closeArticle();

        }

    }
);


document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Escape"
        ) {

            if (
                articleModal
                    .classList
                    .contains(
                        "active"
                    )
            ) {

                closeArticle();

            }
            else if (
                menu
                    .classList
                    .contains(
                        "active"
                    )
            ) {

                menu
                    .classList
                    .remove(
                        "active"
                    );


                menuBtn
                    .classList
                    .remove(
                        "active"
                    );


                document.body
                    .classList
                    .remove(
                        "lock"
                    );


                closeSubmenus();

            }

        }

    }
);

loadArticles();


setInterval(
    function() {

        loadArticles(
            true
        );

    },
    60000
);


document.addEventListener(
    "visibilitychange",
    function() {

        if (
            document.visibilityState
            ===
            "visible"
        ) {

            loadArticles(
                true
            );

        }

    }
);
