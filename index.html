<!DOCTYPE html>
<html lang="pl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Legion Białystok</title>

  <link
    rel="icon"
    type="image/png"
    href="8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png"
  >

  <!-- IKONY SOCIAL MEDIA -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >


  <style>

    /* =====================================================
       RESET
    ===================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html,
    body {
      width: 100%;
      height: 100%;
    }


    html {
      overflow: hidden;
    }


    body {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #05070b;

      color: #fff;

      overflow: hidden;
    }


    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }


    button {
      font-family: inherit;
    }



    /* =====================================================
       LOGO + MENU
    ===================================================== */

    .top {

      position: absolute;

      top: 0;
      left: 0;

      z-index: 1200;

      display: flex;
      align-items: center;

      gap: 14px;

      padding:
        20px
        28px;

    }


    .logo {

      height: 78px;

      width: auto;

      object-fit: contain;

      filter:
        drop-shadow(
          0 5px 18px
          rgba(0,0,0,.55)
        );

    }



    /* =====================================================
       HAMBURGER
    ===================================================== */

    .menu-btn {

      position: relative;

      width: 48px;
      height: 48px;

      border: 0;

      background: transparent;

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 7px;

      cursor: pointer;

      z-index: 1300;

    }


    .menu-btn span {

      display: block;

      width: 30px;
      height: 3px;

      border-radius: 20px;

      background: #fff;

      box-shadow:
        0 2px 10px
        rgba(0,0,0,.4);

      transition:
        transform .3s ease,
        opacity .2s ease,
        width .2s ease;

    }


    .menu-btn span:nth-child(2) {

      width: 21px;

      margin-right: 9px;

    }


    .menu-btn.active span:nth-child(1) {

      transform:
        translateY(10px)
        rotate(45deg);

    }


    .menu-btn.active span:nth-child(2) {

      opacity: 0;

    }


    .menu-btn.active span:nth-child(3) {

      transform:
        translateY(-10px)
        rotate(-45deg);

    }



    /* =====================================================
       OVERLAY
    ===================================================== */

    .menu-overlay {

      position: fixed;

      inset: 0;

      z-index: 800;

      background:
        rgba(0,0,0,.58);

      backdrop-filter:
        blur(5px);

      -webkit-backdrop-filter:
        blur(5px);

      opacity: 0;

      visibility: hidden;

      transition:
        opacity .3s ease,
        visibility .3s ease;

    }


    .menu-overlay.open {

      opacity: 1;

      visibility: visible;

    }



    /* =====================================================
       MENU BOCZNE
    ===================================================== */

    .side-menu {

      position: fixed;

      top: 0;
      left: 0;

      width:
        min(400px, 92vw);

      height: 100vh;
      height: 100dvh;

      z-index: 1000;

      display: flex;

      flex-direction: column;

      padding-top: 105px;

      background:
        linear-gradient(
          145deg,
          rgba(15,15,16,.985),
          rgba(7,9,13,.985)
        );

      border-right:
        1px solid
        rgba(255,255,255,.08);

      box-shadow:
        30px 0 100px
        rgba(0,0,0,.50);

      transform:
        translateX(-105%);

      transition:
        transform
        .4s
        cubic-bezier(.77,0,.18,1);

      /*
        BRAK SCROLLA W MENU
      */

      overflow: hidden;

    }


    .side-menu.open {

      transform:
        translateX(0);

    }



    /* =====================================================
       NAWIGACJA
    ===================================================== */

    .menu-nav {

      width: 100%;

      flex: 1;

      min-height: 0;

      display: flex;

      flex-direction: column;

    }



    /* =====================================================
       GŁÓWNE PRZYCISKI MENU
    ===================================================== */

    .main-link,
    .dropdown-button {

      width: 100%;

      min-height: 52px;

      flex-shrink: 0;

      display: flex;

      align-items: center;

      justify-content:
        space-between;

      padding:
        12px
        25px;

      border: 0;

      border-bottom:
        1px solid
        rgba(255,255,255,.10);

      background:
        transparent;

      color: #fff;

      text-decoration: none;

      text-align: left;

      font-size: 20px;

      line-height: 1;

      font-weight: 900;

      text-transform:
        uppercase;

      cursor: pointer;

      transition:
        background .2s ease,
        padding-left .2s ease;

    }


    .main-link:hover,
    .dropdown-button:hover {

      background:
        rgba(255,255,255,.06);

      padding-left:
        31px;

    }



    /* =====================================================
       STRZAŁKA
    ===================================================== */

    .dropdown-arrow {

      position: relative;

      width: 13px;
      height: 13px;

      margin-left: 15px;

      flex-shrink: 0;

      transition:
        transform .25s ease;

    }


    .dropdown-arrow::before,
    .dropdown-arrow::after {

      content: "";

      position: absolute;

      top: 6px;

      width: 7px;
      height: 1px;

      background:
        rgba(255,255,255,.75);

    }


    .dropdown-arrow::before {

      left: 0;

      transform:
        rotate(45deg);

    }


    .dropdown-arrow::after {

      right: 1px;

      transform:
        rotate(-45deg);

    }


    .dropdown.active
    .dropdown-arrow {

      transform:
        rotate(180deg);

    }



    /* =====================================================
       PODMENU
    ===================================================== */

    .dropdown-content {

      max-height: 0;

      flex-shrink: 0;

      overflow: hidden;

      background:
        rgba(0,0,0,.25);

      transition:
        max-height .28s ease;

    }


    .dropdown.active
    .dropdown-content {

      max-height: 150px;

    }


    .dropdown-content a {

      display: block;

      padding:
        9px
        34px;

      border-bottom:
        1px solid
        rgba(255,255,255,.055);

      color:
        rgba(255,255,255,.68);

      text-decoration: none;

      font-size: 12px;

      line-height: 1.2;

      font-weight: 700;

      text-transform:
        uppercase;

      transition:
        color .2s ease,
        background .2s ease,
        padding-left .2s ease;

    }


    .dropdown-content a::before {

      content: "—";

      margin-right: 10px;

      color:
        rgba(255,255,255,.28);

    }


    .dropdown-content a:hover {

      color: #fff;

      background:
        rgba(255,255,255,.04);

      padding-left:
        41px;

    }



    /* =====================================================
       SOCIAL MEDIA
    ===================================================== */

    .socials {

      margin-top: auto;

      flex-shrink: 0;

      min-height: 66px;

      padding:
        12px
        25px
        14px;

      border-top:
        1px solid
        rgba(255,255,255,.10);

      display: flex;

      align-items: center;

      gap: 11px;

      background:
        rgba(0,0,0,.15);

    }


    .socials a {

      width: 38px;
      height: 38px;

      flex:
        0 0 38px;

      display: flex;

      align-items: center;

      justify-content: center;

      border:
        1px solid
        rgba(255,255,255,.30);

      border-radius: 50%;

      color:
        rgba(255,255,255,.72);

      text-decoration: none;

      font-size: 15px;

      transition:
        color .2s ease,
        border-color .2s ease,
        background .2s ease,
        transform .2s ease;

    }


    .socials a:hover {

      color: #fff;

      border-color:
        rgba(255,255,255,.9);

      background:
        rgba(255,255,255,.08);

      transform:
        translateY(-2px);

    }



    /* =====================================================
       SLIDER
    ===================================================== */

    .articles-slider {

      position: relative;

      width: 100vw;

      height: 100vh;
      height: 100dvh;

      overflow: hidden;

      background: #05070b;

    }



    /* =====================================================
       SLIDE
    ===================================================== */

    .slide {

      position: absolute;

      inset: 0;

      opacity: 0;

      visibility: hidden;

      transform:
        scale(1.03);

      transition:
        opacity .65s ease,
        transform 1s ease,
        visibility .65s ease;

      background-position:
        center;

      background-size:
        cover;

      background-repeat:
        no-repeat;

    }


    .slide.active {

      opacity: 1;

      visibility: visible;

      transform:
        scale(1);

    }



    /* =====================================================
       TŁA ARTYKUŁÓW
    ===================================================== */

    .slide-1 {

      background:

        radial-gradient(
          circle at 72% 28%,
          rgba(43,87,255,.38),
          transparent 35%
        ),

        linear-gradient(
          115deg,
          #080d16 0%,
          #172b50 52%,
          #06080d 100%
        );

    }


    .slide-2 {

      background:

        radial-gradient(
          circle at 75% 30%,
          rgba(100,65,255,.35),
          transparent 35%
        ),

        linear-gradient(
          115deg,
          #05070b,
          #1b2044 55%,
          #080910
        );

    }


    .slide-3 {

      background:

        radial-gradient(
          circle at 70% 30%,
          rgba(36,132,255,.35),
          transparent 35%
        ),

        linear-gradient(
          115deg,
          #06090e,
          #102f4f 55%,
          #05070b
        );

    }



    /* =====================================================
       CIEMNE PRZEJŚCIE NA TLE
    ===================================================== */

    .slide::before {

      content: "";

      position: absolute;

      inset: 0;

      z-index: 1;

      background:
        linear-gradient(
          90deg,

          rgba(0,0,0,.93) 0%,

          rgba(0,0,0,.72) 25%,

          rgba(0,0,0,.25) 58%,

          rgba(0,0,0,.08) 100%
        );

    }


    .slide::after {

      content: "";

      position: absolute;

      inset: 0;

      z-index: 1;

      background:
        linear-gradient(
          180deg,

          rgba(0,0,0,.20),

          transparent 40%,

          rgba(0,0,0,.72)
        );

    }



    /* =====================================================
       TREŚĆ ARTYKUŁU
    ===================================================== */

    .slide-content {

      position: absolute;

      left: 8vw;

      top: 50%;

      transform:
        translateY(-50%);

      z-index: 5;

      width:
        min(590px, 80vw);

    }


    .slide-category {

      display: block;

      margin-bottom: 13px;

      color:
        rgba(255,255,255,.72);

      font-size: 12px;

      font-weight: 800;

      text-transform:
        uppercase;

      letter-spacing:
        1.4px;

    }


    .slide h1 {

      max-width: 650px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size:
        clamp(
          42px,
          5vw,
          78px
        );

      line-height: .98;

      letter-spacing:
        -2.5px;

      font-weight: 700;

      text-shadow:
        0 7px 30px
        rgba(0,0,0,.35);

    }


    .slide-info {

      display: flex;

      align-items: center;

      gap: 8px;

      margin-top: 18px;

      color:
        rgba(255,255,255,.65);

      font-size: 12px;

    }


    .slide-info strong {

      color: #fff;

    }



    /* =====================================================
       OTWÓRZ ARTYKUŁ
    ===================================================== */

    .open-article {

      display:
        inline-flex;

      align-items: center;

      gap: 10px;

      margin-top: 25px;

      padding:
        12px
        19px;

      border: 0;

      border-radius: 9px;

      background: #c71920;

      color: #fff;

      font-size: 12px;

      font-weight: 800;

      cursor: pointer;

      transition:
        transform .2s ease,
        background .2s ease;

    }


    .open-article:hover {

      transform:
        translateY(-2px);

      background: #e11c24;

    }


    .open-article .arrow {

      font-size: 17px;

    }



    /* =====================================================
       STRZAŁKI SLIDERA
    ===================================================== */

    .slider-arrows {

      position: absolute;

      right: 8vw;

      top: 53%;

      z-index: 20;

      display: flex;

      gap: 8px;

    }


    .slider-arrow {

      width: 46px;
      height: 46px;

      border:
        1px solid
        rgba(255,255,255,.15);

      border-radius: 50%;

      background:
        rgba(255,255,255,.14);

      backdrop-filter:
        blur(10px);

      -webkit-backdrop-filter:
        blur(10px);

      color: #fff;

      font-size: 19px;

      cursor: pointer;

      transition:
        background .2s ease,
        transform .2s ease;

    }


    .slider-arrow:hover {

      background:
        rgba(255,255,255,.25);

      transform:
        scale(1.06);

    }



    /* =====================================================
       DÓŁ SLIDERA
    ===================================================== */

    .slider-bottom {

      position: absolute;

      left: 8vw;
      right: 8vw;

      bottom: 40px;

      z-index: 20;

      display: flex;

      align-items: center;

      gap: 30px;

    }



    /* =====================================================
       KROPKI
    ===================================================== */

    .slider-dots {

      display: flex;

      align-items: center;

      gap: 7px;

      flex-shrink: 0;

    }


    .dot {

      width: 11px;
      height: 11px;

      border: 0;

      border-radius: 20px;

      background:
        rgba(255,255,255,.30);

      cursor: pointer;

      transition:
        width .25s ease,
        background .25s ease;

    }


    .dot.active {

      width: 45px;

      background: #fff;

    }



    /* =====================================================
       PIGUŁKI ARTYKUŁÓW
    ===================================================== */

    .article-tabs {

      display: flex;

      gap: 10px;

      margin-left: auto;

      max-width: 720px;

    }


    .article-tab {

      width: 220px;

      min-height: 62px;

      border:
        1px solid
        rgba(255,255,255,.08);

      border-radius: 40px;

      background:
        rgba(50,50,55,.68);

      backdrop-filter:
        blur(12px);

      -webkit-backdrop-filter:
        blur(12px);

      color: #fff;

      display: flex;

      align-items: center;

      gap: 11px;

      padding:
        7px
        14px
        7px
        7px;

      cursor: pointer;

      text-align: left;

      transition:
        background .25s ease,
        transform .25s ease,
        border-color .25s ease;

    }


    .article-tab:hover,
    .article-tab.active {

      background:
        rgba(80,80,85,.82);

      border-color:
        rgba(255,255,255,.55);

      transform:
        translateY(-2px);

    }


    .tab-image {

      width: 47px;
      height: 47px;

      flex:
        0 0 47px;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        linear-gradient(
          145deg,
          #315cb4,
          #101725
        );

      border:
        2px solid
        rgba(255,255,255,.8);

      font-size: 12px;

      font-weight: 900;

    }


    .article-tab p {

      font-size: 11px;

      line-height: 1.35;

      color:
        rgba(255,255,255,.88);

    }



    /* =====================================================
       MODAL ARTYKUŁU
    ===================================================== */

    .article-modal {

      position: fixed;

      inset: 0;

      z-index: 3000;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 25px;

      background:
        rgba(0,0,0,.80);

      backdrop-filter:
        blur(15px);

      -webkit-backdrop-filter:
        blur(15px);

      opacity: 0;

      visibility: hidden;

      transition:
        opacity .3s ease,
        visibility .3s ease;

    }


    .article-modal.open {

      opacity: 1;

      visibility: visible;

    }


    .modal-window {

      position: relative;

      width:
        min(900px, 100%);

      max-height: 88vh;

      overflow-y: auto;

      padding:
        65px
        60px;

      border:
        1px solid
        rgba(255,255,255,.10);

      border-radius: 20px;

      background:
        linear-gradient(
          145deg,
          #111722,
          #080b10
        );

      box-shadow:
        0 40px 120px
        rgba(0,0,0,.65);

    }


    .close-modal {

      position: absolute;

      top: 20px;
      right: 20px;

      width: 42px;
      height: 42px;

      border: 0;

      border-radius: 50%;

      background:
        rgba(255,255,255,.08);

      color: #fff;

      font-size: 24px;

      cursor: pointer;

    }


    .modal-category {

      color: #7f9fff;

      font-size: 12px;

      font-weight: 800;

      text-transform:
        uppercase;

      letter-spacing:
        1.5px;

    }


    .modal-window h2 {

      margin-top: 13px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size:
        clamp(
          34px,
          5vw,
          60px
        );

      line-height: 1;

      letter-spacing:
        -2px;

    }


    .modal-window p {

      margin-top: 28px;

      max-width: 720px;

      color:
        rgba(255,255,255,.72);

      font-size: 16px;

      line-height: 1.8;

    }



    /* =====================================================
       NISKIE EKRANY - MENU NADAL BEZ SCROLLA
    ===================================================== */

    @media (max-height: 750px) {

      .side-menu {

        padding-top: 82px;

      }


      .main-link,
      .dropdown-button {

        min-height: 43px;

        padding:
          9px
          23px;

        font-size: 17px;

      }


      .dropdown-content a {

        padding:
          7px
          31px;

        font-size: 10px;

      }


      .dropdown.active
      .dropdown-content {

        max-height: 115px;

      }


      .socials {

        min-height: 54px;

        padding:
          8px
          23px
          10px;

      }


      .socials a {

        width: 34px;
        height: 34px;

        flex-basis: 34px;

        font-size: 13px;

      }

    }



    /* =====================================================
       TABLET
    ===================================================== */

    @media (max-width: 950px) {

      .article-tabs {

        display: none;

      }


      .slider-arrows {

        right: 30px;

      }

    }



    /* =====================================================
       TELEFON
    ===================================================== */

    @media (max-width: 650px) {

      .top {

        padding:
          14px
          16px;

        gap: 6px;

      }


      .logo {

        height: 60px;

      }


      .menu-btn {

        width: 42px;
        height: 42px;

      }


      .menu-btn span {

        width: 27px;

      }


      .menu-btn span:nth-child(2) {

        width: 19px;

        margin-right: 8px;

      }


      .side-menu {

        width: 100%;

        height: 100vh;
        height: 100dvh;

        padding-top: 78px;

        overflow: hidden;

      }


      .main-link,
      .dropdown-button {

        min-height: 46px;

        padding:
          10px
          21px;

        font-size: 17px;

      }


      .dropdown-content a {

        padding:
          8px
          29px;

        font-size: 10px;

      }


      .dropdown.active
      .dropdown-content {

        max-height: 125px;

      }


      .socials {

        min-height: 57px;

        padding:
          9px
          21px
          11px;

      }


      .socials a {

        width: 35px;
        height: 35px;

        flex-basis: 35px;

        font-size: 14px;

      }


      .slide::before {

        background:
          linear-gradient(
            90deg,
            rgba(0,0,0,.91),
            rgba(0,0,0,.28)
          );

      }


      .slide-content {

        left: 24px;
        right: 24px;

        top: 49%;

        width: auto;

      }


      .slide h1 {

        font-size:
          clamp(
            37px,
            12vw,
            59px
          );

        letter-spacing:
          -2px;

      }


      .slider-arrows {

        top: auto;

        right: 20px;

        bottom: 88px;

      }


      .slider-arrow {

        width: 40px;
        height: 40px;

      }


      .slider-bottom {

        left: 24px;
        right: 24px;

        bottom: 32px;

      }


      .article-modal {

        padding: 12px;

      }


      .modal-window {

        padding:
          60px
          24px
          30px;

        border-radius: 16px;

      }

    }



    /* =====================================================
       BARDZO NISKIE TELEFONY
    ===================================================== */

    @media
    (max-width: 650px)
    and
    (max-height: 650px) {

      .side-menu {

        padding-top: 68px;

      }


      .main-link,
      .dropdown-button {

        min-height: 39px;

        padding:
          8px
          20px;

        font-size: 15px;

      }


      .dropdown-content a {

        padding:
          6px
          28px;

        font-size: 9px;

      }


      .dropdown.active
      .dropdown-content {

        max-height: 100px;

      }


      .socials {

        min-height: 49px;

        padding:
          7px
          20px;

      }


      .socials a {

        width: 31px;
        height: 31px;

        flex-basis: 31px;

        font-size: 12px;

      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       LOGO + HAMBURGER
  ===================================================== -->

  <div class="top">

    <button
      class="menu-btn"
      id="menuBtn"
      type="button"
      aria-label="Otwórz menu"
      aria-expanded="false"
    >

      <span></span>
      <span></span>
      <span></span>

    </button>


    <img
      class="logo"
      src="8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png"
      alt="Legion Białystok"
    >

  </div>



  <!-- =====================================================
       OVERLAY
  ===================================================== -->

  <div
    class="menu-overlay"
    id="menuOverlay"
  ></div>



  <!-- =====================================================
       MENU BOCZNE
  ===================================================== -->

  <aside
    class="side-menu"
    id="sideMenu"
  >

    <nav class="menu-nav">

  <!-- =====================================================
       JAVASCRIPT
  ===================================================== -->

  <script>

    /* =====================================================
       MENU
    ===================================================== */

    const menuBtn =
      document.getElementById(
        "menuBtn"
      );


    const sideMenu =
      document.getElementById(
        "sideMenu"
      );


    const menuOverlay =
      document.getElementById(
        "menuOverlay"
      );



    function openMenu() {

      sideMenu
        .classList
        .add("open");


      menuOverlay
        .classList
        .add("open");


      menuBtn
        .classList
        .add("active");


      menuBtn.setAttribute(
        "aria-expanded",
        "true"
      );

    }



    function closeMenu() {

      sideMenu
        .classList
        .remove("open");


      menuOverlay
        .classList
        .remove("open");


      menuBtn
        .classList
        .remove("active");


      menuBtn.setAttribute(
        "aria-expanded",
        "false"
      );


      /*
        Po zamknięciu menu zamykamy też
        rozwinięte podmenu.
      */

      document
        .querySelectorAll(
          ".dropdown"
        )
        .forEach(item => {

          item
            .classList
            .remove("active");

        });

    }



    menuBtn.addEventListener(
      "click",
      () => {

        if (
          sideMenu
            .classList
            .contains("open")
        ) {

          closeMenu();

        } else {

          openMenu();

        }

      }
    );



    menuOverlay.addEventListener(
      "click",
      closeMenu
    );



    /* =====================================================
       ROZWIJANE MENU

       TYLKO JEDNO MOŻE BYĆ OTWARTE.
    ===================================================== */

    document
      .querySelectorAll(
        ".dropdown-button"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            const dropdown =
              button.parentElement;


            const wasOpen =
              dropdown
                .classList
                .contains("active");


            /*
              Zamykamy wszystkie.
            */

            document
              .querySelectorAll(
                ".dropdown"
              )
              .forEach(item => {

                item
                  .classList
                  .remove("active");

              });


            /*
              Jeżeli kliknięty wcześniej
              nie był otwarty,
              otwieramy właśnie jego.
            */

            if (!wasOpen) {

              dropdown
                .classList
                .add("active");

            }

          }
        );

      });



    /* =====================================================
       SLIDER
    ===================================================== */

    const slides =
      document.querySelectorAll(
        ".slide"
      );


    const dots =
      document.querySelectorAll(
        ".dot"
      );


    const tabs =
      document.querySelectorAll(
        ".article-tab"
      );


    const prevSlide =
      document.getElementById(
        "prevSlide"
      );


    const nextSlide =
      document.getElementById(
        "nextSlide"
      );


    let currentSlide = 0;



    function showSlide(index) {

      if (
        index < 0
      ) {

        index =
          slides.length - 1;

      }


      if (
        index >= slides.length
      ) {

        index = 0;

      }


      currentSlide =
        index;



      slides.forEach(
        slide => {

          slide
            .classList
            .remove("active");

        }
      );



      dots.forEach(
        dot => {

          dot
            .classList
            .remove("active");

        }
      );



      tabs.forEach(
        tab => {

          tab
            .classList
            .remove("active");

        }
      );



      slides[index]
        .classList
        .add("active");



      if (
        dots[index]
      ) {

        dots[index]
          .classList
          .add("active");

      }



      if (
        tabs[index]
      ) {

        tabs[index]
          .classList
          .add("active");

      }

    }



    nextSlide.addEventListener(
      "click",
      () => {

        showSlide(
          currentSlide + 1
        );

      }
    );



    prevSlide.addEventListener(
      "click",
      () => {

        showSlide(
          currentSlide - 1
        );

      }
    );



    dots.forEach(
      dot => {

        dot.addEventListener(
          "click",
          () => {

            showSlide(
              Number(
                dot.dataset.slide
              )
            );

          }
        );

      }
    );



    tabs.forEach(
      tab => {

        tab.addEventListener(
          "click",
          () => {

            showSlide(
              Number(
                tab.dataset.slide
              )
            );

          }
        );

      }
    );



    /* =====================================================
       ARTYKUŁY

       PÓŹNIEJ ZASTĄPIMY TO SUPABASE.
    ===================================================== */

    const articles = [

      {

        category:
          "Klub",

        title:
          "Nowy rozdział naszego klubu",

        text:
          "Tutaj znajdzie się pełna treść pierwszego artykułu. Później ten artykuł będzie pobierany automatycznie z Supabase i połączony ze stroną artykułów oraz panelem administratora."

      },


      {

        category:
          "Pierwsza drużyna",

        title:
          "Drużyna gotowa na kolejne wyzwanie",

        text:
          "Tutaj znajdzie się pełna treść artykułu dotyczącego pierwszej drużyny Legionu Białystok."

      },


      {

        category:
          "Mecz",

        title:
          "Wszystko gotowe na wielkie spotkanie",

        text:
          "Tutaj znajdzie się zapowiedź spotkania, informacje dotyczące meczu oraz pozostałe materiały przygotowane dla kibiców."

      }

    ];



    /* =====================================================
       MODAL
    ===================================================== */

    const articleModal =
      document.getElementById(
        "articleModal"
      );


    const closeModal =
      document.getElementById(
        "closeModal"
      );


    const modalCategory =
      document.getElementById(
        "modalCategory"
      );


    const modalTitle =
      document.getElementById(
        "modalTitle"
      );


    const modalText =
      document.getElementById(
        "modalText"
      );



    function openArticle(index) {

      const article =
        articles[index];


      if (!article) {
        return;
      }


      modalCategory.textContent =
        article.category;


      modalTitle.textContent =
        article.title;


      modalText.textContent =
        article.text;


      articleModal
        .classList
        .add("open");

    }



    function closeArticle() {

      articleModal
        .classList
        .remove("open");

    }



    document
      .querySelectorAll(
        ".open-article"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            openArticle(
              Number(
                button.dataset.article
              )
            );

          }
        );

      });



    closeModal.addEventListener(
      "click",
      closeArticle
    );



    articleModal.addEventListener(
      "click",
      event => {

        if (
          event.target ===
          articleModal
        ) {

          closeArticle();

        }

      }
    );



    /* =====================================================
       ESC
    ===================================================== */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key !==
          "Escape"
        ) {
          return;
        }


        if (
          articleModal
            .classList
            .contains("open")
        ) {

          closeArticle();

          return;

        }


        if (
          sideMenu
            .classList
            .contains("open")
        ) {

          closeMenu();

        }

      }
    );

  </script>
