<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Legion Białystok</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(229, 9, 20, 0.14),
          transparent 25%
        ),
        linear-gradient(
          135deg,
          #050506 0%,
          #0b0b0e 55%,
          #14080a 100%
        );

      overflow: hidden;
    }

    .logo {
      position: fixed;

      top: 20px;
      left: 24px;

      width: 72px;
      height: auto;

      display: block;

      filter:
        drop-shadow(0 8px 20px rgba(0, 0, 0, 0.55));
    }

    @media (max-width: 600px) {
      .logo {
        top: 16px;
        left: 16px;
        width: 60px;
      }
    }
  </style>
</head>

<body>

  <img
    src="8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png"
    alt="Legion Białystok"
    class="logo"
  >

</body>
</html>
