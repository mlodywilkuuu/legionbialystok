<!DOCTYPE html>
<html lang="pl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <!-- NAZWA W KARCIE PRZEGLĄDARKI -->
  <title>Legion Białystok</title>

  <!-- LOGO W KARCIE PRZEGLĄDARKI -->
  <link
    rel="icon"
    type="image/png"
    href="8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png"
  >

  <link
    rel="shortcut icon"
    type="image/png"
    href="8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png"
  >


  <style>

    /* ========================================
       RESET
    ======================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #05070b;
      color: #fff;

      overflow-x: hidden;
    }

    body.no-scroll {
      overflow: hidden;
    }


    /* ========================================
       LOGO + HAMBURGER
    ======================================== */

    .top {
      position: absolute;

      top: 0;
      left: 0;

      z-index: 1000;

      display: flex;
      align-items: center;

      gap: 17px;

      padding:
        24px
        32px;
    }


    /* ========================================
       HAMBURGER
    ======================================== */

    .menu-btn {
      position: relative;

      width: 50px;
      height: 50px;

      border: 0;
      outline: 0;

      background: transparent;

      display: flex;

      flex-direction: column;

      justify-content: center;
      align-items: center;

      gap: 7px;

      cursor: pointer;

      z-index: 1200;
    }


    .menu-btn span {
      display: block;

      width: 31px;
      height: 3px;

      border-radius: 50px;

      background: #fff;

      box-shadow:
        0 2px 10px
        rgba(0,0,0,.35);

      transition:
        transform .35s ease,
        opacity .25s ease,
        width .25s ease;
    }


    .menu-btn span:nth-child(2) {
      width: 22px;

      margin-right: 9px;
    }


    /* ========================================
       HAMBURGER -> X
    ======================================== */

    .menu-btn.active span:nth-child(1) {

      transform:
        translateY(10px)
        rotate(45deg);

    }


    .menu-btn.active span:nth-child(2) {

      opacity: 0;

    }


    .menu-btn.active span:nth-child(3) {

      transform:
        translateY(-10px)
        rotate(-45deg);

    }


    /* ========================================
       LOGO
    ======================================== */

    .logo {

      position: relative;

      height: 82px;
      width: auto;

      object-fit: contain;

      z-index: 1100;

      filter:
        drop-shadow(
          0 5px 18px
          rgba(0,0,0,.55)
        );

    }


    /* ========================================
       OVERLAY MENU
    ======================================== */

    .menu-overlay {

      position: fixed;

      inset: 0;

      z-index: 800;

      background:
        rgba(0,0,0,.55);

      backdrop-filter:
        blur(4px);

      -webkit-backdrop-filter:
        blur(4px);

      opacity: 0;

      visibility: hidden;

      transition:
        opacity .35s ease,
        visibility .35s ease;

    }


    .menu-overlay.open {

      opacity: 1;

      visibility: visible;

    }


    /* ========================================
       MENU
    ======================================== */

    .side-menu {

      position: fixed;

      top: 0;
      left: 0;

      width:
        min(410px, 90vw);

      height: 100vh;

      z-index: 900;

      padding:
        115px
        36px
        40px;

      background:
        linear-gradient(
          145deg,
          rgba(5,8,14,.97),
          rgba(10,18,34,.96)
        );

      box-shadow:
        30px 0 100px
        rgba(0,0,0,.50);

      transform:
        translateX(-105%);

      transition:
        transform
        .45s
        cubic-bezier(.77,0,.18,1);

      overflow-y: auto;

    }


    .side-menu.open {

      transform:
        translateX(0);

    }


    .side-menu nav {

      display: flex;

      flex-direction: column;

    }


    /* ========================================
       LINKI MENU
    ======================================== */

    .side-menu a {

      position: relative;

      display: block;

      padding:
        16px
        8px;

      color:
        rgba(255,255,255,.73);

      text-decoration: none;

      font-size: 20px;

      font-weight: 700;

      transition:
        color .25s ease,
        padding-left .25s ease;

    }


    .side-menu a::after {

      content: "";

      position: absolute;

      left: 8px;
      right: 8px;

      bottom: 0;

      height: 1px;

      background:
        linear-gradient(
          90deg,
          rgba(255,255,255,.32),
          rgba(255,255,255,.03)
        );

      transition:
        left .25s ease,
        background .25s ease;

    }


    .side-menu a:hover {

      color: #fff;

      padding-left: 17px;

    }


    .side-menu a:hover::after {

      left: 17px;

      background:
        linear-gradient(
          90deg,
          rgba(255,255,255,.65),
          rgba(255,255,255,.05)
        );

    }


    /* ========================================
       SLIDER
    ======================================== */

    .articles-slider {

      position: relative;

      width: 100%;

      height: 100vh;

      min-height: 650px;

      overflow: hidden;

      background: #05070b;

    }


    /* ========================================
       SLIDE
    ======================================== */

    .slide {

      position: absolute;

      inset: 0;

      opacity: 0;

      visibility: hidden;

      transform:
        scale(1.03);

      transition:
        opacity .65s ease,
        transform 1s ease,
        visibility .65s ease;

      background-position: center;

      background-size: cover;

      background-repeat: no-repeat;

    }


    .slide.active {

      opacity: 1;

      visibility: visible;

      transform:
        scale(1);

    }


    /* ========================================
       TŁA ARTYKUŁÓW
    ======================================== */

    .slide-1 {

      background:
        radial-gradient(
          circle at 72% 28%,
          rgba(43,87,255,.38),
          transparent 35%
        ),

        linear-gradient(
          115deg,
          #080d16 0%,
          #172b50 52%,
          #06080d 100%
        );

    }


    .slide-2 {

      background:
        radial-gradient(
          circle at 75% 30%,
          rgba(100,65,255,.35),
          transparent 35%
        ),

        linear-gradient(
          115deg,
          #05070b,
          #1b2044 55%,
          #080910
        );

    }


    .slide-3 {

      background:
        radial-gradient(
          circle at 70% 30%,
          rgba(36,132,255,.35),
          transparent 35%
        ),

        linear-gradient(
          115deg,
          #06090e,
          #102f4f 55%,
          #05070b
        );

    }


    /* ========================================
       CIEMNE PRZEJŚCIE
    ======================================== */

    .slide::before {

      content: "";

      position: absolute;

      inset: 0;

      background:
        linear-gradient(
          90deg,

          rgba(0,0,0,.92) 0%,

          rgba(0,0,0,.72) 25%,

          rgba(0,0,0,.25) 58%,

          rgba(0,0,0,.10) 100%
        );

      z-index: 1;

    }


    .slide::after {

      content: "";

      position: absolute;

      inset: 0;

      background:
        linear-gradient(
          180deg,

          rgba(0,0,0,.18),

          transparent 40%,

          rgba(0,0,0,.68)
        );

      z-index: 1;

    }


    /* ========================================
       TEKST ARTYKUŁU
    ======================================== */

    .slide-content {

      position: absolute;

      left: 8vw;

      top: 50%;

      transform:
        translateY(-50%);

      z-index: 3;

      width:
        min(580px, 80vw);

    }


    .slide-category {

      display: block;

      margin-bottom: 13px;

      font-size: 12px;

      font-weight: 800;

      text-transform: uppercase;

      letter-spacing: 1.4px;

      color:
        rgba(255,255,255,.72);

    }


    .slide h1 {

      max-width: 650px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size:
        clamp(
          42px,
          5vw,
          78px
        );

      line-height: .98;

      letter-spacing: -2.5px;

      font-weight: 700;

      text-shadow:
        0 7px 30px
        rgba(0,0,0,.35);

    }


    .slide-info {

      display: flex;

      align-items: center;

      gap: 8px;

      margin-top: 18px;

      font-size: 12px;

      color:
        rgba(255,255,255,.65);

    }


    .slide-info strong {

      color: #fff;

    }


    /* ========================================
       OTWÓRZ
    ======================================== */

    .open-article {

      display: inline-flex;

      align-items: center;

      gap: 10px;

      margin-top: 25px;

      padding:
        12px
        19px;

      border: 0;

      border-radius: 9px;

      background:
        #c71920;

      color: #fff;

      font-size: 12px;

      font-weight: 800;

      cursor: pointer;

      transition:
        transform .2s ease,
        background .2s ease;

    }


    .open-article:hover {

      transform:
        translateY(-2px);

      background:
        #e11c24;

    }


    /* ========================================
       STRZAŁKI
    ======================================== */

    .slider-arrows {

      position: absolute;

      right: 8vw;

      top: 53%;

      z-index: 10;

      display: flex;

      gap: 8px;

    }


    .slider-arrow {

      width: 46px;

      height: 46px;

      border:
        1px solid
        rgba(255,255,255,.15);

      border-radius: 50%;

      background:
        rgba(255,255,255,.14);

      backdrop-filter:
        blur(10px);

      -webkit-backdrop-filter:
        blur(10px);

      color: #fff;

      font-size: 19px;

      cursor: pointer;

      transition:
        background .2s ease,
        transform .2s ease;

    }


    .slider-arrow:hover {

      background:
        rgba(255,255,255,.25);

      transform:
        scale(1.06);

    }


    /* ========================================
       DÓŁ SLIDERA
    ======================================== */

    .slider-bottom {

      position: absolute;

      left: 8vw;
      right: 8vw;

      bottom: 45px;

      z-index: 15;

      display: flex;

      align-items: center;

      gap: 30px;

    }


    /* ========================================
       KROPKI
    ======================================== */

    .slider-dots {

      display: flex;

      align-items: center;

      gap: 7px;

      flex-shrink: 0;

    }


    .dot {

      width: 11px;

      height: 11px;

      border: 0;

      border-radius: 20px;

      background:
        rgba(255,255,255,.30);

      cursor: pointer;

      transition:
        width .25s ease,
        background .25s ease;

    }


    .dot.active {

      width: 45px;

      background: #fff;

    }


    /* ========================================
       DOLNE ARTYKUŁY
    ======================================== */

    .article-tabs {

      display: flex;

      gap: 10px;

      margin-left: auto;

      max-width: 720px;

    }


    .article-tab {

      width: 220px;

      min-height: 62px;

      border:
        1px solid
        rgba(255,255,255,.08);

      border-radius: 40px;

      background:
        rgba(50,50,55,.68);

      backdrop-filter:
        blur(12px);

      -webkit-backdrop-filter:
        blur(12px);

      color: #fff;

      display: flex;

      align-items: center;

      gap: 11px;

      padding:
        7px
        14px
        7px
        7px;

      cursor: pointer;

      text-align: left;

      transition:
        background .25s ease,
        transform .25s ease;

    }


    .article-tab:hover,
    .article-tab.active {

      background:
        rgba(80,80,85,.82);

      transform:
        translateY(-2px);

    }


    .tab-image {

      width: 47px;

      height: 47px;

      flex:
        0 0 47px;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        linear-gradient(
          145deg,
          #315cb4,
          #101725
        );

      border:
        2px solid
        rgba(255,255,255,.8);

      font-size: 13px;

      font-weight: 900;

    }


    .article-tab p {

      font-size: 11px;

      line-height: 1.35;

      color:
        rgba(255,255,255,.88);

    }


    /* ========================================
       MODAL ARTYKUŁU
    ======================================== */

    .article-modal {

      position: fixed;

      inset: 0;

      z-index: 3000;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 25px;

      background:
        rgba(0,0,0,.78);

      backdrop-filter:
        blur(15px);

      -webkit-backdrop-filter:
        blur(15px);

      opacity: 0;

      visibility: hidden;

      transition:
        opacity .3s ease,
        visibility .3s ease;

    }


    .article-modal.open {

      opacity: 1;

      visibility: visible;

    }


    .modal-window {

      position: relative;

      width:
        min(900px,100%);

      max-height: 88vh;

      overflow-y: auto;

      border:
        1px solid
        rgba(255,255,255,.10);

      border-radius: 20px;

      background:
        linear-gradient(
          145deg,
          #111722,
          #080b10
        );

      box-shadow:
        0 40px 120px
        rgba(0,0,0,.65);

      padding:
        65px
        60px;

    }


    .close-modal {

      position: absolute;

      top: 20px;

      right: 20px;

      width: 42px;

      height: 42px;

      border: 0;

      border-radius: 50%;

      background:
        rgba(255,255,255,.08);

      color: #fff;

      font-size: 24px;

      cursor: pointer;

    }


    .modal-category {

      color: #7f9fff;

      font-size: 12px;

      font-weight: 800;

      text-transform: uppercase;

      letter-spacing: 1.5px;

    }


    .modal-window h2 {

      margin-top: 13px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size:
        clamp(
          34px,
          5vw,
          60px
        );

      line-height: 1;

      letter-spacing: -2px;

    }


    .modal-window p {

      margin-top: 28px;

      max-width: 720px;

      color:
        rgba(255,255,255,.72);

      font-size: 16px;

      line-height: 1.8;

    }


    /* ========================================
       TABLET
    ======================================== */

    @media (max-width: 950px) {

      .article-tabs {
        display: none;
      }

      .slider-arrows {
        right: 30px;
      }

    }


    /* ========================================
       TELEFON
    ======================================== */

    @media (max-width: 650px) {

      .articles-slider {
        min-height: 600px;
      }


      .top {

        padding:
          16px
          18px;

        gap: 8px;

      }


      .logo {
        height: 62px;
      }


      .menu-btn {

        width: 44px;

        height: 44px;

      }


      .menu-btn span {
        width: 28px;
      }


      .menu-btn span:nth-child(2) {

        width: 20px;

        margin-right: 8px;

      }


      .side-menu {

        width: 100%;

        padding:
          95px
          25px
          30px;

      }


      .side-menu a {

        font-size: 19px;

        padding:
          14px
          5px;

      }


      .slide-content {

        left: 24px;

        right: 24px;

        top: 52%;

        width: auto;

      }


      .slide h1 {

        font-size:
          clamp(
            38px,
            12vw,
            60px
          );

        letter-spacing: -2px;

      }


      .slider-arrows {

        top: auto;

        right: 20px;

        bottom: 95px;

      }


      .slider-arrow {

        width: 40px;

        height: 40px;

      }


      .slider-bottom {

        left: 24px;

        right: 24px;

        bottom: 35px;

      }


      .article-modal {

        padding: 12px;

      }


      .modal-window {

        padding:
          65px
          25px
          35px;

        border-radius: 16px;

      }

    }

  </style>

</head>


<body>


  <!-- ========================================
       LOGO + MENU
  ======================================== -->

  <div class="top">

    <button
      class="menu-btn"
      id="menuBtn"
      aria-label="Otwórz menu"
      aria-expanded="false"
    >

      <span></span>
      <span></span>
      <span></span>

    </button>


    <img
      class="logo"
      src="8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png"
      alt="Legion Białystok"
    >

  </div>


  <!-- ========================================
       OVERLAY
  ======================================== -->

  <div
    class="menu-overlay"
    id="menuOverlay"
  ></div>


  <!-- ========================================
       MENU
  ======================================== -->

  <aside
    class="side-menu"
    id="sideMenu"
  >

    <nav>

      <a href="#">
        Strona główna
      </a>

      <a href="#">
        Aktualności
      </a>

      <a href="#">
        Drużyna
      </a>

      <a href="#">
        Mecze
      </a>

      <a href="#">
        Tabela
      </a>

      <a href="#">
        Galeria
      </a>

      <a href="#">
        Kontakt
      </a>

    </nav>

  </aside>


  <!-- ========================================
       SLIDER
  ======================================== -->

  <main class="articles-slider">


    <!-- ARTYKUŁ 1 -->

    <article class="slide slide-1 active">

      <div class="slide-content">

        <span class="slide-category">
          Legion Białystok
        </span>

        <h1>
          Nowy rozdział naszego klubu
        </h1>

        <div class="slide-info">

          <strong>
            Aktualności
          </strong>

          <span>•</span>

          <span>
            Dzisiaj
          </span>

        </div>


        <button
          class="open-article"
          data-article="0"
        >

          Otwórz →

        </button>

      </div>

    </article>


    <!-- ARTYKUŁ 2 -->

    <article class="slide slide-2">

      <div class="slide-content">

        <span class="slide-category">
          Pierwsza drużyna
        </span>

        <h1>
          Drużyna gotowa na kolejne wyzwanie
        </h1>

        <div class="slide-info">

          <strong>
            Drużyna
          </strong>

          <span>•</span>

          <span>
            1 dzień temu
          </span>

        </div>


        <button
          class="open-article"
          data-article="1"
        >

          Otwórz →

        </button>

      </div>

    </article>


    <!-- ARTYKUŁ 3 -->

    <article class="slide slide-3">

      <div class="slide-content">

        <span class="slide-category">
          Mecz
        </span>

        <h1>
          Wszystko gotowe na wielkie spotkanie
        </h1>

        <div class="slide-info">

          <strong>
            Mecze
          </strong>

          <span>•</span>

          <span>
            2 dni temu
          </span>

        </div>


        <button
          class="open-article"
          data-article="2"
        >

          Otwórz →

        </button>

      </div>

    </article>


    <!-- ========================================
         STRZAŁKI
    ======================================== -->

    <div class="slider-arrows">

      <button
        class="slider-arrow"
        id="prevSlide"
      >
        ‹
      </button>

      <button
        class="slider-arrow"
        id="nextSlide"
      >
        ›
      </button>

    </div>


    <!-- ========================================
         DÓŁ
    ======================================== -->

    <div class="slider-bottom">


      <div class="slider-dots">

        <button
          class="dot active"
          data-slide="0"
        ></button>

        <button
          class="dot"
          data-slide="1"
        ></button>

        <button
          class="dot"
          data-slide="2"
        ></button>

      </div>


      <div class="article-tabs">


        <button
          class="article-tab active"
          data-slide="0"
        >

          <div class="tab-image">
            LB
          </div>

          <p>
            Nowy rozdział naszego klubu
          </p>

        </button>


        <button
          class="article-tab"
          data-slide="1"
        >

          <div class="tab-image">
            LB
          </div>

          <p>
            Drużyna gotowa na kolejne wyzwanie
          </p>

        </button>


        <button
          class="article-tab"
          data-slide="2"
        >

          <div class="tab-image">
            LB
          </div>

          <p>
            Wszystko gotowe na wielkie spotkanie
          </p>

        </button>


      </div>

    </div>

  </main>


  <!-- ========================================
       OKNO ARTYKUŁU
  ======================================== -->

  <div
    class="article-modal"
    id="articleModal"
  >

    <div class="modal-window">

      <button
        class="close-modal"
        id="closeModal"
      >
        ×
      </button>


      <span
        class="modal-category"
        id="modalCategory"
      ></span>


      <h2
        id="modalTitle"
      ></h2>


      <p
        id="modalText"
      ></p>

    </div>

  </div>


  <script>

    /* ========================================
       MENU
    ======================================== */

    const menuBtn =
      document.getElementById(
        "menuBtn"
      );

    const sideMenu =
      document.getElementById(
        "sideMenu"
      );

    const menuOverlay =
      document.getElementById(
        "menuOverlay"
      );


    function openMenu() {

      sideMenu
        .classList
        .add("open");

      menuOverlay
        .classList
        .add("open");

      menuBtn
        .classList
        .add("active");

      document.body
        .classList
        .add("no-scroll");

    }


    function closeMenu() {

      sideMenu
        .classList
        .remove("open");

      menuOverlay
        .classList
        .remove("open");

      menuBtn
        .classList
        .remove("active");

      document.body
        .classList
        .remove("no-scroll");

    }


    menuBtn.addEventListener(
      "click",
      () => {

        if (
          sideMenu
            .classList
            .contains("open")
        ) {

          closeMenu();

        } else {

          openMenu();

        }

      }
    );


    menuOverlay.addEventListener(
      "click",
      closeMenu
    );


    /* ========================================
       SLIDER
    ======================================== */

    const slides =
      document.querySelectorAll(
        ".slide"
      );

    const dots =
      document.querySelectorAll(
        ".dot"
      );

    const tabs =
      document.querySelectorAll(
        ".article-tab"
      );

    let currentSlide = 0;


    function showSlide(index) {

      if (index < 0) {

        index =
          slides.length - 1;

      }


      if (
        index >= slides.length
      ) {

        index = 0;

      }


      currentSlide = index;


      slides.forEach(
        slide =>
          slide
            .classList
            .remove("active")
      );


      dots.forEach(
        dot =>
          dot
            .classList
            .remove("active")
      );


      tabs.forEach(
        tab =>
          tab
            .classList
            .remove("active")
      );


      slides[index]
        .classList
        .add("active");


      dots[index]
        .classList
        .add("active");


      tabs[index]
        .classList
        .add("active");

    }


    document
      .getElementById("nextSlide")
      .addEventListener(
        "click",
        () => {

          showSlide(
            currentSlide + 1
          );

        }
      );


    document
      .getElementById("prevSlide")
      .addEventListener(
        "click",
        () => {

          showSlide(
            currentSlide - 1
          );

        }
      );


    dots.forEach(dot => {

      dot.addEventListener(
        "click",
        () => {

          showSlide(
            Number(
              dot.dataset.slide
            )
          );

        }
      );

    });


    tabs.forEach(tab => {

      tab.addEventListener(
        "click",
        () => {

          showSlide(
            Number(
              tab.dataset.slide
            )
          );

        }
      );

    });

        text:
          "Tutaj znajdzie się zapowiedź spotkania, informacje dotyczące meczu oraz pozostałe materiały dla kibiców."

      }

    ];


    const modal =
      document.getElementById(
        "articleModal"
      );


    document
      .querySelectorAll(
        ".open-article"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            const article =
              articles[
                Number(
                  button.dataset.article
                )
              ];


            document
              .getElementById(
                "modalCategory"
              )
              .textContent =
                article.category;


            document
              .getElementById(
                "modalTitle"
              )
              .textContent =
                article.title;


            document
              .getElementById(
                "modalText"
              )
              .textContent =
                article.text;


            modal
              .classList
              .add("open");


            document.body
              .classList
              .add("no-scroll");

          }
        );

      });


    function closeArticle() {

      modal
        .classList
        .remove("open");

      document.body
        .classList
        .remove("no-scroll");

    }


    document
      .getElementById(
        "closeModal"
      )
      .addEventListener(
        "click",
        closeArticle
      );


    modal.addEventListener(
      "click",
      event => {

        if (
          event.target === modal
        ) {

          closeArticle();

        }

      }
    );


    /* ========================================
       ESC
    ======================================== */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape"
        ) {

          if (
            modal
              .classList
              .contains("open")
          ) {

            closeArticle();
