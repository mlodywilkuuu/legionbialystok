<!DOCTYPE html>
<html lang="pl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legion Białystok – Oficjalna Strona Klubu</title>
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        gold: {
                            DEFAULT: '#c5a059',
                            light: '#e6ca87',
                            dark: '#997a38',
                            accent: '#d4af37'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Efekt szkła (Glassmorphism) z eleganckim gradientem tekstowym */
        .glass-gold-text {
            background: linear-gradient(135deg, #997a38 0%, #ffd700 50%, #b8860b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
            /* Efekt subtelnej poświaty szklanej */
            filter: drop-shadow(0 4px 12px rgba(197, 160, 89, 0.25));
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(197, 160, 89, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
        }

        .hero-bg {
            background: linear-gradient(to bottom, rgba(255,255,255,0.92), rgba(252,251,250,0.98)), url('https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=1600&auto=format&fit=crop') center/cover no-repeat;
        }
    </style>
</head>
<body class="bg-[#fcfbfa] text-slate-900 font-sans antialiased selection:bg-gold selection:text-white min-h-screen flex flex-col justify-between">

    <!-- GÓRNY PASEK / NAWIGACJA -->
    <header class="w-full bg-white/90 backdrop-blur-md border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-sm">
        <div class="flex items-center space-x-5">
            <!-- MENU ROZWIJANE (HAMBURGER) -->
            <div class="relative group">
                <button class="bg-white border border-slate-200 text-slate-800 hover:bg-slate-50 w-12 h-12 rounded-xl flex items-center justify-center transition-all shadow-sm focus:outline-none cursor-pointer">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <div class="absolute left-0 top-full mt-2 w-64 bg-white border border-slate-200 rounded-2xl shadow-xl py-3 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50 space-y-1">
                    <a href="index.html" class="block px-5 py-2.5 text-xs font-bold uppercase tracking-wider text-slate-800 hover:bg-slate-100">Strona główna</a>
                    <a href="druzyna/index.html" class="block px-5 py-2.5 text-xs font-bold uppercase tracking-wider text-slate-800 hover:bg-slate-100">Pierwsza drużyna</a>
                    <a href="akademia/index.html" class="block px-5 py-2.5 text-xs font-bold uppercase tracking-wider text-slate-800 hover:bg-slate-100">Akademia</a>
                    <a href="tabela/index.html" class="block px-5 py-2.5 text-xs font-bold uppercase tracking-wider text-slate-800 hover:bg-slate-100">Tabela</a>
                    <a href="historia/index.html" class="block px-5 py-2.5 text-xs font-bold uppercase tracking-wider text-slate-800 hover:bg-slate-100">Historia</a>
                    
                    <!-- ROZWIJANA SEKCJA KLUB -->
                    <div class="relative group/sub border-t border-slate-100 my-1 pt-1">
                        <div class="px-5 py-2 text-xs font-bold uppercase tracking-wider text-slate-800 hover:bg-slate-100 flex justify-between items-center cursor-pointer">
                            <span>Klub</span>
                            <span class="text-[10px]">▼</span>
                        </div>
                        <div class="hidden group-hover/sub:block pl-4 space-y-1 bg-slate-50/50 py-1">
                            <a href="o-klubie/index.html" class="block px-4 py-2 text-xs font-bold uppercase tracking-wider text-slate-700 hover:bg-slate-100">O klubie</a>
                            <a href="ludzie-legionu/index.html" class="block px-4 py-2 text-xs font-bold uppercase tracking-wider text-slate-700 hover:bg-slate-100">Ludzie Legionu</a>
                            <a href="kontakt/index.html" class="block px-4 py-2 text-xs font-bold uppercase tracking-wider text-slate-700 hover:bg-slate-100">Kontakt</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- LOGO -->
            <a href="index.html" class="flex items-center">
                <img src="8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png" alt="Logo Legion" class="h-14 w-auto object-contain cursor-pointer">
            </a>
        </div>
    </header>

    <!-- HERO SECTION Z EFEKTEM SZKŁA I GRADIENTEM -->
    <main class="hero-bg flex-1 flex flex-col items-center justify-center text-center px-6 py-28 border-b border-slate-200">
        <div class="max-w-4xl space-y-4">
            <div class="glass-card inline-block px-8 py-6 rounded-3xl">
                <h1 class="text-4xl md:text-6xl font-black uppercase tracking-wider leading-tight">
                    <span class="glass-gold-text">Razem Tworzymy Historię</span>
                </h1>
            </div>
        </div>
    </main>

    <!-- STOPKA -->
    <footer class="w-full bg-white border-t border-slate-200 py-12 px-6">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6 text-center md:text-left">
            <div class="flex items-center space-x-3">
                <img src="8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png" alt="Logo" class="h-10 w-auto object-contain">
                <span class="text-xs font-black uppercase tracking-widest text-slate-700">Legion Białystok &copy; 2026</span>
            </div>
            <div class="text-xs text-slate-500">
                Wszystkie prawa zastrzeżone. Oficjalny serwis klubowy.
            </div>
        </div>
    </footer>

</body>
</html>
