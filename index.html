<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Klub</title>

  <style>

    /* =========================
       RESET
    ========================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;

      background: #05070b;
      color: #fff;

      overflow-x: hidden;
    }


    /* =========================
       GŁÓWNE TŁO
    ========================== */

    .hero {
      position: relative;

      width: 100%;
      min-height: 100vh;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 18% 20%,
          rgba(65, 105, 255, 0.30),
          transparent 35%
        ),

        radial-gradient(
          circle at 85% 75%,
          rgba(0, 100, 255, 0.20),
          transparent 40%
        ),

        linear-gradient(
          135deg,
          #040609 0%,
          #0b1220 48%,
          #05070b 100%
        );
    }


    /* =========================
       TEKSTURA TŁA
    ========================== */

    .hero::before {
      content: "";

      position: absolute;
      inset: 0;

      background:
        repeating-linear-gradient(
          120deg,

          transparent 0px,
          transparent 80px,

          rgba(255, 255, 255, 0.018) 81px,

          transparent 82px
        );

      pointer-events: none;
    }


    /* =========================
       NIEBIESKA POŚWIATA
    ========================== */

    .hero::after {
      content: "";

      position: absolute;

      width: 700px;
      height: 700px;

      left: -250px;
      top: -250px;

      border-radius: 50%;

      background:
        rgba(45, 95, 255, 0.20);

      filter: blur(130px);

      pointer-events: none;
    }


    /* =========================
       LOGO + HAMBURGER

       Nie ma tutaj żadnego
       osobnego paska.
    ========================== */

    .top {
      position: absolute;

      top: 0;
      left: 0;

      z-index: 100;

      display: flex;
      align-items: center;

      gap: 18px;

      padding:
        25px
        32px;
    }


    /* =========================
       HAMBURGER
    ========================== */

    .menu-btn {
      position: relative;

      width: 50px;
      height: 50px;

      border: none;
      outline: none;

      background: transparent;

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 7px;

      cursor: pointer;

      z-index: 200;
    }


    .menu-btn span {
      display: block;

      width: 32px;
      height: 3px;

      background: #ffffff;

      border-radius: 20px;

      transition:
        transform .35s ease,
        opacity .25s ease;
    }


    /* =========================
       HAMBURGER -> X
    ========================== */

    .menu-btn.active span:nth-child(1) {
      transform:
        translateY(10px)
        rotate(45deg);
    }


    .menu-btn.active span:nth-child(2) {
      opacity: 0;
    }


    .menu-btn.active span:nth-child(3) {
      transform:
        translateY(-10px)
        rotate(-45deg);
    }


    /* =========================
       LOGO
    ========================== */

    .logo {
      position: relative;

      height: 85px;
      width: auto;

      object-fit: contain;

      z-index: 200;

      filter:
        drop-shadow(
          0 8px 20px
          rgba(0, 0, 0, .40)
        );
    }


    /* =========================
       WYSUWANE MENU
    ========================== */

    .side-menu {
      position: fixed;

      top: 0;
      left: 0;

      width: min(390px, 88vw);
      height: 100vh;

      padding:
        112px
        35px
        40px;

      z-index: 90;


      /* przezroczyste tło */

      background:
        rgba(5, 8, 14, .72);


      /* rozmycie tego,
         co znajduje się pod menu */

      backdrop-filter:
        blur(22px);

      -webkit-backdrop-filter:
        blur(22px);


      /* schowane po lewej */

      transform:
        translateX(-105%);


      /* płynne wysuwanie */

      transition:
        transform
        .45s
        cubic-bezier(.77, 0, .18, 1);


      box-shadow:
        30px 0 80px
        rgba(0, 0, 0, .25);
    }


    /* otwarte menu */

    .side-menu.open {
      transform:
        translateX(0);
    }


    .side-menu nav {
      display: flex;

      flex-direction: column;
    }


    /* =========================
       PRZYCISKI MENU
    ========================== */

    .side-menu a {
      position: relative;

      display: block;

      color:
        rgba(255, 255, 255, .76);

      text-decoration: none;

      font-size: 22px;
      font-weight: 700;

      padding:
        15px
        10px;

      transition:
        color .25s ease,
        padding-left .25s ease;
    }


    /* =========================
       LINIA POD PRZYCISKAMI
    ========================== */

    .side-menu a::after {
      content: "";

      position: absolute;

      left: 10px;
      right: 10px;

      bottom: 0;

      height: 1px;

      background:
        linear-gradient(
          90deg,

          rgba(255, 255, 255, .38),

          rgba(255, 255, 255, .07)
        );

      opacity: .7;

      transition:
        left .25s ease,
        right .25s ease,
        opacity .25s ease;
    }


    /* =========================
       HOVER MENU
    ========================== */

    .side-menu a:hover {
      color: #ffffff;

      padding-left: 19px;
    }


    .side-menu a:hover::after {
      left: 19px;
      right: 0;

      opacity: 1;
    }


    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 700px) {

      .top {
        padding: 18px;

        gap: 10px;
      }


      .logo {
        height: 65px;
      }


      .menu-btn {
        width: 45px;
        height: 45px;
      }


      .menu-btn span {
        width: 29px;
      }


      .side-menu {
        width: 100%;

        padding:
          100px
          25px
          35px;
      }


      .side-menu a {
        font-size: 20px;

        padding:
          14px
          10px;
      }

    }

  </style>
</head>


<body>


  <!-- =========================
       GŁÓWNY EKRAN
  ========================== -->

  <section class="hero">


    <!-- =========================
         LOGO + HAMBURGER
    ========================== -->

    <div class="top">


      <!-- HAMBURGER -->

      <button
        class="menu-btn"
        id="menuBtn"
        aria-label="Otwórz menu"
        aria-expanded="false"
      >

        <span></span>
        <span></span>
        <span></span>

      </button>


      <!-- LOGO -->

      <img
        class="logo"
        src="8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png"
        alt="Logo klubu"
      >


    </div>


    <!-- =========================
         MENU
    ========================== -->

    <aside
      class="side-menu"
      id="sideMenu"
    >

      <nav>


        <a href="#">
          Strona główna
        </a>


        <a href="#">
          Aktualności
        </a>


        <a href="#">
          Drużyna
        </a>


        <a href="#">
          Mecze
        </a>


        <a href="#">
          Tabela
        </a>


        <a href="#">
          Galeria
        </a>


        <a href="#">
          Kontakt
        </a>


      </nav>

    </aside>


  </section>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script>

    const menuBtn =
      document.getElementById("menuBtn");


    const sideMenu =
      document.getElementById("sideMenu");


    /* =========================
       OTWÓRZ / ZAMKNIJ MENU
    ========================== */

    menuBtn.addEventListener(
      "click",
      () => {

        const isOpen =
          sideMenu
            .classList
            .toggle("open");


        menuBtn
          .classList
          .toggle(
            "active",
            isOpen
          );


        menuBtn.setAttribute(
          "aria-expanded",
          isOpen
        );

      }
    );


    /* =========================
       KLIKNIĘCIE W LINK
       ZAMYKA MENU
    ========================== */

    document
      .querySelectorAll(
        ".side-menu a"
      )
      .forEach(
        link => {

          link.addEventListener(
            "click",
            () => {

              sideMenu
                .classList
                .remove("open");


              menuBtn
                .classList
                .remove("active");


              menuBtn.setAttribute(
                "aria-expanded",
                "false"
              );

            }
          );

        }
      );


    /* =========================
       ESC ZAMYKA MENU
    ========================== */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape"
        ) {

          sideMenu
            .classList
            .remove("open");


          menuBtn
            .classList
            .remove("active");


          menuBtn.setAttribute(
            "aria-expanded",
            "false"
          );

        }

      }
    );

  </script>


</body>
</html>
