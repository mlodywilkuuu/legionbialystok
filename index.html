<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prace techniczne</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;

      font-family: "Outfit", sans-serif;
      color: #ffffff;

      background:
        radial-gradient(
          circle at 50% 25%,
          rgba(229, 9, 20, 0.24),
          transparent 34%
        ),
        radial-gradient(
          circle at 85% 85%,
          rgba(255, 91, 31, 0.14),
          transparent 32%
        ),
        radial-gradient(
          circle at 10% 90%,
          rgba(120, 0, 0, 0.16),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          #050506 0%,
          #0b0b0e 48%,
          #16090b 100%
        );

      overflow: hidden;
    }

    .content {
      width: min(100%, 760px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .logo {
      width: min(290px, 70vw);
      height: auto;
      display: block;
      margin-bottom: 28px;

      filter:
        drop-shadow(0 15px 35px rgba(0, 0, 0, 0.55))
        drop-shadow(0 0 28px rgba(229, 9, 20, 0.12));

      animation: logoAppear 0.9s ease both;
    }

    .line {
      width: 100px;
      height: 3px;
      margin-bottom: 25px;
      border-radius: 100px;

      background:
        linear-gradient(
          90deg,
          transparent,
          #e50914,
          #ff784f,
          transparent
        );

      animation: contentAppear 0.8s 0.15s ease both;
    }

    .title {
      font-size: clamp(38px, 7vw, 72px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -2px;

      background:
        linear-gradient(
          90deg,
          #ffffff 0%,
          #ffffff 35%,
          #ffb3b6 70%,
          #ff6b72 100%
        );

      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;

      animation: contentAppear 0.8s 0.25s ease both;
    }

    .subtitle {
      max-width: 560px;
      margin-top: 18px;

      color: rgba(255, 255, 255, 0.58);

      font-size: clamp(14px, 2vw, 18px);
      font-weight: 400;
      line-height: 1.65;
      letter-spacing: 0.15px;

      animation: contentAppear 0.8s 0.35s ease both;
    }

    /* NIEWIDZIALNY PRZYCISK */
    .secret-home-button {
      position: fixed;
      top: 0;
      right: 0;

      width: 90px;
      height: 90px;

      background: transparent;
      border: none;

      opacity: 0;

      cursor: pointer;
      z-index: 99999;
    }

    @keyframes logoAppear {
      from {
        opacity: 0;
        transform: translateY(-14px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes contentAppear {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 24px 18px;
      }

      .logo {
        width: min(220px, 65vw);
        margin-bottom: 24px;
      }

      .title {
        letter-spacing: -1.3px;
      }

      .subtitle {
        max-width: 340px;
      }

      .secret-home-button {
        width: 70px;
        height: 70px;
      }
    }
  </style>
</head>

<body>

  <!-- NIEWIDZIALNY PRZYCISK W PRAWYM GÓRNYM ROGU -->
  <a
    href="glowna.html"
    class="secret-home-button"
    aria-label="Przejdź do strony głównej"
  ></a>

  <main class="content">

    <img
      src="8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png"
      alt="Legion Białystok"
      class="logo"
    >

    <div class="line"></div>

    <h1 class="title">
      Prace techniczne
    </h1>

    <p class="subtitle">
      Aktualnie prowadzimy prace techniczne nad stroną. Wrócimy za chwilę.
    </p>

  </main>

</body>
</html>
