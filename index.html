<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Legion Białystok</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(229, 9, 20, 0.14),
          transparent 25%
        ),
        linear-gradient(
          135deg,
          #050506 0%,
          #0b0b0e 55%,
          #14080a 100%
        );

      font-family: Arial, sans-serif;
      color: #fff;

      overflow-x: hidden;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      position: fixed;
      top: 0;
      left: 0;

      width: 100%;
      height: 82px;

      padding: 0 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      z-index: 1000;

      background:
        linear-gradient(
          180deg,
          rgba(5, 5, 7, 0.9),
          rgba(5, 5, 7, 0.45),
          transparent
        );
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-right {
      position: relative;
    }

    /* =========================
       HAMBURGER
    ========================= */

    .menu-toggle {
      position: relative;

      width: 42px;
      height: 42px;

      border: 0;
      background: transparent;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 1200;
    }

    .hamburger {
      position: relative;
      width: 25px;
      height: 18px;
    }

    .hamburger span {
      position: absolute;
      left: 0;

      width: 25px;
      height: 2px;

      border-radius: 10px;
      background: #fff;

      transition:
        top 0.3s ease,
        transform 0.3s ease,
        opacity 0.2s ease,
        width 0.3s ease;
    }

    .hamburger span:nth-child(1) {
      top: 0;
    }

    .hamburger span:nth-child(2) {
      top: 8px;
      width: 18px;
    }

    .hamburger span:nth-child(3) {
      top: 16px;
    }

    .menu-toggle:hover .hamburger span:nth-child(2) {
      width: 25px;
    }

    .menu-toggle.active .hamburger span:nth-child(1) {
      top: 8px;
      transform: rotate(45deg);
    }

    .menu-toggle.active .hamburger span:nth-child(2) {
      opacity: 0;
      transform: translateX(-8px);
    }

    .menu-toggle.active .hamburger span:nth-child(3) {
      top: 8px;
      transform: rotate(-45deg);
    }

    /* =========================
       LOGO
    ========================= */

    .logo {
      width: 64px;
      height: auto;

      display: block;

      filter:
        drop-shadow(
          0 8px 20px rgba(0, 0, 0, 0.55)
        );
    }

    /* =========================
       LANGUAGES
    ========================= */

    .language-wrapper {
      position: relative;
    }

    .language-toggle {
      min-width: 120px;
      height: 42px;

      padding: 0 12px;

      border: 0;
      background: transparent;

      color: rgba(255, 255, 255, 0.82);

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 9px;

      font-size: 12px;
      font-weight: 700;

      cursor: pointer;
    }

    .flag {
      width: 24px;
      height: 16px;

      flex: 0 0 24px;

      display: block;
      overflow: hidden;

      border-radius: 2px;

      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.16);

      background: transparent;
    }

    .flag svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .language-arrow {
      font-size: 9px;
      transition: transform 0.25s ease;
    }

    .language-toggle.active .language-arrow {
      transform: rotate(180deg);
    }

    .language-menu {
      position: absolute;

      top: 50px;
      right: 0;

      width: 190px;

      padding: 8px;

      background:
        rgba(10, 10, 14, 0.72);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);

      border:
        1px solid rgba(255, 255, 255, 0.08);

      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.28);

      opacity: 0;
      visibility: hidden;

      transform: translateY(-8px);

      transition:
        opacity 0.2s ease,
        visibility 0.2s ease,
        transform 0.2s ease;
    }

    .language-menu.active {
      opacity: 1;
      visibility: visible;

      transform: translateY(0);
    }

    .language-option {
      width: 100%;
      min-height: 44px;

      padding: 0 12px;

      border: 0;
      background: transparent;

      color: rgba(255, 255, 255, 0.66);

      display: flex;
      align-items: center;

      gap: 11px;

      text-align: left;

      font-size: 12px;
      font-weight: 600;

      cursor: pointer;

      transition:
        background 0.2s ease,
        color 0.2s ease;
    }

    .language-option:hover,
    .language-option.active {
      background:
        rgba(255, 255, 255, 0.06);

      color: #fff;
    }

    /* =========================
       MENU PANEL
    ========================= */

    .menu-panel {
      position: fixed;

      top: 0;
      left: 0;

      width: min(360px, 88vw);
      height: 100vh;

      padding:
        102px
        28px
        30px;

      background:
        rgba(10, 10, 14, 0.42);

      backdrop-filter:
        blur(22px);

      -webkit-backdrop-filter:
        blur(22px);

      border-right:
        1px solid rgba(255, 255, 255, 0.08);

      box-shadow:
        20px 0 60px rgba(0, 0, 0, 0.28);

      transform: translateX(-105%);

      transition:
        transform 0.38s cubic-bezier(
          0.77,
          0,
          0.18,
          1
        );

      z-index: 900;

      overflow-y: auto;

      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .menu-panel::-webkit-scrollbar {
      display: none;
    }

    .menu-panel.active {
      transform: translateX(0);
    }

    .menu-list {
      list-style: none;
    }

    .menu-item {
      border-bottom:
        1px solid rgba(255, 255, 255, 0.06);
    }

    .menu-link,
    .submenu-toggle {
      width: 100%;
      min-height: 48px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border: 0;
      background: transparent;

      color: rgba(255, 255, 255, 0.86);

      font-size: 14px;
      font-weight: 700;

      letter-spacing: 1px;
      text-transform: uppercase;

      text-align: left;

      cursor: pointer;

      transition:
        color 0.2s ease,
        padding-left 0.2s ease;
    }

    .menu-link {
      text-decoration: none;
    }

    .menu-link:hover,
    .submenu-toggle:hover {
      color: #fff;
      padding-left: 8px;
    }

    .plus {
      position: relative;

      width: 18px;
      height: 18px;

      flex-shrink: 0;
    }

    .plus::before,
    .plus::after {
      content: "";

      position: absolute;

      top: 50%;
      left: 50%;

      width: 14px;
      height: 2px;

      background: #fff;

      border-radius: 5px;

      transform:
        translate(-50%, -50%);

      transition:
        transform 0.25s ease,
        opacity 0.25s ease;
    }

    .plus::after {
      transform:
        translate(-50%, -50%)
        rotate(90deg);
    }

    .submenu-toggle.active .plus::after {
      opacity: 0;
    }

    .submenu {
      max-height: 0;
      overflow: hidden;
      opacity: 0;

      transition:
        max-height 0.32s ease,
        opacity 0.25s ease;
    }

    .submenu.active {
      max-height: 420px;
      opacity: 1;
    }

    .submenu a {
      min-height: 40px;

      padding-left: 16px;

      display: flex;
      align-items: center;

      color:
        rgba(255, 255, 255, 0.46);

      font-size: 12px;
      font-weight: 600;

      letter-spacing: 0.7px;
      text-transform: uppercase;

      text-decoration: none;

      transition:
        color 0.2s ease,
        padding-left 0.2s ease;
    }

    .submenu a:hover {
      color: #fff;
      padding-left: 22px;
    }

    .overlay {
      position: fixed;

      inset: 0;

      background:
        rgba(0, 0, 0, 0.35);

      backdrop-filter:
        blur(3px);

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 0.3s ease,
        visibility 0.3s ease;

      z-index: 800;
    }

    .overlay.active {
      opacity: 1;
      visibility: visible;
    }

    /* =========================
       PAGE
    ========================= */

    .page-content {
      width: 100%;
      max-width: 1380px;

      margin: 0 auto;

      padding:
        150px
        32px
        80px;
    }

    /* =========================
       MATCH CENTER
    ========================= */

    .match-section {
      display: grid;

      grid-template-columns:
        minmax(0, 2fr)
        minmax(310px, 1fr);

      gap: 18px;
    }

    .matches-area {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 18px;
    }

    .match-card,
    .table-card {
      border:
        1px solid rgba(255, 255, 255, 0.07);

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.045),
          rgba(255, 255, 255, 0.018)
        );

      backdrop-filter:
        blur(16px);

      -webkit-backdrop-filter:
        blur(16px);

      border-radius: 18px;
    }

    .match-card {
      min-height: 330px;

      padding: 24px;

      display: flex;
      flex-direction: column;

      position: relative;

      overflow: hidden;
    }

    .match-card::before {
      content: "";

      position: absolute;

      width: 180px;
      height: 180px;

      right: -80px;
      top: -80px;

      border-radius: 50%;

      background:
        rgba(229, 9, 20, 0.10);

      filter: blur(10px);

      pointer-events: none;
    }

    .match-label {
      position: relative;
      z-index: 1;

      font-size: 11px;
      font-weight: 800;

      letter-spacing: 1.5px;

      color:
        rgba(255, 255, 255, 0.42);

      text-transform: uppercase;
    }

    .match-meta {
      margin-top: 10px;

      position: relative;
      z-index: 1;

      font-size: 12px;

      color:
        rgba(255, 255, 255, 0.42);
    }

    .match-teams {
      flex: 1;

      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        auto
        minmax(0, 1fr);

      align-items: center;

      gap: 14px;

      position: relative;
      z-index: 1;

      margin-top: 20px;
    }

    .team {
      min-width: 0;

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 13px;

      text-align: center;
    }

    .team-logo {
      width: 78px;
      height: 78px;

      object-fit: contain;

      display: block;
    }

    .team-logo-placeholder {
      width: 78px;
      height: 78px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        rgba(255, 255, 255, 0.06);

      border:
        1px solid rgba(255, 255, 255, 0.08);

      font-size: 24px;
      font-weight: 800;

      color:
        rgba(255, 255, 255, 0.65);
    }

    .team-name {
      max-width: 145px;

      font-size: 14px;
      font-weight: 700;

      line-height: 1.3;
    }

    .match-score {
      min-width: 74px;

      text-align: center;

      font-size: 34px;
      font-weight: 800;

      letter-spacing: -1px;
    }

    .match-time {
      text-align: center;

      font-size: 25px;
      font-weight: 800;
    }

    .match-status {
      margin-top: 6px;

      text-align: center;

      font-size: 10px;
      font-weight: 700;

      text-transform: uppercase;

      letter-spacing: 1px;

      color:
        rgba(255, 255, 255, 0.38);
    }

    /* =========================
       TABLE
    ========================= */

    .table-card {
      padding: 24px;
    }

    .table-top {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;

      margin-bottom: 18px;
    }

    .table-label {
      font-size: 11px;
      font-weight: 800;

      text-transform: uppercase;

      letter-spacing: 1.5px;

      color:
        rgba(255, 255, 255, 0.42);
    }

    .table-link {
      color:
        rgba(255, 255, 255, 0.48);

      text-decoration: none;

      font-size: 11px;
      font-weight: 700;

      transition:
        color 0.2s ease;
    }

    .table-link:hover {
      color: #fff;
    }

    .league-table {
      width: 100%;

      border-collapse: collapse;

      table-layout: fixed;
    }

    .league-table th {
      height: 34px;

      color:
        rgba(255, 255, 255, 0.28);

      font-size: 10px;
      font-weight: 700;

      text-transform: uppercase;

      text-align: center;
    }

    .league-table th:nth-child(1),
    .league-table td:nth-child(1) {
      width: 32px;
    }

    .league-table th:nth-child(2),
    .league-table td:nth-child(2) {
      text-align: left;
    }

    .league-table th:nth-child(3),
    .league-table td:nth-child(3),
    .league-table th:nth-child(4),
    .league-table td:nth-child(4) {
      width: 40px;
      text-align: center;
    }

    .league-table td {
      height: 47px;

      border-top:
        1px solid rgba(255, 255, 255, 0.05);

      font-size: 12px;

      color:
        rgba(255, 255, 255, 0.70);
    }

    .league-table .position {
      text-align: center;

      color:
        rgba(255, 255, 255, 0.34);
    }

    .league-table .club-name {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;

      padding-right: 8px;

      font-weight: 600;
    }

    .league-table .points {
      font-weight: 800;
      color: #fff;
    }

    .league-table tr.legion-row {
      background:
        rgba(229, 9, 20, 0.10);
    }

    .league-table tr.legion-row td {
      color: #fff;
    }

    .league-table tr.legion-row .club-name {
      font-weight: 800;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 1000px) {

      .match-section {
        grid-template-columns: 1fr;
      }

    }

    @media (max-width: 700px) {

      .header {
        height: 72px;
        padding: 0 15px;
      }

      .header-left {
        gap: 10px;
      }

      .logo {
        width: 54px;
      }

      .menu-panel {
        width: min(330px, 90vw);

        padding:
          92px
          22px
          30px;
      }

      .menu-link,
      .submenu-toggle {
        min-height: 46px;
      }

      .submenu a {
        min-height: 38px;
      }

      .language-toggle {
        min-width: 105px;
        padding: 0 8px;
      }

      .language-menu {
        width: 175px;
      }

      .flag {
        width: 22px;
        height: 15px;
        flex-basis: 22px;
      }

      .page-content {
        padding:
          115px
          15px
          50px;
      }

      .matches-area {
        grid-template-columns: 1fr;
      }

      .match-card {
        min-height: 295px;
        padding: 20px;
      }

      .table-card {
        padding: 20px;
      }

    }

    @media (max-width: 420px) {

      .team-logo,
      .team-logo-placeholder {
        width: 62px;
        height: 62px;
      }

      .team-name {
        font-size: 12px;
      }

      .match-score {
        min-width: 58px;
        font-size: 28px;
      }

      .match-time {
        font-size: 22px;
      }

    }
  </style>
</head>

  /* =========================

  const translations = {

      lastMatch: "Último partido",

      pointsColumn: "Pts"
    }

  };


  let currentLang =
    localStorage.getItem(
      "legion-language"
    ) || "pl";


  /* =========================
     MATCH RENDERING
  ========================= */

  function createTeamLogo(
    logo,
    name
  ) {

    if (logo) {

      return `
        <img
          src="${logo}"
          alt="${name}"
          class="team-logo"
        >
      `;

    }

    const initials =
      name
        .split(" ")
        .map(word => word[0])
        .join("")
        .slice(0, 2)
        .toUpperCase();

    return `
      <div
        class="team-logo-placeholder"
        aria-label="${name}"
      >
        ${initials}
      </div>
    `;

  }


  function renderMatches() {

    const language =
      translations[currentLang];

    const last =
      siteData.lastMatch;

    const next =
      siteData.nextMatch;


    document.getElementById(
      "matchesArea"
    ).innerHTML = `

      <article
        class="match-card"
        id="lastMatchCard"
      >

        <div class="match-label">
          ${language.lastMatch}
        </div>

        <div class="match-meta">
          ${last.date} · ${last.competition}
        </div>

        <div class="match-teams">

          <div class="team">

            ${createTeamLogo(
              last.homeLogo,
              last.homeTeam
            )}

            <div class="team-name">
              ${last.homeTeam}
            </div>

          </div>

          <div>

            <div class="match-score">
              ${last.homeScore}:${last.awayScore}
            </div>

            <div class="match-status">
              ${language.finished}
            </div>

          </div>

          <div class="team">

            ${createTeamLogo(
              last.awayLogo,
              last.awayTeam
            )}

            <div class="team-name">
              ${last.awayTeam}
            </div>

          </div>

        </div>

      </article>


      <article class="match-card">

        <div class="match-label">
          ${language.nextMatch}
        </div>

        <div class="match-meta">
          ${next.date} · ${next.competition}
        </div>

        <div class="match-teams">

          <div class="team">

            ${createTeamLogo(
              next.homeLogo,
              next.homeTeam
            )}

            <div class="team-name">
              ${next.homeTeam}
            </div>

          </div>

          <div>

            <div class="match-time">
              ${next.time}
            </div>

            <div class="match-status">
              ${language.upcoming}
            </div>

          </div>

          <div class="team">

            ${createTeamLogo(
              next.awayLogo,
              next.awayTeam
            )}

            <div class="team-name">
              ${next.awayTeam}
            </div>

          </div>

        </div>

      </article>

    `;

  }


  /* =========================
     TABLE RENDERING
  ========================= */

  function renderTable() {

    const tableBody =
      document.getElementById(
        "tableBody"
      );

    tableBody.innerHTML =
      siteData.table
        .map(
          function(row) {

            const legionClass =
              row.club === "Legion Białystok"
                ? "legion-row"
                : "";

            return `

              <tr class="${legionClass}">

                <td class="position">
                  ${row.position}
                </td>

                <td class="club-name">
                  ${row.club}
                </td>

                <td>
                  ${row.matches}
                </td>

                <td class="points">
                  ${row.points}
                </td>

              </tr>

            `;

          }
        )
        .join("");

  }


  /* =========================
     MENU
  ========================= */

  const menuToggle =
    document.getElementById(
      "menuToggle"
    );

  const menuPanel =
    document.getElementById(
      "menuPanel"
    );

  const overlay =
    document.getElementById(
      "overlay"
    );


  function openMenu() {

    menuToggle.classList.add("active");
    menuPanel.classList.add("active");
    overlay.classList.add("active");

    document.body.style.overflow =
      "hidden";

  }


  function closeMenu() {

    menuToggle.classList.remove("active");
    menuPanel.classList.remove("active");
    overlay.classList.remove("active");

    document.body.style.overflow = "";

  }


  menuToggle.addEventListener(
    "click",
    function() {

      if (
        menuPanel.classList.contains(
          "active"
        )
      ) {

        closeMenu();

      } else {

        openMenu();

      }

    }
  );


  overlay.addEventListener(
    "click",
    closeMenu
  );


  /* =========================
     SUBMENU
  ========================= */

  document
    .querySelectorAll(
      ".submenu-toggle"
    )
    .forEach(
      function(button) {

        button.addEventListener(
          "click",
          function() {

            const submenu =
              button.nextElementSibling;

            button.classList.toggle(
              "active"
            );

            submenu.classList.toggle(
              "active"
            );

          }
        );

      }
    );


  /* =========================
     LANGUAGE MENU
  ========================= */

  const languageToggle =
    document.getElementById(
      "languageToggle"
    );

  const languageMenu =
    document.getElementById(
      "languageMenu"
    );

  const currentLanguage =
    document.getElementById(
      "currentLanguage"
    );

  const currentFlag =
    document.getElementById(
      "currentFlag"
    );

  const languageOptions =
    document.querySelectorAll(
      ".language-option"
    );


  function closeLanguageMenu() {

    languageToggle.classList.remove(
      "active"
    );

    languageMenu.classList.remove(
      "active"
    );

  }


  languageToggle.addEventListener(
    "click",
    function(event) {

      event.stopPropagation();

      languageToggle.classList.toggle(
        "active"
      );

      languageMenu.classList.toggle(
        "active"
      );

    }
  );


  document.addEventListener(
    "click",
    function(event) {

      if (
        !languageMenu.contains(
          event.target
        ) &&
        !languageToggle.contains(
          event.target
        )
      ) {

        closeLanguageMenu();

      }

    }
  );


  document.addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Escape") {

        closeMenu();
        closeLanguageMenu();

      }

    }
  );


  /* =========================
     SET LANGUAGE
  ========================= */

  function setLanguage(lang) {

    const selected =
      translations[lang];

    if (!selected) {
      return;
    }

    currentLang = lang;

    document.documentElement.lang =
      lang;

    currentLanguage.textContent =
      selected.language;

    currentFlag.innerHTML =
      flags[lang];


    document
      .querySelectorAll(
        "[data-i18n]"
      )
      .forEach(
        function(element) {

          const key =
            element.dataset.i18n;

          if (selected[key]) {

            element.textContent =
              selected[key];

          }

        }
      );


    languageOptions.forEach(
      function(option) {

        option.classList.toggle(
          "active",
          option.dataset.lang === lang
        );

      }
    );


    localStorage.setItem(
      "legion-language",
      lang
    );


    renderMatches();
    renderTable();

    closeLanguageMenu();

  }


  languageOptions.forEach(
    function(option) {

      option.addEventListener(
        "click",
        function() {

          setLanguage(
            option.dataset.lang
          );

        }
      );

    }
  );


  /* =========================
     START
  ========================= */

  setLanguage(currentLang);

</script>
